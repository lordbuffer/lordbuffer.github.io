esume();}catch(e){}}\nfunction tone(f,d,type,vol){if(!audioOn)return;try{ensureAudio();if(!ac||ac.state!=='running')return;const o=ac.createOscillator(),v=ac.createGain();o.type=type||'triangle';o.frequency.value=f;v.gain.setValueAtTime(vol==null?.05:vol,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.1));o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.1));}catch(e){}}\nconst midi=m=>440*Math.pow(2,(m-69)/12);\nfunction pluck(f,t,d,type,vol){if(!ac)return;try{const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}\nfunction drum(t,d,vol){if(!ac)return;try{if(!noiseBuf){noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.25),ac.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}const s=ac.createBufferSource();s.buffer=noiseBuf;const v=ac.createGain();v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(v);v.connect(ac.destination);s.start(t);s.stop(t+d);}catch(e){}}\n\n/* ---------- musica 8bit originale ----------\n   Tema alieno rimbalzante: Am F C G, pentatonica minore.\n   La raccolta aggiunge strati; la Regina alza la tensione. */\nconst LEAD=[81,0,79,76,79,0,76,74,76,79,81,79,76,74,72,0,81,0,79,76,79,76,74,76,74,72,74,76,72,0,0,0];\nconst BASS=[45,0,45,45,41,0,41,41,48,0,48,48,43,0,43,43,45,0,45,45,41,0,41,41,48,0,48,48,43,43,47,0];\nconst STABS=[4,12,20,28],TRSEQ=[0,3,5,7],ARP=[0,3,7,12];\nlet musicStep=0,nextNote=0,musicLayer=0,tr=0,targetTr=0,queenMode=false;\nfunction scheduleStep(s,t,sd){\n  if(s===0||s===16)tr=targetTr;\n  const b=BASS[s];if(b)pluck(midi(b+tr),t,sd*.92,'triangle',.06);\n  const l=LEAD[s];if(l)pluck(midi(l+12+tr),t,sd*.8,'square',.024);\n  if(STABS.indexOf(s)>=0)for(const m of[69,72,76])pluck(midi(m+tr),t,.1,'square',.018);\n  if(s%4===0)pluck(55,t,.09,'sine',.11);\n  if(s%8===4)drum(t,.09,.05);else if(s%2===1)drum(t,.03,.012);\n  if(musicLayer>=1&&s%2===0)pluck(midi(69+tr+ARP[(s>>1)%4]),t,sd*1.5,'square',.014);\n  if(musicLayer>=2){if(s%8===0)pluck(midi(93+tr),t,sd*4,'triangle',.018);if(s%8===6)pluck(midi(88+tr),t,sd*2,'triangle',.015);}\n}\nfunction musicTick(){\n  if(!audioOn||!ac||ac.state!=='running')return;\n  if(!['play','menu','intro','credits'].includes(state))return;\n  const bpm=state==='credits'?96:state==='intro'?112:queenMode?168:150;\n  const sd=60/bpm/2;\n  if(nextNote<ac.currentTime)nextNote=ac.currentTime+.05;\n  while(nextNote<ac.currentTime+.15){scheduleStep(musicStep,nextNote,sd);nextNote+=sd;musicStep=(musicStep+1)%32;}\n}\n\n/* ---------- fusa sintetizzate + masticamento ---------- */\nlet purrNodes=null,munchTimer=null;\nfunction startPurr(){\n  if(!audioOn)return;try{ensureAudio();if(!ac||ac.state!=='running')return;stopPurr();\n  const len=Math.floor(ac.sampleRate*2),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);\n  let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.2;}\n  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;\n  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;\n  const gv=ac.createGain();gv.gain.value=.055;\n  const lfo=ac.createOscillator();lfo.frequency.value=23;const lg=ac.createGain();lg.gain.value=.04;\n  lfo.connect(lg);lg.connect(gv.gain);\n  const br=ac.createOscillator();br.frequency.value=.33;const bg2=ac.createGain();bg2.gain.value=.02;\n  br.connect(bg2);bg2.connect(gv.gain);\n  src.connect(lp);lp.connect(gv);gv.connect(ac.destination);\n  const o=ac.createOscillator();o.type='sine';o.frequency.value=51;\n  const og=ac.createGain();og.gain.value=.04;const ol=ac.createGain();ol.gain.value=.025;\n  lfo.connect(ol);ol.connect(og.gain);o.connect(og);og.connect(ac.destination);\n  src.start();o.start();lfo.start();br.start();\n  purrNodes=[src,o,lfo,br];\n  let nom=false;\n  munchTimer=setInterval(()=>{if(!ac||ac.state!=='running')return;const t=ac.currentTime;nom=!nom;\n    drum(t,.07,.05);pluck(nom?190:160,t+.05,.09,'triangle',.05);\n    if(Math.random()<.3)pluck(1200+Math.random()*600,t+.12,.05,'sine',.012);\n  },760);\n  }catch(e){}}\nfunction stopPurr(){if(purrNodes){for(const n of purrNodes){try{n.stop();}catch(e){}}purrNodes=null;}if(munchTimer){clearInterval(munchTimer);munchTimer=null;}}\n\n/* ---------- utilità ---------- */\nfunction vib(p){try{if(RM.navigator.vibrate)RM.navigator.vibrate(p);}catch(e){}}\nfunction rumblePad(d,s2,w){try{const gs=RM.navigator.getGamepads?RM.navigator.getGamepads():[];for(const p of gs){if(p&&p.connected&&p.vibrationActuator&&p.vibrationActuator.playEffect){p.vibrationActuator.playEffect('dual-rumble',{duration:d,strongMagnitude:s2,weakMagnitude:w}).catch(()=>{});break;}}}catch(e){}}\nlet toastT=null;\nfunction toast(t){const e=$('#kcToast');if(!e)return;e.textContent=t;e.classList.remove('hidden');if(toastT)clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add('hidden'),3200);}\nfunction clamp(v,a,b){return Math.max(a,Math.min(b,v));}\nfunction dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}\nfunction toggleFS(){const d=RM.document,el=$('#kcMain');if(d.fullscreenElement){d.exitFullscreen().catch(()=>{});return;}if(!el.requestFullscreen){toast('Schermo intero non disponibile in questo browser: prova F11 o apri il file scaricato');return;}try{const pr=el.requestFullscreen();if(pr&&pr.catch)pr.catch(()=>toast('Il browser blocca lo schermo intero in questa pagina: apri il file kitty-crusher-trilogia.html scaricato, oppure premi F11'));}catch(e){toast('Il browser blocca lo schermo intero: apri il file scaricato o premi F11');}}\n\n/* ---------- sprite pixel ---------- */\nfunction px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}\n/* I gatti canonici della trilogia (come nei capitoli 1 e 2):\n   maschio bianco/grigio = SCALATORE, femmina bianca/nera = DIFENSORE. */\nfunction drawCat(x,y,female,face,walk,sc,pawing){if(mobile)sc*=1.3;g.save();g.translate(Math.round(x),Math.round(y-14*sc));g.scale(face*sc,sc);\nconst white='#fff',black='#161616',grey='#9aa0a6';const bob=walk?Math.sin(clock*16)*1:0;g.translate(0,bob);\nconst tw=Math.sin(clock*9)*3;\npx(-9,6+tw,4,3,female?black:grey);px(-12,3+tw,3,4,female?black:grey);\npx(-6,2,12,9,white);px(-5,11,3,3,white);px(2,11,3,3,white);if(pawing){px(5,3,9,3,white);px(13,1,4,6,white);px(15,3,2,2,'#ff7ab8');}\nif(!female)px(-3,4,7,5,grey);\nconst hy=-6;\npx(-4,hy,10,9,white);px(-4,hy-3,3,4,white);px(3,hy-3,3,4,white);\nif(!female)px(-4,hy-3,3,3,grey);\nif(female)px(-1,hy,4,3,black);\npx(-3,hy+3,2,2,black);px(2,hy+3,2,2,black);px(0,hy+6,2,1,'#ff7ab8');\ng.restore();}\n/* gatto che mangia dalla ciotola: testa che scende, codina felice */\nfunction drawCatEating(x,y,female,face,sc,mt){g.save();g.translate(Math.round(x),Math.round(y-9*sc));g.scale(face*sc,sc);\nconst white='#fff',black='#161616',grey='#9aa0a6';\nconst tw=Math.sin(clock*11)*2;\npx(-9,4+tw,4,3,female?black:grey);px(-12,1+tw,3,4,female?black:grey);\npx(-7,1,13,8,white);px(-6,8,3,3,white);px(2,8,3,3,white);\nif(!female)px(-4,3,7,4,grey);\nconst dip=Math.sin(mt*6)>0?2.5:0; // testa giu' nella ciotola\nconst hy=-5+dip;\npx(-3,hy,10,8,white);px(-3,hy-3,3,4,white);px(4,hy-3,3,4,white);\nif(!female)px(-3,hy-3,3,3,grey);\nif(female)px(0,hy,4,3,black);\nif(dip<1){px(-1,hy+3,2,2,black);px(4,hy+3,2,2,black);}\npx(2,hy+6,2,1,'#ff7ab8');\ng.restore();}\nfunction heart(x,y,u,col){const m=['0110110','1111111','1111111','0111110','0011100','0001000'];for(let r=0;r<6;r++)for(let k=0;k<7;k++)if(m[r][k]==='1')px(x+k*u,y+r*u,u,u,col);}\n/* formica aliena */\nfunction drawAnt(a){g.save();g.translate(Math.round(a.x),Math.round(a.y));\nconst dir=Math.sign(G.sackX-a.x)||1;g.scale(dir,1);\nconst col=a.type==='armored'?'#8e5cc9':a.type==='fast'?'#e8833a':'#d94f3d';\nconst dk=a.type==='armored'?'#5b34a8':a.type==='fast'?'#a8531d':'#8f2b1f';\nconst lp=Math.sin(clock*22+a.seed)*2;\nfor(let i=0;i<3;i++){const lx=-6+i*6;g.strokeStyle=dk;g.lineWidth=2;\n  g.beginPath();g.moveTo(lx,2);g.lineTo(lx-2,7+(i%2?lp:-lp));g.stroke();}\npx(-11,-4,9,7,dk);px(-3,-5,10,8,col);px(6,-4,7,6,col);\npx(10,-7,2,2,'#ffe9b0');px(12,-9,1.6,3,dk);\nif(a.type==='armored'){px(-3,-8,10,4,'#c9c2e8');px(0,-10,5,2,'#8b84b8');}\nif(a.type==='fast'){px(-18,-3,5,2,'rgba(255,255,255,.5)');px(-16,1,4,1.6,'rgba(255,255,255,.35)');}\nif(a.hp<a.maxHp)px(-6,-12,12*(a.hp/a.maxHp),2,'#ff5d5d');\ng.restore();}\nfunction drawQueen(q){g.save();g.translate(Math.round(q.x),Math.round(q.y+Math.sin(clock*3)*3));\nconst bob=Math.sin(clock*6)*1.5;\nfor(let i=0;i<3;i++){const lx=-16+i*14;g.strokeStyle='#4a2364';g.lineWidth=3;\n  g.beginPath();g.moveTo(lx,4);g.lineTo(lx-4,14+(i%2?bob:-bob));g.stroke();}\npx(-26,-10,22,16,'#5b2d78');px(-6,-13,24,19,'#7d3c98');px(16,-10,14,12,'#7d3c98');\npx(-2,-24,3,8,'#f1c40f');px(4,-26,3,10,'#f1c40f');px(10,-24,3,8,'#f1c40f');px(-4,-18,20,4,'#f1c40f');\npx(20,-13,4,4,'#ffe9b0');px(26,-13,4,4,'#ffe9b0');px(21,-12,2,2,'#c1123f');px(27,-12,2,2,'#c1123f');\npx(24,-4,5,2,'#ffd1dc');\nfor(let i=0;i<q.hp;i++)px(-14+i*11,-34,8,5,'#ff5d8f');\ng.restore();}\n/* crocchetta */\nfunction drawKibble(o){const y=o.y;g.save();g.translate(Math.round(o.x),Math.round(y));\nconst c1=o.golden?'#ffd166':'#c98a3e',c2=o.golden?'#ffe9a8':'#e8b060',c3=o.golden?'#c9962a':'#a56a2a';\npx(-6,-4,12,9,c1);px(-4,-6,8,3,c2);px(-8,-1,4,5,c3);px(4,-1,4,5,c3);px(-2,-1,4,4,o.golden?'#fff3c9':'#f4d29a');\nif(o.golden){const sp=(clock*3+o.seed)%1;g.strokeStyle='rgba(255,225,140,'+(1-sp)+')';g.lineWidth=1;g.strokeRect(-10-sp*5,-10-sp*5,20+sp*10,20+sp*10);}\ng.restore();}\n/* scenografia */\nfunction drawBackground(){\n  const grd=g.createLinearGradient(0,0,0,VH);\n  grd.addColorStop(0,'#150b30');grd.addColorStop(.45,'#33184d');grd.addColorStop(.75,'#57274a');grd.addColorStop(1,'#2e4638');\n  g.fillStyle=grd;g.fillRect(0,0,VW,VH);\n  for(const s of G.stars){const tw=.25+.75*Math.abs(Math.sin(clock*1.5+s.a));g.fillStyle='rgba(215,235,255,'+(tw*.8)+')';px(s.x,s.y,s.r,s.r,'rgba(215,235,255,'+(tw*.8)+')');}\n  const sh=clock%11;\n  if(sh<.9){const k=sh/.9,sx=VW*.7-k*VW*.5,sy=40+k*110;g.strokeStyle='rgba(255,255,255,'+(1-k)*.9+')';g.lineWidth=2;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+46,sy-16);g.stroke();}\n  // pianeta anellato\n  const pxp=648,pyp=104,pr=56;\n  const pg=g.createLinearGradient(pxp,pyp-pr,pxp,pyp+pr);pg.addColorStop(0,'#e8a87c');pg.addColorStop(.55,'#c97a5a');pg.addColorStop(1,'#7a3d4e');\n  g.fillStyle=pg;g.beginPath();g.arc(pxp,pyp,pr,0,7);g.fill();\n  g.fillStyle='rgba(122,61,78,.5)';g.beginPath();g.arc(pxp-14,pyp-10,pr*.32,0,7);g.fill();\n  g.strokeStyle='rgba(255,214,150,.8)';g.lineWidth=5;g.beginPath();g.ellipse(pxp,pyp,pr*1.9,pr*.48,-.32,0,7);g.stroke();\n  g.strokeStyle='rgba(255,180,220,.42)';g.lineWidth=3;g.beginPath();g.ellipse(pxp,pyp,pr*2.25,pr*.62,-.32,0,7);g.stroke();\n  // due lune\n  px(88,66,22,22,'#9fe8ff');px(84,62,4,4,'#c9f4ff');px(96,72,6,6,'#6fb8d8');px(90,80,4,4,'#6fb8d8');\n  px(146,104,12,12,'#ffb8d9');px(148,107,4,4,'#d98bb0');\n  // navicella atterrata (a sinistra)\n  const sx=150,sy=G.groundY;\n  px(sx-34,sy-52,68,22,'#b9c6d8');px(sx-24,sy-62,48,12,'#8fa2bd');px(sx-10,sy-72,20,12,'#7b8dab');\n  px(sx-26,sy-48,14,10,'#46cfee');px(sx-8,sy-48,14,10,'#46cfee');px(sx+10,sy-48,14,10,'#46cfee');\n  px(sx-40,sy-32,8,22,'#5d6f88');px(sx+32,sy-32,8,22,'#5d6f88');px(sx-44,sy-12,16,5,'#3d4a5e');px(sx+28,sy-12,16,5,'#3d4a5e');\n  if(Math.sin(clock*2)>.6)px(sx-4,sy-86,8,5,'#ffdc8e');\n  // terreno\n  px(0,G.groundY,VW,VH-G.groundY,'#1d3a2e');px(0,G.groundY,VW,6,'#2e5a44');\n  for(const t of G.tufts){px(t.x,G.groundY-4-t.h,2,4+t.h,t.c);}\n  for(const m of G.shrooms){px(m.x,G.groundY-8,3,8,'#c9b8e8');px(m.x-3,G.groundY-13,9,5,m.c);if(Math.sin(clock*2+m.x)>.4)px(m.x-1,G.groundY-16,2,2,'#fff3b0');}\n}\nfunction drawTree(){\n  const tx=G.treeX,gy=G.groundY;\n  // Chiome a gradini, corteccia e piccole spore luminose.\n  for(const b of G.branches){const w=(b.x1-b.x0)*.62;for(const [dy,ww,hh,c] of [[-45,w*.65,13,'#174c3b'],[-32,w,14,'#1e6548'],[-18,w*.84,12,'#207a50'],[-40,w*.5,12,'#359b69']])px(tx-ww,b.y+dy,ww*2,hh,c);\n    for(let j=0;j<7;j++){const x=b.x0+15+j*(b.x1-b.x0-30)/6;px(x,b.y-26-(j%2)*10,5,3,j%2?'#7ee7c9':'#63bf78');}}\n  // tronco e rami\n  px(tx-14,G.branches[2].y-42,28,gy-G.branches[2].y+42,'#5c3d26');for(let y=G.branches[2].y-25;y<gy-15;y+=28){px(tx-9,y,5,15,'#795331');px(tx+4,y+9,7,3,'#362c23');}px(tx-20,gy-16,40,16,'#4a2f1d');\n  g.strokeStyle='#6b4a2f';g.lineWidth=10;\n  for(const b of G.branches){g.beginPath();g.moveTo(b.x0,b.y);g.lineTo(b.x1,b.y);g.stroke();}\n  g.lineWidth=7;for(const b of G.branches){g.beginPath();g.moveTo(tx,b.y+34);g.lineTo(tx,b.y);g.stroke();}\n  // grappoli di crocchette\n  for(const c of G.clusters){if(c.amount<=0)continue;\n    const b=G.branches[c.branch],n=Math.min(c.amount,5);\n    g.strokeStyle='#4a6b2f';g.lineWidth=2;g.beginPath();g.moveTo(c.x,b.y);g.lineTo(c.x,b.y+8);g.stroke();\n    for(let i=0;i<n;i++){const ox=-8+(i%3)*8,oy=8+Math.floor(i/3)*7;\n      px(c.x+ox-3,b.y+oy,6,6,'#c98a3e');px(c.x+ox-2,b.y+oy+1,3,3,'#f4d29a');}\n    if(c.golden)px(c.x+10,b.y+6,5,5,'#ffd166');}\n}\nfunction drawDispenser(){\n  const dx=G.dispX,top=150,bot=G.groundY-44,w=46;\n  px(dx-8,top-16,w+16,14,'#3d5a75');px(dx-4,top-26,10,12,'#2c4a66');px(dx+w-6,top-26,10,12,'#2c4a66');\n  g.fillStyle='rgba(20,30,50,.72)';g.fillRect(dx,top,w,bot-top);\n  const frac=clamp(G.kibble/G.goal,0,1),fh=(bot-top)*frac;\n  g.fillStyle='#ffb703';g.fillRect(dx,bot-fh,w,fh);\n  g.fillStyle='#e8b060';\n  for(let yy=bot-8;yy>bot-fh;yy-=11)for(let xx=dx+3;xx<dx+w-6;xx+=11)if(((xx+yy)%3)<2)g.fillRect(xx,yy,7,7);\n  g.strokeStyle='#bfe9ff';g.lineWidth=3;g.strokeRect(dx,top,w,bot-top);\n  px(dx-6,bot,w+12,8,'#3d5a75');\n  // ciotola\n  px(dx-4,bot+10,w+8,7,'#8b5cff');px(dx+2,bot+17,w-4,5,'#5b34a8');\n  g.font='bold 13px ui-monospace,monospace';g.textAlign='center';g.fillStyle='#ffd166';\n  g.fillText('DISPENSER',dx+w/2,top-32);\n  g.fillStyle='#fff';g.font='bold 14px ui-monospace,monospace';\n  g.fillText(G.kibble+' / '+G.goal,dx+w/2,bot+34);\n}\nfunction drawSack(){\n  const x=G.sackX,y=G.sackY;\n  g.fillStyle='#8a5a2b';g.beginPath();g.ellipse(x,y,32,40,0,0,7);g.fill();\n  g.fillStyle='#6b4423';g.fillRect(x-34,y-40,68,12);\n  g.fillStyle='#a9713a';g.beginPath();g.ellipse(x,y-38,26,8,0,0,7);g.fill();\n  px(x-14,y-46,8,6,'#c98a3e');px(x+4,y-48,8,6,'#c98a3e');px(x-4,y-50,8,6,'#e8b060');\n  const dmg=G.sackMax-G.sack;\n  if(dmg>0){g.strokeStyle='#2b1a0e';g.lineWidth=2;\n    for(let i=0;i<dmg;i++){g.beginPath();g.moveTo(x-16+i*10,y-16);g.lineTo(x-10+i*10,y+2);g.lineTo(x-16+i*10,y+14);g.stroke();}}\n  g.font='bold 10px ui-monospace,monospace';g.textAlign='center';g.fillStyle='#2b1a0e';g.fillText('SACCO',x,y+4);\n  if(G.sack<=2&&Math.sin(clock*6)>0){g.strokeStyle='rgba(255,80,80,.8)';g.lineWidth=3;g.beginPath();g.ellipse(x,y,38,46,0,0,7);g.stroke();}\n}\nfunction drawHole(h){\n  g.fillStyle='#120a1e';g.beginPath();g.ellipse(h.x,h.y,26,9,0,0,7);g.fill();\n  g.fillStyle='#3d2b1a';g.beginPath();g.ellipse(h.x,h.y+3,30,7,0,0,7);g.fill();\n  g.fillStyle='#120a1e';g.beginPath();g.ellipse(h.x,h.y,24,8,0,0,7);g.fill();\n  if(h.eyes>0){const a=Math.min(1,h.eyes);g.fillStyle='rgba(255,60,60,'+a+')';\n    px(h.x-7,h.y-6,3,3,'rgba(255,60,60,'+a+')');px(h.x+4,h.y-6,3,3,'rgba(255,60,60,'+a+')');}\n}\n\n/* ---------- stato di gioco ---------- */\nconst G={phase:'defense',level:1,kibble:0,goal:40,sack:5,sackMax:5,score:0,\n  hits:0,hitsNeeded:10,queen:null,timeLeft:0,activeCat:'defender',\n  ants:[],kibbles:[],clusters:[],particles:[],floaters:[],spawnTimer:1.2,aiCd:0,shakeCd:0,\n  sackX:700,sackY:0,treeX:400,dispX:56,groundY:470,branches:[],holes:[],stars:[],tufts:[],shrooms:[],\n  splash:null,shake:0};\nconst defender={x:700,y:0,tx:700,face:-1,swing:0};\nconst climber={x:400,branch:1,tx:400,face:1,swing:0};\nconst keys={left:false,right:false,up:false,down:false};\nlet devAutoplay=false;\n\nfunction layout(){\n  const nextMobile=RM.innerWidth<620;if(nextMobile!==mobile){mobile=nextMobile;VH=mobile?(['intro','cine','credits','end','epilogue'].includes(state)?700:1200):540;cv.height=VH;const branch=climber.branch;buildWorld();climber.branch=branch;climber.y=G.branches[branch].y;}$('#kcMain').classList.toggle('touch',RM.matchMedia('(pointer:coarse)').matches||mobile);\n  const fr=$('#kcFrame');if(!fr)return;\n  const r=fr.getBoundingClientRect();\n  const sc=Math.min(r.width/VW,r.height/VH);\n  cv.style.width=Math.round(VW*sc)+'px';cv.style.height=Math.round(VH*sc)+'px';\n}\nRM.addEventListener('resize',layout);\n\nfunction buildWorld(){\n  G.groundY=VH-70;G.sackY=G.groundY-2;G.sackX=700;G.treeX=400;G.dispX=56;\n  G.branches=[{y:G.groundY-72,x0:238,x1:562},{y:G.groundY-72-(VH-312)/3,x0:272,x1:528},{y:G.groundY-72-2*(VH-312)/3,x0:306,x1:494}];\n  G.holes=[110,215,320,480,585,668].map(x=>({x,y:G.groundY,eyes:0}));\n  G.stars=[];for(let i=0;i<70;i++)G.stars.push({x:Math.random()*VW,y:Math.random()*VH*.55,r:Math.random()<.3?2:1,a:Math.random()*6});\n  G.tufts=[];for(let i=0;i<46;i++)G.tufts.push({x:Math.random()*VW,h:2+Math.random()*6,c:i%3?'#2e5a44':'#3f7a54'});\n  G.shrooms=[];for(let i=0;i<7;i++)G.shrooms.push({x:40+Math.random()*720,c:i%2?'#ff8fb8':'#7ee7c9'});\n  defender.y=G.groundY;climber.branch=1;\n}\nfunction makeClusters(){\n  G.clusters=[];\n  G.branches.forEach((b,i)=>{for(let j=0;j<2;j++){\n    const t=.3+.4*j;\n    G.clusters.push({branch:i,x:b.x0+(b.x1-b.x0)*t+(Math.random()*36-18),amount:4+G.level,golden:Math.random()<.25});}});\n}\nfunction reset(){\n  G.kibble=0;G.sack=G.sackMax;G.level=1;G.hits=0;G.score=0;\n  G.ants=[];G.kibbles=[];G.particles=[];G.floaters=[];G.queen=null;\n  G.phase='defense';G.spawnTimer=1.1;G.activeCat='defender';G.splash=null;G.shake=0;\n  defender.x=620;defender.tx=620;climber.branch=1;climber.x=400;climber.tx=400;climber.y=G.branches[climber.branch].y;\n  musicLayer=0;queenMode=false;tr=0;targetTr=0;\n  makeClusters();\n}\nfunction floater(x,y,text,color){G.floaters.push({x,y,text,color:color||'#fff',life:1.3});}\nfunction burst(x,y,color,n){for(let i=0;i<(n||8);i++)G.particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220-60,life:.6,color});}\nfunction addScore(n,x,y,c){G.score+=n;if(x!=null)floater(x,y,'+'+n,c||'#ffd166');}\nfunction splash(txt,sub,c){G.splash={txt,sub,c:c||'#ffd166',t:1.7};}\n\n/* ---------- formiche e Regina ---------- */\nfunction spawnAnt(){\n  const hole=G.holes[Math.floor(Math.random()*G.holes.length)];\n  let type='normal';const r=Math.random();\n  if(G.level>=2&&r<.2)type='fast';else if(G.level>=2&&r<.4)type='armored';\n  const speed=(46+G.level*13)*(type==='fast'?1.7:1)*(type==='armored'?.72:1);\n  G.ants.push({hole,x:hole.x,y:hole.y-8,state:'emerge',t:0,hp:type==='armored'?2:1,maxHp:type==='armored'?2:1,type,speed,seed:Math.random()*9});\n  hole.eyes=0;\n}\nfunction holeTelegraph(){for(const h of G.holes)if(Math.random()<.5)h.eyes=1;}\nfunction hitAnt(a){\n  a.hp--;burst(a.x,a.y-6,'#d94f3d',6);G.shake=Math.max(G.shake,.06);\n  if(a.hp<=0){\n    const i=G.ants.indexOf(a);if(i>=0)G.ants.splice(i,1);\n    G.hits++;\n    addScore(a.type==='armored'?20:10,a.x,a.y-16,a.type==='armored'?'#c9a8ff':'#ffd166');\n    tone(500+Math.random()*220,.08,'square',.06);vib(30);\n    floater(a.x,a.y-30,'POF!','#fff');\n    if(G.hits>=G.hitsNeeded&&!G.queen)spawnQueen();\n  }else{addScore(5,a.x,a.y-16,'#c9a8ff');tone(300,.06,'square',.05);vib(20);}\n}\nfunction spawnQueen(){\n  G.queen={x:G.treeX,y:G.groundY-40,hp:3+Math.floor(G.level/3),maxHp:3+Math.floor(G.level/3),t:0};\n  splash('LA REGINA DEI FORMICAI!','Colpiscila prima che chiami rinforzi','#ff5d8f');\n  tone(180,.5,'sawtooth',.14);setTimeout(()=>tone(120,.6,'sawtooth',.12),180);\n  vib([120,60,180]);rumblePad(500,.9,.6);queenMode=true;\n}\nfunction hitQueen(){\n  if(!G.queen)return;\n  G.queen.hp--;G.shake=Math.max(G.shake,.15);\n  burst(G.queen.x,G.queen.y-10,'#ff5d8f',12);\n  tone(150,.15,'sawtooth',.12);vib(60);\n  if(G.queen.hp<=0){addScore(150,G.queen.x,G.queen.y-40,'#ff5d8f');G.queen=null;queenMode=false;startHarvest();}\n  else{addScore(50,G.queen.x,G.queen.y-40,'#ff8fb8');floater(G.queen.x,G.queen.y-56,'ANCORA!','#ff5d8f');}\n}\nfunction startHarvest(){\n  G.phase='harvest';G.timeLeft=20;G.ants=[];makeClusters();\n  musicLayer=2;\n  splash('COLONIA STORDITA!','RACCOLTA: scuoti i grappoli per 20 secondi','#7ee787');\n  tone(700,.25,'triangle',.1);setTimeout(()=>tone(1050,.3,'triangle',.09),160);\n  vib([40,40,40,40,120]);\n}\nfunction endHarvest(){\n  G.phase='defense';G.level++;G.hits=0;G.ants=[];G.spawnTimer=1;\n  addScore(100*(G.level-1),G.treeX,220,'#9fe8ff');\n  musicLayer=0;targetTr=TRSEQ[(G.level-1)%4];\n  splash('ONDATA '+G.level,'I formicai tornano alla carica!','#ff6b6b');\n  tone(180,.4,'sawtooth',.12);vib([80,60,120]);\n  holeTelegraph();\n}\n\n/* ---------- raccolta ---------- */\nfunction shakeCluster(c){\n  if(state!=='play'||G.phase!=='harvest')return;\n  const n=Math.min(c.amount,2+Math.floor(Math.random()*3));\n  if(n<=0)return;c.amount-=n;\n  for(let i=0;i<n;i++){\n    const golden=c.golden&&i===0||Math.random()<.12;\n    G.kibbles.push({x:c.x+(Math.random()*36-18),y:G.branches[c.branch].y+16,\n      vx:(Math.random()-.5)*150,vy:40,golden,seed:Math.random()*9});\n  }\n  tone(420,.1,'triangle',.07);vib(25);\n  burst(c.x,G.branches[c.branch].y+14,'#c98a3e',5);\n}\nfunction climberShake(){\n  let bestC=null,bd=1e9;\n  for(const c of G.clusters){if(c.branch===climber.branch&&c.amount>0){\n    const d=Math.abs(c.x-climber.x);if(d<bd){bd=d;bestC=c;}}}\n  if(G.phase==='harvest'&&bestC&&bd<86){shakeCluster(bestC);climber.swing=.25;}\n  else tone(200,.05,'sine',.04);\n}\nfunction catchKibble(k){\n  const v=k.golden?3:1;G.kibble+=v;\n  addScore(k.golden?75:25,k.x,G.groundY-46,k.golden?'#ffd166':'#7ee787');\n  burst(k.x,G.groundY-24,k.golden?'#ffd166':'#7ee787',6);\n  tone(k.golden?920:620,.09,'triangle',.07);vib(15);\n  if(G.kibble>=G.goal)victory();\n}\n\n/* ---------- zampata ---------- */\nfunction defenderSwipe(){\n  defender.swing=.25;tone(380,.08,'triangle',.06);vib(45);rumblePad(90,.6,.4);\n  let hitAny=false;\n  for(let i=G.ants.length-1;i>=0;i--){const a=G.ants[i];\n    if(Math.abs(a.x-defender.x)<112&&Math.abs(a.y-defender.y)<84){hitAnt(a);hitAny=true;}}\n  if(G.queen&&Math.abs(G.queen.x-defender.x)<132&&Math.abs(G.queen.y-defender.y)<150){hitQueen();hitAny=true;}\n  if(!hitAny)tone(200,.05,'sine',.03);\n}\nfunction action(){\n  if(state!=='play'||G.splash)return;\n  if(G.activeCat==='defender')defenderSwipe();else climberShake();\n}\nfunction switchCat(){\n  G.activeCat=G.activeCat==='defender'?'climber':'defender';\n  tone(660,.07,'triangle',.05);vib(20);\n  toast(G.activeCat==='defender'?'Controlli la DIFENSORE (bianco/nera)':'Controlli lo SCALATORE (bianco/grigio)');\n}\n\n/* ---------- IA del gatto non controllato ---------- */\nfunction updateAI(dt){\n  G.aiCd-=dt;G.shakeCd-=dt;\n  const drive=(cat,target,speed)=>{cat.tx=target;};\n  if(G.activeCat==='defender'||devAutoplay){\n    // lo scalatore IA cerca il grappolo piu' vicino\n    if(G.phase==='harvest'&&(G.activeCat==='defender')){\n      let bestC=null,bd=1e9;\n      for(const c of G.clusters){if(c.amount>0){const d=Math.abs(c.x-climber.x)+Math.abs(c.branch-climber.branch)*200;if(d<bd){bd=d;bestC=c;}}}\n      if(bestC){\n        if(climber.branch!==bestC.branch&&G.shakeCd<=0){climber.branch=bestC.branch;G.shakeCd=.6;}\n        climber.tx=clamp(bestC.x,G.branches[climber.branch].x0+14,G.branches[climber.branch].x1-14);\n        if(climber.branch===bestC.branch&&Math.abs(climber.x-bestC.x)<40&&G.shakeCd<=0){shakeCluster(bestC);climber.swing=.25;G.shakeCd=1.1;}\n      }\n    }\n  }\n  if(G.activeCat==='climber'||devAutoplay){\n    if(G.phase==='defense'){\n      if(G.queen){defender.tx=G.queen.x;\n        if(Math.abs(defender.x-G.queen.x)<100&&G.aiCd<=0){hitQueen();defender.swing=.25;G.aiCd=.75;}}\n      else{let bestA=null,bd=1e9;\n        for(const a of G.ants){const d=Math.abs(a.x-defender.x);if(d<bd){bd=d;bestA=a;}}\n        if(bestA){defender.tx=bestA.x;if(bd<92&&G.aiCd<=0){hitAnt(bestA);defender.swing=.25;G.aiCd=.6;}}}\n    }else{\n      let bestK=null,bd=1e9;\n      for(const k of G.kibbles){if(k.y<G.groundY-26){const d=Math.abs(k.x-defender.x);if(d<bd){bd=d;bestK=k;}}}\n      if(bestK)defender.tx=bestK.x;\n      else defender.tx=G.sackX-60;\n    }\n  }\n  if(devAutoplay&&G.activeCat==='defender'&&G.phase==='harvest'){\n    // in demo anche il giocatore \"difensore\" raccoglie\n    let bestK=null,bd=1e9;\n    for(const k of G.kibbles){if(k.y<G.groundY-26){const d=Math.abs(k.x-defender.x);if(d<bd){bd=d;bestK=k;}}}\n    if(bestK)defender.tx=bestK.x;\n  }\n}\n\n/* ---------- update ---------- */\nfunction updateAnts(dt){\n  for(let i=G.ants.length-1;i>=0;i--){\n    const a=G.ants[i];\n    if(a.state==='emerge'){a.t+=dt;a.y=a.hole.y-8-Math.min(a.t/.4,1)*20;if(a.t>.4)a.state='walk';}\n    else{a.x+=Math.sign(G.sackX-a.x)*a.speed*dt;a.y=G.groundY-10;}\n    if(Math.abs(a.x-G.sackX)<26){\n      G.sack--;if(G.kibble>0)G.kibble--;\n      floater(a.x,a.y-34,'RUBATA!','#ff6b6b');burst(a.x,a.y,'#ff6b6b',10);\n      tone(140,.25,'sawtooth',.12);vib(200);rumblePad(300,.9,.7);G.shake=Math.max(G.shake,.25);\n      G.ants.splice(i,1);\n      if(G.sack<=0){gameOver();return;}\n    }\n  }\n  for(const h of G.holes)h.eyes=Math.max(0,h.eyes-dt*.5);\n}\nfunction updateCats(dt){\n  const spd=280;\n  const move=(cat,min,max)=>{\n    if(cat===(G.activeCat==='defender'?defender:climber)&&(keys.left||padLeft)){cat.tx=clamp(cat.tx-spd*dt*2.2,min,max);cat.face=-1;}\n    if(cat===(G.activeCat==='defender'?defender:climber)&&(keys.right||padRight)){cat.tx=clamp(cat.tx+spd*dt*2.2,min,max);cat.face=1;}\n    const dx=cat.tx-cat.x;\n    if(Math.abs(dx)>2){cat.x+=clamp(dx,-spd*dt,spd*dt);cat.face=Math.sign(dx)||cat.face;cat.walk=true;}\n    else cat.walk=false;\n    cat.swing=Math.max(0,cat.swing-dt);\n  };\n  move(defender,40,760);\n  const b=G.branches[climber.branch];\n  if(keys.up){climber.branch=Math.max(0,climber.branch-1);keys.up=false;}\n  if(keys.down){climber.branch=Math.min(2,climber.branch+1);keys.down=false;}\n  move(climber,G.branches[climber.branch].x0+14,G.branches[climber.branch].x1-14);\n  climber.y=G.branches[climber.branch].y;\n}\nfunction updateKibbles(dt){\n  for(let i=G.kibbles.length-1;i>=0;i--){\n    const k=G.kibbles[i];\n    k.vy+=880*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;\n    if(k.y>=G.groundY-20){\n      if(Math.abs(defender.x-k.x)<56){catchKibble(k);G.kibbles.splice(i,1);if(state!=='play')return;}\n      else{floater(k.x,G.groundY-34,'persa!','#ff9d6b');G.kibbles.splice(i,1);tone(170,.12,'sine',.05);}\n    }\n  }\n}\nfunction updateFx(dt){\n  for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;if(p.life<=0)G.particles.splice(i,1);}\n  for(let i=G.floaters.length-1;i>=0;i--){const f=G.floaters[i];f.y-=42*dt;f.life-=dt;if(f.life<=0)G.floaters.splice(i,1);}\n  G.shake=Math.max(0,G.shake-dt*1.4);\n}\nfunction update(dt){\n  if(G.splash){G.splash.t-=dt;if(G.splash.t<=0)G.splash=null;updateFx(dt);return;}\n  if(G.phase==='defense'){\n    if(!G.queen){\n      G.spawnTimer-=dt;\n      const maxAnts=3+Math.floor(G.level/2);\n      if(G.spawnTimer<=0&&G.ants.length<maxAnts){spawnAnt();G.spawnTimer=Math.max(.5,1.7-G.level*.13);}\n    }else G.queen.t+=dt;\n    updateAnts(dt);\n  }else{\n    G.timeLeft-=dt;\n    if(G.timeLeft<=0)endHarvest();\n  }\n  if(state!=='play')return;\n  updateCats(dt);updateKibbles(dt);if(state!=='play')return;updateAI(dt);updateFx(dt);\n}\n\n/* ---------- disegno scena di gioco ---------- */\nfunction drawSplash(){\n  if(!G.splash)return;\n  const s=G.splash,a=clamp(s.t/.4,0,1);\n  g.fillStyle='rgba(8,4,20,'+(.72*Math.min(1,a+0.3))+')';g.fillRect(0,190,VW,150);\n  g.textAlign='center';\n  g.font='900 34px ui-monospace,monospace';g.fillStyle=s.c;\n  g.fillText(s.txt,VW/2,262);\n  g.font='700 16px ui-monospace,monospace';g.fillStyle='#dcd2f2';\n  g.fillText(s.sub,VW/2,296);\n}\nfunction drawHUD(){\n  if(mobile)return;\n  g.textAlign='left';g.font='bold 15px ui-monospace,monospace';\n  px(10,8,232,26,'rgba(8,4,20,.55)');\n  g.fillStyle='#ffd166';g.fillText('PUNTI '+G.score,18,26);\n  g.fillStyle='#8fa8c8';g.font='bold 11px ui-monospace,monospace';g.fillText('record '+Math.max(best,G.score),18,40);\n  g.textAlign='center';g.font='bold 13px ui-monospace,monospace';\n  if(G.phase==='defense'){\n    g.fillStyle=G.queen?'#ff5d8f':'#ff8f6b';\n    g.fillText(G.queen?'COLPISCI LA REGINA!':'ASSALTO · ondata '+G.level,VW/2,22);\n    g.fillStyle='#dcd2f2';g.font='bold 11px ui-monospace,monospace';\n    if(!G.queen)g.fillText('formiche eliminate '+G.hits+'/'+G.hitsNeeded,VW/2,38);\n  }else{\n    g.fillStyle='#7ee787';g.fillText('RACCOLTA! '+Math.ceil(G.timeLeft)+'s',VW/2,22);\n    px(VW/2-90,28,180,6,'rgba(255,255,255,.15)');\n    px(VW/2-90,28,180*clamp(G.timeLeft/20,0,1),6,'#7ee787');\n  }\n  g.textAlign='right';g.fillStyle='#dcd2f2';g.font='bold 12px ui-monospace,monospace';\n  g.fillText('ONDATA '+G.level,VW-16,22);\n  for(let i=0;i<G.sackMax;i++)heart(VW-118+i*22,28,2.4,i<G.sack?'#ff5d6c':'rgba(255,255,255,.14)');\n}\nfunction drawGame(){\n  drawBackground();\n  for(const h of G.holes)drawHole(h);\n  drawTree();\n  drawDispenser();\n  drawSack();\n  for(const a of G.ants)drawAnt(a);\n  if(G.queen)drawQueen(G.queen);\n  for(const k of G.kibbles)drawKibble(k);\n  // gatti\n  const act=G.activeCat;\n  drawCat(defender.x,defender.y,true,defender.face,defender.walk,2,defender.swing>0);\n  drawCat(climber.x,climber.y,false,climber.face,climber.walk,2,climber.swing>0);\n  // alone sul gatto attivo\n  const acat=act==='defender'?defender:climber;\n  g.strokeStyle='#ffd166';g.lineWidth=2;g.setLineDash([5,5]);\n  g.beginPath();g.arc(acat.x,acat.y-26,34,0,7);g.stroke();g.setLineDash([]);\n  g.font='bold 10px ui-monospace,monospace';g.textAlign='center';g.fillStyle='#ffd166';\n  g.fillText(act==='defender'?'DIFENSORE':'SCALATORE',acat.x,acat.y-66);\n  for(const p of G.particles){g.globalAlpha=Math.max(0,Math.min(1,p.life*2));px(p.x,p.y,4,4,p.color);}g.globalAlpha=1;\n  g.font='bold 15px ui-monospace,monospace';g.textAlign='center';\n  for(const f of G.floaters){g.globalAlpha=Math.max(0,Math.min(1,f.life));g.fillStyle=f.color;g.fillText(f.text,f.x,f.y);}g.globalAlpha=1;\n  drawHUD();\n  if(G.shake>0){/* la scossa e' applicata nel loop */}\n  drawSplash();\n}\n\n/* ---------- filmati (intro / finali) ---------- */\nlet cineT=0,cineWin=false,cineFlags={},cineParts=[],introFlags={};\nfunction cineOnce(k){if(cineFlags[k])return false;cineFlags[k]=1;return true;}\nfunction iTxt(s,x,y,c,size,al){g.font='bold '+(mobile?Math.round(size*1.45):size)+'px ui-monospace,monospace';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=c;g.fillText(s,Math.round(x),Math.round(y),VW-40);g.textBaseline='alphabetic';}\nfunction iGlow(x,y,r,c){const gg=g.createRadialGradient(x,y,0,x,y,r);gg.addColorStop(0,c);gg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gg;g.fillRect(x-r,y-r,2*r,2*r);}\nfunction spark(x,y,n,c1,c2){for(let i=0;i<n;i++)cineParts.push({x,y,vx:(Math.random()-.5)*240,vy:-Math.random()*200-40,t:.4+Math.random()*.4,c:Math.random()<.5?c1:c2});}\nfunction drawHoleCine(cx,cy,r,u){\n  iGlow(cx,cy,r*2.4,'rgba(139,92,255,.5)');\n  for(let k=0;k<4;k++){const rr=r*(1.15+k*.3);g.strokeStyle=k%2?'#e586d0':'#8b5cff';g.lineWidth=3;g.globalAlpha=.85-k*.16;\n    g.beginPath();g.ellipse(cx,cy,rr,rr*.44,-.32,u+k*1.1,u+k*1.1+4.2);g.stroke();}\n  g.globalAlpha=1;px(cx-r,cy-r,2*r,2*r,'#000');\n  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();\n}\nfunction drawShipCine(x,y,tilt){\n  g.save();g.translate(x,y);g.rotate(tilt||0);\n  px(-52,-20,104,30,'#b9c6d8');px(-38,-34,76,16,'#8fa2bd');px(-16,-46,32,14,'#7b8dab');\n  px(-40,-14,20,12,'#46cfee');px(-12,-14,20,12,'#46cfee');px(16,-14,20,12,'#46cfee');\n  px(-58,8,10,26,'#5d6f88');px(48,8,10,26,'#5d6f88');px(-64,30,22,7,'#3d4a5e');px(42,30,22,7,'#3d4a5e');\n  px(-6,12,12,8,'#ffd166');\n  g.restore();\n}\nfunction caption(t){if(!t)return;const fs=mobile?26:16,lh=mobile?34:22;g.font='bold '+fs+'px ui-monospace,monospace';const lines=[];let line='';for(const w of t.split(' ')){const next=line?line+' '+w:w;if(g.measureText(next).width>700&&line){lines.push(line);line=w;}else line=next;}if(line)lines.push(line);px(20,VH-32-lines.length*lh,760,lines.length*lh+14,'rgba(5,2,16,.9)');lines.forEach((l,i)=>{g.fillStyle='#ffe9b8';g.textAlign='center';g.fillText(l,VW/2,VH-23-(lines.length-1-i)*lh);});}\nfunction movieViewport(){if(mobile){VH=700;cv.height=VH;buildWorld();layout();}}\n\n/* --- INTRO --- */\nlet introT=0,introDone=false;\nfunction startIntro(){\n  ensureAudio();movieViewport();state='intro';introT=0;introFlags={};introDone=false;cineParts=[];\n  $('#kcPanel').classList.add('hidden');$('#kcSkip').classList.remove('hidden');\n  vib(30);\n}\nfunction endIntro(){\n  if(introDone)return;introDone=true;state='menu';\n  $('#kcSkip').classList.add('hidden');\n  if(audioOn&&ac)[69,73,76,81].forEach((m,i)=>pluck(midi(m),ac.currentTime+.12*i,.18,'square',.045));\n  vib([30,40,30,40,80]);\n  showMenu();\n}\nfunction updateIntro(dt){\n  introT+=dt;const t=introT;for(const p of cineParts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;}cineParts=cineParts.filter(p=>p.t>0);\n  if(t>=2&&cineOnce2('i1'))tone(300,.3,'triangle',.06);\n  if(t>=6.5&&cineOnce2('i2')){vib(40);tone(500,.2,'triangle',.05);}\n  if(t>=13.5&&cineOnce2('i3')){vib([30,30,60]);if(audioOn&&ac)[76,79,83,88].forEach((m,i)=>pluck(midi(m),ac.currentTime+.1*i,.16,'triangle',.05));}\n  if(t>=22&&cineOnce2('i4'))tone(160,.5,'sine',.08);\n  if(t>=28.5&&cineOnce2('i5')){vib([100,60,100,60,220]);rumblePad(700,.8,.6);tone(90,.8,'sawtooth',.12);}\n  if(t>=33.5&&cineOnce2('i6')){if(audioOn&&ac){drum(ac.currentTime,.25,.14);tone(120,.7,'sawtooth',.1);}}\n  if(t>=41)endIntro();\n}\nfunction cineOnce2(k){if(introFlags[k])return false;introFlags[k]=1;return true;}\nfunction drawIntroStars(spd){for(const s of G.stars){const sx=((s.x-introT*spd)%VW+VW)%VW;const tw=.3+.7*Math.abs(Math.sin(clock*2+s.a));px(sx,s.y,s.r,s.r,'rgba(215,235,255,'+(tw*.8)+')');}}\nfunction drawIntro(){\n  g.clearRect(0,0,VW,VH);const t=introT;\n  if(t<6){ // S1: via dal buco nero\n    g.fillStyle='#02040a';g.fillRect(0,0,VW,VH);\n    drawIntroStars(30+t*20);\n    const k=clamp(t/6,0,1),r=60-k*44;\n    if(r>6)drawHoleCine(150,110,r,t*1.4);\n    drawShipCine(320+t*22,300-t*6,.05);\n    if(t<1.2)iTxt('KITTY CRUSHER',VW/2,70,'rgba(255,166,220,'+clamp(t/.8,0,1)+')',40);\n    caption('Finalmente lontani dal buco nero…');\n  }else if(t<13){ // S2: discesa sul pianeta\n    const lt=t-6,k=clamp(lt/6,0,1);\n    const grd=g.createLinearGradient(0,0,0,VH);\n    grd.addColorStop(0,'#02040a');grd.addColorStop(k,'#33184d');grd.addColorStop(1,'#57274a');\n    g.fillStyle=grd;g.fillRect(0,0,VW,VH);\n    drawIntroStars(20);\n    const pyc=-140+k*210;\n    const pg=g.createLinearGradient(0,pyc-70,0,pyc+70);pg.addColorStop(0,'#e8a87c');pg.addColorStop(1,'#7a3d4e');\n    g.fillStyle=pg;g.beginPath();g.arc(640,pyc,64,0,7);g.fill();\n    g.strokeStyle='rgba(255,214,150,.8)';g.lineWidth=6;g.beginPath();g.ellipse(640,pyc,122,30,-.32,0,7);g.stroke();\n    px(92,80,20,20,'#9fe8ff');px(146,116,11,11,'#ffb8d9');\n    const syy=60+k*300;\n    drawShipCine(400,syy,.03*Math.sin(t*3));\n    if(k>.9){px(330,470,140,10,'#1d3a2e');spark(400,468,6,'#c9b8e8','#7ee7c9');}\n    px(0,480,VW,60,'#1d3a2e');\n    caption('…e un pianeta sconosciuto li accoglie: il pianeta delle crocchette.');\n  }else if(t<21){ // S3: la scoperta dell'Albero\n    drawBackground();\n    drawTree();\n    const lt=t-13;\n    const cx1=160+Math.min(lt*60,190),cx2=130+Math.min(lt*60,230);\n    drawCat(cx1,G.groundY,false,1,lt<3.4,2,false);\n    drawCat(cx2,G.groundY,true,1,lt<3.6,2,false);\n    if(lt>3){heart(356,G.groundY-96,2.2,'#ff6fa8');heart(392,G.groundY-110,2.2,'#ff6fa8');}\n    if(lt>3&&Math.sin(clock*5)>0)iTxt('✦',G.treeX+70,200,'#ffdc8e',20);\n    caption(\"Un albero carico di crocchette: il sogno di ogni gatto!\");\n  }else if(t<28){ // S4: il dispenser e' vuoto\n    drawBackground();drawTree();\n    G.kibble=0;drawDispenser();\n    drawCat(330,G.groundY,false,1,false,2,false);\n    drawCat(300,G.groundY,true,1,false,2,false);\n    iTxt('0',G.dispX+23,G.groundY-70,'#ff6b6b',22);\n    iTxt('…vuoto.',G.dispX+23,G.groundY-48,'#ff9d9d',13);\n    iTxt('?',330,G.groundY-70,'#fff',18);iTxt('?',300,G.groundY-66,'#fff',16);\n    caption('Ma il dispenser di bordo è vuoto: servono 40 crocchette per la dispensa.');\n  }else if(t<36){ // S5: i formicai si svegliano\n    drawBackground();drawTree();drawDispenser();\n    const lt=t-28,shakeAmt=Math.min(4,lt*2);\n    g.save();g.translate((Math.random()-.5)*shakeAmt,(Math.random()-.5)*shakeAmt);\n    for(const h of G.holes){h.eyes=clamp(lt/2,0,1);drawHole(h);}\n    drawCat(340,G.groundY,false,-1,false,2,false);\n    drawCat(460,G.groundY,true,1,false,2,false);\n    g.restore();\n    if(lt>4.5){g.fillStyle='rgba(20,4,10,.55)';g.beginPath();g.ellipse(VW/2,120,120,44,0,0,7);g.fill();\n      px(VW/2-30,104,16,10,'#2b0a12');px(VW/2+14,104,16,10,'#2b0a12');\n      px(VW/2-26,106,5,5,'#ff3b3b');px(VW/2+21,106,5,5,'#ff3b3b');}\n    caption('Ma le crocchette piacciono anche a loro: i formicai alieni difendono l\\u2019albero!');\n  }else{ // S6: titolo\n    g.fillStyle='rgba(7,3,19,.9)';g.fillRect(0,0,VW,VH);\n    drawIntroStars(6);\n    const a=clamp((t-36)/.8,0,1);\n    iTxt('KITTY CRUSHER',VW/2,190,'rgba(255,209,102,'+a+')',52);\n    iTxt('CROCCHETTE PAZZE',VW/2,246,'rgba(255,143,184,'+a+')',24);\n    iTxt('Difendi il sacco · Scuoti l\\u2019albero · Riempi il dispenser',VW/2,310,'rgba(220,210,242,'+a+')',15);\n    drawCat(VW/2-90,420,false,1,Math.sin(clock*4)>0,2.4,false);\n    drawCat(VW/2+90,420,true,-1,Math.sin(clock*4)>0,2.4,false);\n    if(Math.sin(clock*3)>0)iTxt('▼',VW/2,500,'rgba(255,233,184,'+a+')',18);\n    caption('');\n  }\n  for(const p of cineParts)px(p.x,p.y,4,4,p.c);\n}\n\n/* --- FINALI --- */\nfunction startCine(win){\n  $('#kcToast').classList.add('hidden');movieViewport();cineWin=!!win;state='cine';cineT=0;cineFlags={};cineParts=[];\n  entryOpen=false;clearKeys();\n  $('#kcPanel').classList.add('hidden');$('#kcSkip').classList.add('hidden');\n  if(G.score>best){best=G.score;saveBest();}\n  if(cineWin){\n    if(audioOn&&ac)[72,76,79,84].forEach((m,i)=>pluck(midi(m),ac.currentTime+.13*i,.22,'square',.05));\n    vib([40,50,40,50,120]);musicLayer=0;queenMode=false;\n  }else{\n    tone(220,.5,'sawtooth',.1);setTimeout(()=>tone(150,.7,'sawtooth',.09),300);\n    vib([180,80,260]);rumblePad(900,.9,.7);\n  }\n}\nfunction finishCine(){if(state!=='cine')return;stopPurr();if(cineWin)startCredits();else showEndPanel();}\nfunction skipCine(){if(state==='cine')finishCine();else if(state==='intro')endIntro();}\nfunction updateCine(dt){\n  cineT+=dt;const t=cineT;\n  for(const p of cineParts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;}\n  cineParts=cineParts.filter(p=>p.t>0);\n  if(cineWin){\n    if(t>=2.4&&cineOnce('w1')){vib(40);if(audioOn&&ac)[79,83,88].forEach((m,i)=>pluck(midi(m),ac.currentTime+.1*i,.2,'triangle',.05));}\n    if(t>=4.6&&cineOnce('w2')){startPurr();vib([60,80,60,80,60,80,200]);}\n    if(t>=9&&cineOnce('w3')){if(audioOn&&ac)[76,79,83,88,91].forEach((m,i)=>pluck(midi(m),ac.currentTime+.16*i,.3,'triangle',.04));}\n    if(t>=15)finishCine();\n  }else{\n    if(t>=1.2&&cineOnce('l1')){tone(180,.3,'sawtooth',.09);vib(120);}\n    if(t>=3&&cineOnce('l2')){tone(120,.5,'sawtooth',.08);}\n    if(t>=6.5)finishCine();\n  }\n}\nfunction drawBowl(x,y,full){\n  px(x-24,y,48,10,'#8b5cff');px(x-18,y+10,36,6,'#5b34a8');\n  if(full)for(let i=0;i<6;i++)px(x-16+(i%3)*11,y-6-Math.floor(i/3)*6,9,6,i%2?'#c98a3e':'#e8b060');\n}\nfunction drawWinCine(){\n  const t=cineT;\n  drawBackground();drawTree();\n  // dispenser che tracima\n  drawDispenser();\n  drawSack();\n  const dx=G.dispX+23,boty=G.groundY-44;\n  if(t<2.4){ // pioggia di crocchette dal dispenser\n    if(Math.random()<.5)cineParts.push({x:dx+(Math.random()-.5)*20,y:boty+6,vx:(Math.random()-.5)*140,vy:-40-Math.random()*80,t:.7,c:Math.random()<.5?'#c98a3e':'#e8b060'});\n    iTxt('40/40!',dx,boty-70,'#ffd166',20);\n    caption('Il dispenser è pieno: crocchette per tutto il viaggio!');\n  }else if(t<4.6){ // le ciotole si riempiono, i gatti arrivano di corsa\n    drawBowl(420,G.groundY-16,true);drawBowl(540,G.groundY-16,true);\n    drawCat(420-140+ (t-2.4)*64,G.groundY,false,1,true,2,false);\n    drawCat(540+140-(t-2.4)*64,G.groundY,true,-1,true,2,false);\n    caption('Pappa pronta: ognuno ha la sua ciotola.');\n  }else{ // la pappa e le fusa\n    drawBowl(420,G.groundY-16,true);drawBowl(540,G.groundY-16,true);\n    drawCatEating(420,G.groundY,false,-1,2,t);\n    drawCatEating(540,G.groundY,true,1,2,t+1.3);\n    if(Math.sin(t*3)>.2)heart(400+Math.sin(t*1.3)*10,G.groundY-96,2,'#ff6fa8');\n    if(Math.sin(t*2.4+2)>.3)heart(566,G.groundY-92,2,'#ff6fa8');\n    // onde di fusa\n    g.strokeStyle='rgba(255,182,217,'+(.5+.5*Math.sin(t*6))+')';g.lineWidth=2;\n    for(let i=1;i<=3;i++){g.beginPath();g.arc(480,G.groundY-60,20+i*16+(t*30%16),-.6,.6);g.stroke();}\n    caption(t<9?'Fusa a motore acceso…':'Pance piene, cuori leggeri: la trilogia dei gatti spaziali è compiuta.');\n  }\n  for(const p of cineParts){px(p.x,p.y,4,4,p.c);}\n}\nfunction drawLoseCine(){\n  const t=cineT;\n  drawBackground();drawTree();drawDispenser();\n  // sacco squarciato\n  const x=G.sackX,y=G.sackY;\n  g.fillStyle='#8a5a2b';g.beginPath();g.ellipse(x,y+10,34,26,0,0,7);g.fill();\n  g.strokeStyle='#2b1a0e';g.lineWidth=3;g.beginPath();g.moveTo(x-20,y-8);g.lineTo(x,y+8);g.lineTo(x+18,y-6);g.stroke();\n  // formiche che portano via le crocchette\n  for(let i=0;i<6;i++){\n    const ax=x-20-((t*46+i*70)%260),ay=G.groundY-10;\n    drawAnt({x:ax,y:ay,type:'normal',hp:1,maxHp:1,seed:i});\n    px(ax-4,ay-18,7,6,'#c98a3e');\n  }\n  // gatti abbattuti (orecchie basse simulate con testa china)\n  drawCat(340,G.groundY,false,1,false,2,false);\n  drawCat(460,G.groundY,true,-1,false,2,false);\n  iTxt('…',340,G.groundY-64,'#8fa8c8',18);iTxt('…',460,G.groundY-64,'#8fa8c8',18);\n  caption('Il sacco è vuoto e i formicai festeggiano. Ma i gatti non mollano mai: riprova!');\n}\n\n/* ---------- pannello menu / fine partita ---------- */\nconst CHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';\nlet entryOpen=false,wheelIdx=[0,0,0],wheelSteps=[],focusCol=0;\nfunction clearKeys(){for(const k in keys)keys[k]=false;}\nfunction setFocusCol(c){focusCol=c;const ws=$('#kcWheels');if(!ws)return;[...ws.children].forEach((el,k)=>el.classList.toggle('focus',k===c));}\nfunction wheelTick(){vib(3);tone(880,.03,'square',.04);}\nfunction buildWheels(){\n  const ws=$('#kcWheels');if(!ws)return;ws.innerHTML='';wheelIdx=[0,0,0];wheelSteps=[];\n  for(let c=0;c<3;c++){\n    const col=RM.document.createElement('div');col.className='wheelcol';\n    const up=RM.document.createElement('button');up.className='warr';up.type='button';up.textContent='▲';\n    const w=RM.document.createElement('div');w.className='wheel';\n    const tr2=RM.document.createElement('div');tr2.className='wtrack';\n    for(const ch of CHS){const it=RM.document.createElement('div');it.className='witem';it.textContent=ch;tr2.appendChild(it);}\n    const dn=RM.document.createElement('button');dn.className='warr';dn.type='button';dn.textContent='▼';\n    w.appendChild(tr2);col.appendChild(up);col.appendChild(w);col.appendChild(dn);ws.appendChild(col);\n    let idx=Math.max(0,CHS.indexOf((lastName[c]||'A').toUpperCase()));wheelIdx[c]=idx;\n    const setI=(n,anim)=>{const o=idx;idx=clamp(n,0,CHS.length-1);wheelIdx[c]=idx;tr2.style.transition=anim===false?'none':'transform .18s ease-out';tr2.style.transform='translateY('+(-idx*30)+'px)';[...tr2.children].forEach((el,k)=>el.classList.toggle('sel',k===idx));if(idx!==o)wheelTick();};\n    wheelSteps.push(d=>setI(idx+d));\n    up.addEventListener('click',()=>{setFocusCol(c);setI(idx-1);});\n    dn.addEventListener('click',()=>{setFocusCol(c);setI(idx+1);});\n    w.addEventListener('wheel',e=>{e.preventDefault();setFocusCol(c);setI(idx+(e.deltaY>0?1:-1));},{passive:false});\n    let drag=null;\n    w.addEventListener('pointerdown',e=>{setFocusCol(c);drag={y:e.clientY,idx,vy:0,ly:e.clientY,lt:RM.performance.now()};tr2.style.transition='none';try{w.setPointerCapture(e.pointerId);}catch(err){}});\n    w.addEventListener('pointermove',e=>{if(!drag)return;const now=RM.performance.now();drag.vy=(e.clientY-drag.ly)/Math.max(1,now-drag.lt);drag.ly=e.clientY;drag.lt=now;tr2.style.transform='translateY('+(-drag.idx*30+(e.clientY-drag.y))+'px)';});\n    const endw=e=>{if(!drag)return;const di=drag.idx,dy=e.clientY-drag.y,vy=drag.vy;drag=null;setI(Math.round(di-(dy+vy*180)/30));};\n    w.addEventListener('pointerup',endw);w.addEventListener('pointercancel',endw);\n    setI(idx,false);\n  }\n  setFocusCol(0);\n}\nfunction boardHTML(hi){\n  if(!top10.length)return '<p style=\"color:#8fa8c8;font-size:12px;margin:6px auto\">Nessun punteggio ancora: il primo record è tuo.</p>';\n  let h='<table style=\"margin:8px auto 2px;border-collapse:collapse;font-size:13px\">';\n  top10.forEach((e,i)=>{h+='<tr style=\"'+(i===hi?'color:#ffd166;font-weight:700':'color:#c6dcf5')+'\"><td style=\"padding:2px 10px;text-align:right;color:#7d95ab\">'+(i+1)+'º</td><td style=\"padding:2px 10px;letter-spacing:2px\">'+e.n+'</td><td style=\"padding:2px 10px;text-align:right\">'+e.s+'</td></tr>';});\n  return h+'</table>';\n}\nfunction panel(html){const p=$('#kcPanel');p.innerHTML='<div class=\"kc-box\">'+html+'</div>';p.classList.remove('hidden');}\nfunction showMenu(){\n  state='menu';clearKeys();\n  panel('<h2>KITTY CRUSHER</h2>'\n    +'<p class=\"story\" style=\"font-size:clamp(15px,2.6vw,21px);margin:2px auto 4px\">Crocchette Pazze · capitolo finale</p>'\n    +'<p class=\"story\">Sul pianeta delle crocchette il dispenser è vuoto e i formicai alieni difendono l\\u2019Albero. Difendi il <b>sacco</b>, stordisci la <b>Regina</b> e raccogli <b>40 crocchette</b>.</p>'\n    +'<div class=\"btnrow\"><button id=\"kcStart\">GIOCA</button><button id=\"kcIntro\" class=\"ghost\">▶ GUARDA L\\u2019INTRO</button><button id=\"kcInfo\" class=\"ghost\" aria-label=\"Istruzioni\" title=\"Istruzioni\">i</button></div>'\n    +'<div id=\"kcInfoblock\" class=\"kc-infoblock\" style=\"display:none;margin-top:8px\">'\n    +'<p>• Controlli <b>un gatto alla volta</b>: la <b style=\"color:#ff8fb8\">DIFENSORE</b> (bianco/nera) combatte le formiche e raccoglie le crocchette; lo <b style=\"color:#9fe8ff\">SCALATORE</b> (bianco/grigio) scuote i grappoli sui rami. L\\u2019altro gatto lo pilota il gioco.<br>'\n    +'• Dopo 10 formiche eliminate arriva la <b>Regina</b>: colpiscila per stordire la colonia e scatenare la raccolta (20 secondi).<br>'\n    +'• Se <b>5 formiche</b> raggiungono il sacco è finita. Le crocchette dorate valgono 3.<br>'\n    +'• Comandi: frecce/WASD = muoviti · SPAZIO = zampata/scuoti · TAB o Q = cambia gatto · P = pausa. Tocco: bottoni sotto, oppure tocca direttamente formiche e grappoli.<br>'\n    +'• 🎮 Gamepad (F710 su X): levetta/croce = muoviti · A/X = azione · B/Y/LB/RB = cambia gatto · Start = pausa.</p></div>');\n  $('#kcStart').onclick=()=>{ensureAudio();startGame();};\n  $('#kcIntro').onclick=()=>startIntro();\n  $('#kcInfo').onclick=()=>{const ib=$('#kcInfoblock');ib.style.display=ib.style.display==='none'?'block':'none';vib(15);};\n}\nfunction showEndPanel(){\n  state='end';clearKeys();\n  const win=cineWin;\n  const rec=G.score>=best&&G.score>0;\n  if(!lastResult)lastResult=null;\n  let h='<h2>'+(win?'MISSIONE CROCCANTISSIMA!':'SACCO SVUOTATO')+'</h2>';\n  h+='<p class=\"story\">'+(win\n    ?'Il dispenser trabocca, i gatti mangiano e fanno le fusa: la dispensa della nave è salva per tutto il viaggio.'\n    :'I formicai hanno portato via tutto. Il dispenser aspetta ancora le sue crocchette: ritenta, la colonia non si offenderà.')+'</p>';\n  h+='<p style=\"font-size:clamp(20px,3.4vw,30px);margin:4px auto;color:#ffd166\">PUNTI <span id=\"kcCountup\">0</span></p>';\n  h+='<p style=\"margin:2px auto;font-size:13px;color:#81e9ff\">Record: '+best+(rec?' · <b style=\"color:#ffd166\">NUOVO RECORD!</b>':'')+'</p>';\n  h+='<p style=\"margin:2px auto;font-size:12px;color:#9cb7d8\">Crocchette: '+G.kibble+'/'+G.goal+' · Ondata raggiunta: '+G.level+'</p>';\n  if(!lastResult&&qualifies(G.score))h+='<div id=\"kcEntry\"><p style=\"margin:8px auto 2px;font-size:13px;color:#c6dcf5\">Sei in classifica! Firma con la tua sigla:</p><div id=\"kcWheels\"></div><button id=\"kcConfirmBtn\" style=\"margin-top:4px\">CONFERMA SIGLA</button></div><div id=\"kcBoardc\"></div>';\n  else h+='<div id=\"kcBoardc\">'+boardHTML(-1)+'</div>';\n  h+='<div class=\"btnrow\"><button id=\"kcAgain\">GIOCA ANCORA</button><button id=\"kcShareBtn\">📤 CONDIVIDI</button>';\n  if(win)h+='<button id=\"kcCredits\" class=\"ghost\">★ CREDITI FINALI</button>';\n  h+='<button id=\"kcHub\" class=\"ghost\">ARCADE</button></div>';\n  panel(h);\n  $('#kcAgain').onclick=()=>{ensureAudio();startGame();};\n  $('#kcHub').onclick=()=>{const hk=RM.__kcHooks;if(hk&&hk.exit)hk.exit();};\n  if(win){const cb=$('#kcCredits');if(cb)cb.onclick=()=>startCredits();}\n  const cu=$('#kcCountup');\n  if(cu){const t0=RM.performance.now(),dur=Math.min(1800,500+G.score);\n    const step=()=>{if(state!=='end')return;const k=clamp((RM.performance.now()-t0)/dur,0,1);cu.textContent=String(Math.round(G.score*(k*k*(3-2*k))));if(k<1)requestAnimationFrame(step);};step();}\n  if(!lastResult&&qualifies(G.score)){\n    entryOpen=true;buildWheels();\n    $('#kcConfirmBtn').onclick=()=>{\n      if(!entryOpen)return;\n      const name=wheelIdx.map(i=>CHS[i]).join('');lastName=name;\n      try{RM.localStorage.se
