<script>
const FONT={
'A':[2,5,7,5,5],'B':[6,5,6,5,6],'C':[3,4,4,4,3],'D':[6,5,5,5,6],'E':[7,4,6,4,7],'F':[7,4,6,4,4],
'G':[3,4,5,5,3],'H':[5,5,7,5,5],'I':[7,2,2,2,7],'J':[1,1,1,5,2],'K':[5,5,6,5,5],'L':[4,4,4,4,7],
'M':[5,7,7,5,5],'N':[5,7,7,7,5],'O':[2,5,5,5,2],'P':[6,5,6,4,4],'Q':[2,5,5,2,1],'R':[6,5,6,5,5],
'S':[3,4,2,1,6],'T':[7,2,2,2,2],'U':[5,5,5,5,7],'V':[5,5,5,5,2],'W':[5,5,7,7,5],'X':[5,5,2,5,5],
'Y':[5,5,2,2,2],'Z':[7,1,2,4,7],
'0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[7,1,7,4,7],'3':[7,1,7,1,7],'4':[5,5,7,1,1],'5':[7,4,7,1,7],
'6':[7,4,7,5,7],'7':[7,1,1,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,7],
' ':[0,0,0,0,0],'.':[0,0,0,0,2],',':[0,0,0,2,4],':':[0,2,0,2,0],';':[0,2,0,2,4],
'!':[2,2,2,0,2],'?':[7,1,3,0,2],'-':[0,0,7,0,0],'+':[0,2,7,2,0],'/':[1,1,2,4,4],
'(':[1,2,2,2,1],')':[4,2,2,2,4],"'":[2,2,0,0,0],'%':[5,1,2,4,5],'&':[2,5,2,5,3],
'^':[2,5,0,0,0],'<':[1,2,4,2,1],'>':[4,2,1,2,4],'=':[0,7,0,7,0],'*':[5,2,7,2,5],'_':[0,0,0,0,7]
};
function ptext(g,str,x,y,color,scale=1,center=false){
  str=String(str).toUpperCase();
  const cw=(3+1)*scale;
  let sx=center?x-str.length*cw/2:x;
  g.fillStyle=color;
  for(let i=0;i<str.length;i++){
    const gl=FONT[str[i]]||FONT[' '];
    for(let r=0;r<5;r++){const bits=gl[r];
      for(let c=0;c<3;c++)if(bits&(1<<(2-c)))g.fillRect(sx+i*cw+c*scale,y+r*scale,scale,scale);
    }
  }
  return sx;
}
function drawCat8(g,x,y,f,o){
  // Ibrida: i gatti come nel secondo capitolo della trilogia, un po' piu' grandi.
  // Solo pixel interi: tutto a fuoco. Lilli macchie nere SENZA fiocco, Cosmo macchie grigie.
  const fr=f.frame, t=f.t||0;
  const female=!!o.bow; // bow resta solo come identita': il fiocco non si disegna piu'
  const spotC=o.bella?'#4f4c49':female?'#161616':'#9aa0a6';
  const WHT=o.bella?'#a5a19b':'#ffffff', PNK='#ff7ab8', EYE='#161616';
  g.save();
  g.translate(Math.round(x)+5,Math.round(y)-2);
  if((o.dir||1)<0)g.scale(-1,1);
  const P=(rx,ry,rw,rh,c)=>{g.fillStyle=c;g.fillRect(rx,ry,rw,rh);};
  const tw=Math.round(Math.sin(t*5)*2);
  const bob=(fr==='run')?Math.round(Math.sin(t*12)):0;
  const slow=()=>{if(o.slow){P(-4,9,2,3,'#8b5cff');P(0,10,2,3,'#8b5cff');P(4,9,2,2,'#8b5cff');}};
  const eyes=(hy,mode)=>{
    if(mode==='closed'){P(-3,hy+4,2,1,EYE);P(2,hy+4,2,1,EYE);return;}
    if(mode==='wink'){P(-3,hy+4,2,1,EYE);P(2,hy+3,2,2,EYE);return;}
    P(-3,hy+3,2,2,EYE);P(2,hy+3,2,2,EYE);
  };
  const head=(hy,mode)=>{
    P(-4,hy,10,9,WHT);P(-4,hy-3,3,4,WHT);P(3,hy-3,3,4,WHT);
    if(!female)P(-4,hy-3,3,3,spotC);
    if(female)P(-1,hy,4,3,spotC);
    eyes(hy,mode);if(o.bella){P(-4,hy+1,2,1,spotC);P(2,hy+1,3,1,spotC);P(0,hy,1,2,spotC);P(-3,hy+6,6,3,'#fff5eb');}P(0,hy+6,2,1,PNK);
  };
  if(fr==='stretch'){
    P(-13,0+tw,3,4,spotC);P(-12,4+tw,4,3,spotC);   // coda alta
    P(-10,6,16,4,WHT);P(-6,4,8,2,WHT);              // corpo lungo inarcato
    if(!female)P(-4,5,6,3,spotC);
    P(6,4,8,5,WHT);P(6,2,2,3,WHT);P(11,2,2,3,WHT);  // testa bassa avanti
    if(female)P(8,4,3,2,spotC);
    P(7,6,2,1,EYE);P(13,7,2,1,PNK);                 // occhi chiusi, contento
    P(10,10,3,3,WHT);P(12,10,2,2,WHT);P(-8,10,3,3,WHT);
    slow();g.restore();return;
  }
  if(fr==='sit'){
    const wag=Math.round(Math.sin(t*3));
    P(-6,4,12,8,WHT);if(o.bella){P(-6,6,3,1,spotC);P(3,6,3,1,spotC);P(-6,9,3,1,spotC);P(3,9,3,1,spotC);P(-2,4,4,4,'#fff5eb');}                               // corpo seduto
    if(!female)P(-3,6,7,4,spotC);
    head(-4,o.wink?'wink':((t%3.4)<0.16?'closed':'open'));
    P(-2,11,3,3,WHT);P(1,11,3,3,WHT);if(o.bella){P(-3,13,3,1,spotC);P(2,13,3,1,spotC);}               // zampine unite
    P(6,10+wag,5,2,spotC);P(9,(o.bella?5:8)+wag,2,o.bella?7:4,spotC);if(o.bella){P(9,6+wag,2,1,WHT);P(9,9+wag,2,1,WHT);}     // coda raccolta davanti
    slow();g.restore();return;
  }
  if(fr==='jump'){
    P(-9,8+tw,4,3,spotC);P(-12,6+tw,3,4,spotC);     // coda bassa
    P(-6,-2,12,9,WHT);                              // corpo raccolto
    if(!female)P(-3,0,7,5,spotC);
    head(-10,'open');
    P(-5,7,3,3,WHT);P(2,7,3,3,WHT);                 // zampe raccolte
    slow();g.restore();return;
  }
  if(fr==='climb'){
    const k=Math.sin(t*8)>0?1:0;
    P(-9,8,4,3,spotC);P(-12,10,3,4,spotC);          // coda pendente
    P(-6,2,12,9,WHT);
    if(!female)P(-3,4,7,5,spotC);
    head(-6,'open');
    P(4,-4+k*2,3,5,WHT);P(4,3-k*2,3,5,WHT);         // braccia che si alternano
    P(-4,11,3,3,WHT);P(1,11,3,3,WHT);
    slow();g.restore();return;
  }
  // stand / run / scratch
  P(-9,(fr==='run'?3:6)+tw,4,3,spotC);P(-12,(fr==='run'?0:3)+tw,3,4,spotC);
  P(-6,2+bob,12,9,WHT);
  if(!female)P(-3,4+bob,7,5,spotC);
  const blink=(fr==='stand'&&(t%2.6)<0.18)?'closed':'open';
  head(-6+bob,blink);
  if(fr==='scratch'){
    P(5,3+bob,9,3,WHT);P(13,1+bob,4,6,WHT);P(15,3+bob,2,2,PNK); // zampa tesa con polpastrello
    P(-5,11,3,3,WHT);P(2,11,3,3,WHT);
  }else if(fr==='run'){
    const ph=Math.sin(t*12)>0;
    P(-5,ph?10:11,3,3,WHT);P(2,ph?11:10,3,3,WHT);
  }else{
    P(-5,11,3,3,WHT);P(2,11,3,3,WHT);
  }
  slow();g.restore();
}
function drawAnt8(g,x,y,t,variant,dir=1,turn=0){
  const queen=variant==='queen',helmet=variant==='helmet',sc=queen?1.5:1;
  g.save();g.translate(Math.round(x)+8,Math.round(y)-3);g.scale(sc,sc);
  if(turn){drawEnemyTurn(g,t,variant,turn>12);g.restore();return;}
  g.scale(dir,1);g.translate(-11,0);
  const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
  const body=queen?'#b84cee':'#16b9a9',dark=queen?'#46135f':'#063b43',light=queen?'#eba5ff':'#7dfbe4';
  const leg=Math.sin(t*14)>0?1:0;
  // Six articulated legs, thin waist, large rear abdomen, small head.
  for(let i=0;i<3;i++){
    const k=(i+leg)%2;P(7+i*3,5,1,4,dark);P(5+i*3-k,8,3,1,dark);P(5+i*3-k,9,1,3,dark);P(4+i*3-k,11,2,1,light);
    P(7+i*3,3,1,3,dark);P(6+i*3+k,1,3,1,dark);P(6+i*3+k,0,1,2,dark);
  }
  P(-2,3,8,7,dark);P(-3,5,10,3,dark);P(-1,4,6,5,body);P(0,4,3,1,light);P(0,7,5,1,dark);
  P(6,5,3,2,dark);P(9,3,5,6,dark);P(10,4,3,4,body);P(10,4,2,1,light);P(14,5,2,2,dark);
  P(16,2,6,6,dark);P(17,3,4,4,body);P(19,3,2,1,light);P(20,4,1,1,'#ffe16e');
  P(22,3,2,1,dark);P(23,2,2,1,dark);P(22,7,2,1,dark);P(23,8,2,1,dark);
  P(17,-1,1,3,dark);P(15,-3,3,2,dark);P(20,-2,1,4,dark);P(21,-4,3,2,dark);
  if(helmet){P(15,0,9,3,'#efb431');P(14,2,11,2,'#fff1a0');P(19,-1,2,4,'#fff1a0');}
  if(queen){P(16,-3,6,2,'#ffd34d');P(16,-6,1,3,'#ffd34d');P(19,-7,1,4,'#ffd34d');P(21,-6,1,3,'#ffd34d');}
  g.restore();
}
function drawEnemyTurn(g,t,variant,front){
  const queen=variant==='queen',mouse=variant==='mouse',body=mouse?'#39ff88':queen?'#b84cee':'#16b9a9',dark=mouse?'#0d6b3a':queen?'#46135f':'#063b43';
  const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
  if(mouse){
    P(-7,-8,4,5,body);P(3,-8,4,5,body);P(-5,-3,10,12,body);P(-1,-13,2,10,body);P(-2,-16,4,3,'#ff2fd6');
    if(front){P(-3,0,2,2,'#121829');P(2,0,2,2,'#121829');P(-1,4,2,2,'#ff7ab8');P(-2,-3,2,2,'#121829');}
    else{P(-3,-1,6,6,dark);P(-1,8,2,6,'#b9ffd9');}
    P(-5,9,3,2,dark);P(2,9,3,2,dark);
  }else{
    for(let i=0;i<3;i++){const y=1+i*4;P(-7,y,5,1,dark);P(3,y,5,1,dark);P(-8,y+1,1,3,body);P(7,y+1,1,3,body);}
    P(-4,4,8,8,dark);P(-3,5,6,6,body);P(-2,1,4,4,body);P(-4,-3,8,5,body);
    if(front){P(-3,-2,2,2,'#ffe16e');P(1,-2,2,2,'#ffe16e');P(-2,1,1,2,'#fff1a0');P(1,1,1,2,'#fff1a0');}
    else{P(-2,-2,4,1,dark);P(-2,7,4,1,dark);}
    P(-4,-6,1,4,dark);P(3,-6,1,4,dark);
    if(variant==='helmet'){P(-5,-5,10,3,'#efb431');P(-6,-3,12,1,'#fff1a0');}
    if(queen){P(-5,-6,10,2,'#ffd34d');P(-5,-9,2,3,'#ffd34d');P(-1,-10,2,4,'#ffd34d');P(3,-9,2,3,'#ffd34d');}
  }
}
function drawMouse8(g,x,y,t,dir,aim,turn=0){
  if(turn){g.save();g.translate(Math.round(x)+7,Math.round(y));drawEnemyTurn(g,t,'mouse',turn>12);g.restore();return;}
  // Ibrida: il topo esattamente come nel secondo capitolo della trilogia, piu' grande.
  const GR='#39ff88',DK='#0d6b3a',BEL='#7dffab',PK='#ff7ab8',EYE='#161616';
  g.save();
  g.translate(Math.round(x)+7,Math.round(y));
  if(dir<0)g.scale(-1,1);
  const P=(rx,ry,rw,rh,c)=>{g.fillStyle=c;g.fillRect(rx,ry,rw,rh);};
  const wig=Math.round(Math.sin(t*4));
  const lg=Math.sin(t*12)>0?1:0;
  // coda con punta luminosa
  P(-10,4+wig,3,2,GR);P(-13,2+wig,3,2,GR);P(-15,0+wig,2,2,'#b9ffd9');
  // orecchioni con interno scuro
  P(-8,-8,5,6,GR);P(3,-8,5,6,GR);P(-7,-7,3,4,DK);P(4,-7,3,4,DK);
  // antenna con bulbo lampeggiante
  P(-1,-13,2,5,GR);
  P(-2,-17+(Math.sin(t*5)>0?0:1),4,4,Math.sin(t*6)>0?'#ff2fd6':'#b026ff');
  // corpo e pancia
  P(-7,-2,14,11,GR);P(-6,-2,12,4,BEL);
  // tre occhi (il terzo sulla fronte)
  P(-4,1,2,3,EYE);P(2,1,2,3,EYE);P(-1,-3,2,2,EYE);
  P(-4,1,1,1,'#fff');
  // naso rosa
  P(-1,5,2,2,PK);
  // zampe
  P(-5,9+lg,3,2,DK);P(2,10-lg,3,2,DK);
  // buffa pistola spaziale viola
  P(8,0,7,4,'#8b5cff');P(9,4,3,3,'#5b34a8');P(14,-1,2,6,'#b026ff');P(16,1,4,3,'#8b5cff');
  const tip=aim?(Math.sin(t*30)>0?'#ffffff':'#ff2fd6'):'#39ff88';
  P(20,0,3,5,tip);
  if(aim){g.strokeStyle='rgba(180,255,126,.8)';g.lineWidth=1;g.beginPath();g.arc(22,2,5+Math.round(Math.sin(t*20)*2),0,7);g.stroke();}
  g.restore();
}
function drawSkull(g,x,y,t){
  g.save(); g.translate(Math.round(x),Math.round(y+Math.sin(t*4)));
  g.fillStyle='#e8e6f2'; g.fillRect(1,0,6,5); g.fillRect(2,5,4,2);
  g.fillStyle='#1a1428'; g.fillRect(2,2,1,2); g.fillRect(5,2,1,2); g.fillRect(3,4,2,1);
  g.fillStyle='#e8e6f2'; g.fillRect(2,6,1,1); g.fillRect(5,6,1,1);
  g.restore();
}
function drawKibble(g,x,y,t,kind){
  g.save(); g.translate(Math.round(x),Math.round(y));
  const bob=Math.round(Math.sin(t*4+x)*1);
  g.translate(0,bob);
  if(kind==='gold'){g.fillStyle='#ffd34d';g.fillRect(1,0,4,6);g.fillRect(0,1,6,4);
    g.fillStyle='#fff0b0';g.fillRect(2,1,2,1);g.fillStyle='#c8922a';g.fillRect(2,3,2,2);}
  else if(kind==='heart'){g.fillStyle='#ff5da2';g.fillRect(1,0,2,2);g.fillRect(4,0,2,2);
    g.fillRect(0,1,7,3);g.fillRect(1,4,5,1);g.fillRect(2,5,3,1);g.fillRect(3,6,1,1);
    g.fillStyle='#ffd3e4';g.fillRect(1,1,1,1);}
  else{g.fillStyle='#160e35';g.fillRect(-1,0,8,6);g.fillRect(0,-1,6,8);g.fillStyle='#ff6138';g.fillRect(1,0,4,6);g.fillRect(0,1,6,4);
    g.fillStyle='#fff3a0';g.fillRect(1,1,2,1);g.fillStyle='#a62c28';g.fillRect(2,2,2,2);}
  g.restore();
}

/* Mantide religiosa aliena — il boss. Disegnata in grande. */
function drawMantis8(g,x,y,t,o){
  // o: {hp,maxhp,phase,flash,dir}
  g.save(); g.translate(Math.round(x),Math.round(y));
  if(o.dir<0){g.translate(64,0);g.scale(-1,1);}
  const B=o.flash>0?'#ffffff':'#59d68a', D='#2f7a4c', E='#ff4d6d', W='#b7ffd3';
  const R=(rx,ry,rw,rh,c)=>{g.fillStyle=c;g.fillRect(rx,ry,rw,rh);};
  const sway=Math.round(Math.sin(t*2)*2);
  // alone minaccioso quando attacca
  if(o.phase==='attack'){
    const rg=g.createRadialGradient(32,36,8,32,36,52);
    rg.addColorStop(0,'rgba(89,214,138,'+(.3+.12*Math.sin(t*10))+')');
    rg.addColorStop(1,'rgba(89,214,138,0)');
    g.fillStyle=rg; g.fillRect(-20,-16,104,104);
  }
  // zampe posteriori
  R(20,52,3,18,D); R(40,52,3,18,D); R(18,68,7,3,D); R(38,68,7,3,D);
  // addome

window.GAMES_HTML={"breaker":"<!doctype html>\n<html lang=\"it\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no\">\n<meta name=\"theme-color\" content=\"#0b0620\"><title>Kitty Breaker · Panic Protocol</title>\n<link rel=\"icon\" href=\"data:,\">\n<style>\nhtml,body{margin:0;height:100%;background:#0b0620;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}\n#bar{position:fixed;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 8px;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:#0b0620;border-bottom:2px solid #2a1650;z-index:30}\n#bar a{color:#ffd166;text-decoration:none;font-weight:900;font-size:13px;letter-spacing:2px;border:2px solid #ffd166;padding:6px 10px;background:#1a0f3a;min-height:20px;display:inline-flex;align-items:center}\n#bar a:active{background:#ffd166;color:#1a0f3a}\n#bar span{flex:1;text-align:center;color:#9fe8ff;font-size:12px;font-weight:700;letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n#host{position:fixed;left:0;right:0;bottom:0;top:calc(44px + env(safe-area-inset-top));background:#050713}\n</style></head>\n<body>\n<div id=\"bar\"><a href=\"../index.html\" id=\"home\" aria-label=\"Torna alla home\">&lsaquo; HOME</a><span>KITTY BREAKER</span></div>\n<div id=\"host\"></div>\n<script>document.getElementById('home').addEventListener('click',function(e){try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}try{if(window.parent!==window&&window.parent.__arcade){e.preventDefault();window.parent.__arcade.close();}}catch(x){}});<\/script>\n<script>const FONT={\n'A':[2,5,7,5,5],'B':[6,5,6,5,6],'C':[3,4,4,4,3],'D':[6,5,5,5,6],'E':[7,4,6,4,7],'F':[7,4,6,4,4],\n'G':[3,4,5,5,3],'H':[5,5,7,5,5],'I':[7,2,2,2,7],'J':[1,1,1,5,2],'K':[5,5,6,5,5],'L':[4,4,4,4,7],\n'M':[5,7,7,5,5],'N':[5,7,7,7,5],'O':[2,5,5,5,2],'P':[6,5,6,4,4],'Q':[2,5,5,2,1],'R':[6,5,6,5,5],\n'S':[3,4,2,1,6],'T':[7,2,2,2,2],'U':[5,5,5,5,7],'V':[5,5,5,5,2],'W':[5,5,7,7,5],'X':[5,5,2,5,5],\n'Y':[5,5,2,2,2],'Z':[7,1,2,4,7],\n'0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[7,1,7,4,7],'3':[7,1,7,1,7],'4':[5,5,7,1,1],'5':[7,4,7,1,7],\n'6':[7,4,7,5,7],'7':[7,1,1,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,7],\n' ':[0,0,0,0,0],'.':[0,0,0,0,2],',':[0,0,0,2,4],':':[0,2,0,2,0],';':[0,2,0,2,4],\n'!':[2,2,2,0,2],'?':[7,1,3,0,2],'-':[0,0,7,0,0],'+':[0,2,7,2,0],'/':[1,1,2,4,4],\n'(':[1,2,2,2,1],')':[4,2,2,2,4],\"'\":[2,2,0,0,0],'%':[5,1,2,4,5],'&':[2,5,2,5,3],\n'^':[2,5,0,0,0],'<':[1,2,4,2,1],'>':[4,2,1,2,4],'=':[0,7,0,7,0],'*':[5,2,7,2,5],'_':[0,0,0,0,7]\n};\nfunction ptext(g,str,x,y,color,scale=1,center=false){\n  str=String(str).toUpperCase();\n  const cw=(3+1)*scale;\n  let sx=center?x-str.length*cw/2:x;\n  g.fillStyle=color;\n  for(let i=0;i<str.length;i++){\n    const gl=FONT[str[i]]||FONT[' '];\n    for(let r=0;r<5;r++){const bits=gl[r];\n      for(let c=0;c<3;c++)if(bits&(1<<(2-c)))g.fillRect(sx+i*cw+c*scale,y+r*scale,scale,scale);\n    }\n  }\n  return sx;\n}\nfunction drawCat8(g,x,y,f,o){\n  // Ibrida: i gatti come nel secondo capitolo della trilogia, un po' piu' grandi.\n  // Solo pixel interi: tutto a fuoco. Lilli macchie nere SENZA fiocco, Cosmo macchie grigie.\n  const fr=f.frame, t=f.t||0;\n  const female=!!o.bow; // bow resta solo come identita': il fiocco non si disegna piu'\n  const spotC=o.bella?'#4f4c49':female?'#161616':'#9aa0a6';\n  const WHT=o.bella?'#a5a19b':'#ffffff', PNK='#ff7ab8', EYE='#161616';\n  g.save();\n  g.translate(Math.round(x)+5,Math.round(y)-2);\n  if((o.dir||1)<0)g.scale(-1,1);\n  const P=(rx,ry,rw,rh,c)=>{g.fillStyle=c;g.fillRect(rx,ry,rw,rh);};\n  const tw=Math.round(Math.sin(t*5)*2);\n  const bob=(fr==='run')?Math.round(Math.sin(t*12)):0;\n  const slow=()=>{if(o.slow){P(-4,9,2,3,'#8b5cff');P(0,10,2,3,'#8b5cff');P(4,9,2,2,'#8b5cff');}};\n  const eyes=(hy,mode)=>{\n    if(mode==='closed'){P(-3,hy+4,2,1,EYE);P(2,hy+4,2,1,EYE);return;}\n    if(mode==='wink'){P(-3,hy+4,2,1,EYE);P(2,hy+3,2,2,EYE);return;}\n    P(-3,hy+3,2,2,EYE);P(2,hy+3,2,2,EYE);\n  };\n  const head=(hy,mode)=>{\n    P(-4,hy,10,9,WHT);P(-4,hy-3,3,4,WHT);P(3,hy-3,3,4,WHT);\n    if(!female)P(-4,hy-3,3,3,spotC);\n    if(female)P(-1,hy,4,3,spotC);\n    eyes(hy,mode);if(o.bella){P(-4,hy+1,2,1,spotC);P(2,hy+1,3,1,spotC);P(0,hy,1,2,spotC);P(-3,hy+6,6,3,'#fff5eb');}P(0,hy+6,2,1,PNK);\n  };\n  if(fr==='stretch'){\n    P(-13,0+tw,3,4,spotC);P(-12,4+tw,4,3,spotC);   // coda alta\n    P(-10,6,16,4,WHT);P(-6,4,8,2,WHT);              // corpo lungo inarcato\n    if(!female)P(-4,5,6,3,spotC);\n    P(6,4,8,5,WHT);P(6,2,2,3,WHT);P(11,2,2,3,WHT);  // testa bassa avanti\n    if(female)P(8,4,3,2,spotC);\n    P(7,6,2,1,EYE);P(13,7,2,1,PNK);                 // occhi chiusi, contento\n    P(10,10,3,3,WHT);P(12,10,2,2,WHT);P(-8,10,3,3,WHT);\n    slow();g.restore();return;\n  }\n  if(fr==='sit'){\n    const wag=Math.round(Math.sin(t*3));\n    P(-6,4,12,8,WHT);if(o.bella){P(-6,6,3,1,spotC);P(3,6,3,1,spotC);P(-6,9,3,1,spotC);P(3,9,3,1,spotC);P(-2,4,4,4,'#fff5eb');}                               // corpo seduto\n    if(!female)P(-3,6,7,4,spotC);\n    head(-4,o.wink?'wink':((t%3.4)<0.16?'closed':'open'));\n    P(-2,11,3,3,WHT);P(1,11,3,3,WHT);if(o.bella){P(-3,13,3,1,spotC);P(2,13,3,1,spotC);}               // zampine unite\n    P(6,10+wag,5,2,spotC);P(9,(o.bella?5:8)+wag,2,o.bella?7:4,spotC);if(o.bella){P(9,6+wag,2,1,WHT);P(9,9+wag,2,1,WHT);}     // coda raccolta davanti\n    slow();g.restore();return;\n  }\n  if(fr==='jump'){\n    P(-9,8+tw,4,3,spotC);P(-12,6+tw,3,4,spotC);     // coda bassa\n    P(-6,-2,12,9,WHT);                              // corpo raccolto\n    if(!female)P(-3,0,7,5,spotC);\n    head(-10,'open');\n    P(-5,7,3,3,WHT);P(2,7,3,3,WHT);                 // zampe raccolte\n    slow();g.restore();return;\n  }\n  if(fr==='climb'){\n    const k=Math.sin(t*8)>0?1:0;\n    P(-9,8,4,3,spotC);P(-12,10,3,4,spotC);          // coda pendente\n    P(-6,2,12,9,WHT);\n    if(!female)P(-3,4,7,5,spotC);\n    head(-6,'open');\n    P(4,-4+k*2,3,5,WHT);P(4,3-k*2,3,5,WHT);         // braccia che si alternano\n    P(-4,11,3,3,WHT);P(1,11,3,3,WHT);\n    slow();g.restore();return;\n  }\n  // stand / run / scratch\n  P(-9,(fr==='run'?3:6)+tw,4,3,spotC);P(-12,(fr==='run'?0:3)+tw,3,4,spotC);\n  P(-6,2+bob,12,9,WHT);\n  if(!female)P(-3,4+bob,7,5,spotC);\n  const blink=(fr==='stand'&&(t%2.6)<0.18)?'closed':'open';\n  head(-6+bob,blink);\n  if(fr==='scratch'){\n    P(5,3+bob,9,3,WHT);P(13,1+bob,4,6,WHT);P(15,3+bob,2,2,PNK); // zampa tesa con polpastrello\n    P(-5,11,3,3,WHT);P(2,11,3,3,WHT);\n  }else if(fr==='run'){\n    const ph=Math.sin(t*12)>0;\n    P(-5,ph?10:11,3,3,WHT);P(2,ph?11:10,3,3,WHT);\n  }else{\n    P(-5,11,3,3,WHT);P(2,11,3,3,WHT);\n  }\n  slow();g.restore();\n}\nfunction drawAnt8(g,x,y,t,variant,dir=1,turn=0){\n  const queen=variant==='queen',helmet=variant==='helmet',sc=queen?1.5:1;\n  g.save();g.translate(Math.round(x)+8,Math.round(y)-3);g.scale(sc,sc);\n  if(turn){drawEnemyTurn(g,t,variant,turn>12);g.restore();return;}\n  g.scale(dir,1);g.translate(-11,0);\n  const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};\n  const body=queen?'#b84cee':'#16b9a9',dark=queen?'#46135f':'#063b43',light=queen?'#eba5ff':'#7dfbe4';\n  const leg=Math.sin(t*14)>0?1:0;\n  // Six articulated legs, thin waist, large rear abdomen, small head.\n  for(let i=0;i<3;i++){\n    const k=(i+leg)%2;P(7+i*3,5,1,4,dark);P(5+i*3-k,8,3,1,dark);P(5+i*3-k,9,1,3,dark);P(4+i*3-k,11,2,1,light);\n    P(7+i*3,3,1,3,dark);P(6+i*3+k,1,3,1,dark);P(6+i*3+k,0,1,2,dark);\n  }\n  P(-2,3,8,7,dark);P(-3,5,10,3,dark);P(-1,4,6,5,body);P(0,4,3,1,light);P(0,7,5,1,dark);\n  P(6,5,3,2,dark);P(9,3,5,6,dark);P(10,4,3,4,body);P(10,4,2,1,light);P(14,5,2,2,dark);\n  P(16,2,6,6,dark);P(17,3,4,4,body);P(19,3,2,1,light);P(20,4,1,1,'#ffe16e');\n  P(22,3,2,1,dark);P(23,2,2,1,dark);P(22,7,2,1,dark);P(23,8,2,1,dark);\n  P(17,-1,1,3,dark);P(15,-3,3,2,dark);P(20,-2,1,4,dark);P(21,-4,3,2,dark);\n  if(helmet){P(15,0,9,3,'#efb431');P(14,2,11,2,'#fff1a0');P(19,-1,2,4,'#fff1a0');}\n  if(queen){P(16,-3,6,2,'#ffd34d');P(16,-6,1,3,'#ffd34d');P(19,-7,1,4,'#ffd34d');P(21,-6,1,3,'#ffd34d');}\n  g.restore();\n}\nfunction drawEnemyTurn(g,t,variant,front){\n  const queen=variant==='queen',mouse=variant==='mouse',body=mouse?'#39ff88':queen?'#b84cee':'#16b9a9',dark=mouse?'#0d6b3a':queen?'#46135f':'#063b43';\n  const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};\n  if(mouse){\n    P(-7,-8,4,5,body);P(3,-8,4,5,body);P(-5,-3,10,12,body);P(-1,-13,2,10,body);P(-2,-16,4,3,'#ff2fd6');\n    if(front){P(-3,0,2,2,'#121829');P(2,0,2,2,'#121829');P(-1,4,2,2,'#ff7ab8');P(-2,-3,2,2,'#121829');}\n    else{P(-3,-1,6,6,dark);P(-1,8,2,6,'#b9ffd9');}\n    P(-5,9,3,2,dark);P(2,9,3,2,dark);\n  }else{\n    for(let i=0;i<3;i++){const y=1+i*4;P(-7,y,5,1,dark);P(3,y,5,1,dark);P(-8,y+1,1,3,body);P(7,y+1,1,3,body);}\n    P(-4,4,8,8,dark);P(-3,5,6,6,body);P(-2,1,4,4,body);P(-4,-3,8,5,body);\n    if(front){P(-3,-2,2,2,'#ffe16e');P(1,-2,2,2,'#ffe16e');P(-2,1,1,2,'#fff1a0');P(1,1,1,2,'#fff1a0');}\n    else{P(-2,-2,4,1,dark);P(-2,7,4,1,dark);}\n    P(-4,-6,1,4,dark);P(3,-6,1,4,dark);\n    if(variant==='helmet'){P(-5,-5,10,3,'#efb431');P(-6,-3,12,1,'#fff1a0');}\n    if(queen){P(-5,-6,10,2,'#ffd34d');P(-5,-9,2,3,'#ffd34d');P(-1,-10,2,4,'#ffd34d');P(3,-9,2,3,'#ffd34d');}\n  }\n}\nfunction drawMouse8(g,x,y,t,dir,aim,turn=0){\n  if(turn){g.save();g.translate(Math.round(x)+7,Math.round(y));drawEnemyTurn(g,t,'mouse',turn>12);g.restore();return;}\n  // Ibrida: il topo esattamente come nel secondo capitolo della trilogia, piu' grande.\n  const GR='#39ff88',DK='#0d6b3a',BEL='#7dffab',PK='#ff7ab8',EYE='#161616';\n  g.save();\n  g.translate(Math.round(x)+7,Math.round(y));\n  if(dir<0)g.scale(-1,1);\n  const P=(rx,ry,rw,rh,c)=>{g.fillStyle=c;g.fillRect(rx,ry,rw,rh);};\n  const wig=Math.round(Math.sin(t*4));\n  const lg=Math.sin(t*12)>0?1:0;\n  // coda con punta luminosa\n  P(-10,4+wig,3,2,GR);P(-13,2+wig,3,2,GR);P(-15,0+wig,2,2,'#b9ffd9');\n  // orecchioni con interno scuro\n  P(-8,-8,5,6,GR);P(3,-8,5,6,GR);P(-7,-7,3,4,DK);P(4,-7,3,4,DK);\n  // antenna con bulbo lampeggiante\n  P(-1,-13,2,5,GR);\n  P(-2,-17+(Math.sin(t*5)>0?0:1),4,4,Math.sin(t*6)>0?'#ff2fd6':'#b026ff');\n  // corpo e pancia\n  P(-7,-2,14,11,GR);P(-6,-2,12,4,BEL);\n  // tre occhi (il terzo sulla fronte)\n  P(-4,1,2,3,EYE);P(2,1,2,3,EYE);P(-1,-3,2,2,EYE);\n  P(-4,1,1,1,'#fff');\n  // naso rosa\n  P(-1,5,2,2,PK);\n  // zampe\n  P(-5,9+lg,3,2,DK);P(2,10-lg,3,2,DK);\n  // buffa pistola spaziale viola\n  P(8,0,7,4,'#8b5cff');P(9,4,3,3,'#5b34a8');P(14,-1,2,6,'#b026ff');P(16,1,4,3,'#8b5cff');\n  const tip=aim?(Math.sin(t*30)>0?'#ffffff':'#ff2fd6'):'#39ff88';\n  P(20,0,3,5,tip);\n  if(aim){g.strokeStyle='rgba(180,255,126,.8)';g.lineWidth=1;g.beginPath();g.arc(22,2,5+Math.round(Math.sin(t*20)*2),0,7);g.stroke();}\n  g.restore();\n}\nfunction drawSkull(g,x,y,t){\n  g.save(); g.translate(Math.round(x),Math.round(y+Math.sin(t*4)));\n  g.fillStyle='#e8e6f2'; g.fillRect(1,0,6,5); g.fillRect(2,5,4,2);\n  g.fillStyle='#1a1428'; g.fillRect(2,2,1,2); g.fillRect(5,2,1,2); g.fillRect(3,4,2,1);\n  g.fillStyle='#e8e6f2'; g.fillRect(2,6,1,1); g.fillRect(5,6,1,1);\n  g.restore();\n}\nfunction drawKibble(g,x,y,t,kind){\n  g.save(); g.translate(Math.round(x),Math.round(y));\n  const bob=Math.round(Math.sin(t*4+x)*1);\n  g.translate(0,bob);\n  if(kind==='gold'){g.fillStyle='#ffd34d';g.fillRect(1,0,4,6);g.fillRect(0,1,6,4);\n    g.fillStyle='#fff0b0';g.fillRect(2,1,2,1);g.fillStyle='#c8922a';g.fillRect(2,3,2,2);}\n  else if(kind==='heart'){g.fillStyle='#ff5da2';g.fillRect(1,0,2,2);g.fillRect(4,0,2,2);\n    g.fillRect(0,1,7,3);g.fillRect(1,4,5,1);g.fillRect(2,5,3,1);g.fillRect(3,6,1,1);\n    g.fillStyle='#ffd3e4';g.fillRect(1,1,1,1);}\n  else{g.fillStyle='#160e35';g.fillRect(-1,0,8,6);g.fillRect(0,-1,6,8);g.fillStyle='#ff6138';g.fillRect(1,0,4,6);g.fillRect(0,1,6,4);\n    g.fillStyle='#fff3a0';g.fillRect(1,1,2,1);g.fillStyle='#a62c28';g.fillRect(2,2,2,2);}\n  g.restore();\n}\n\n/* Mantide religiosa aliena — il boss. Disegnata in grande. */\nfunction drawMantis8(g,x,y,t,o){\n  // o: {hp,maxhp,phase,flash,dir}\n  g.save(); g.translate(Math.round(x),Math.round(y));\n  if(o.dir<0){g.translate(64,0);g.scale(-1,1);}\n  const B=o.flash>0?'#ffffff':'#59d68a', D='#2f7a4c', E='#ff4d6d', W='#b7ffd3';\n  const R=(rx,ry,rw,rh,c)=>{g.fillStyle=c;g.fillRect(rx,ry,rw,rh);};\n  const sway=Math.round(Math.sin(t*2)*2);\n  // alone minaccioso quando attacca\n  if(o.phase==='attack'){\n    const rg=g.createRadialGradient(32,36,8,32,36,52);\n    rg.addColorStop(0,'rgba(89,214,138,'+(.3+.12*Math.sin(t*10))+')');\n    rg.addColorStop(1,'rgba(89,214,138,0)');\n    g.fillStyle=rg; g.fillRect(-20,-16,104,104);\n  }\n  // zampe posteriori\n  R(20,52,3,18,D); R(40,52,3,18,D); R(18,68,7,3,D); R(38,68,7,3,D);\n  // addome\n  R(22,38+sway,20,16,B); R(24,36+sway,16,4,B);\n  R(26,42+sway,12,2,W); R(26,47+sway,12,2,W);\n  // ali con venature\n  g.fillStyle='rgba(183,255,211,.5)'; g.fillRect(24,30+sway,26,8); g.fillRect(26,28+sway,20,3);\n  g.fillStyle='rgba(47,122,76,.6)';\n  g.fillRect(28,31+sway,1,6); g.fillRect(34,31+sway,1,6); g.fillRect(40,31+sway,1,6);\n  // torace snello\n  R(28,18,8,22,B); R(30,16,4,4,B);\n  // braccia raptoriali (animate per fase)\n  const atk=o.phase==='attack'?8:0;\n  R(26,20,-6,3,B); R(14-atk,18,6,3,B); R(10-atk,14,3,6,D);      // braccio sx con falce\n  R(36,20,6,3,B); R(42+atk,18,6,3,B); R(48+atk,14,3,6,D);       // braccio dx\n  // testa triangolare con mandibole\n  R(26,6,12,8,B); R(28,4,8,2,B); R(30,14,4,4,B);\n  R(27,14,2,3,D); R(35,14,2,3,D);\n  // occhi enormi pulsanti\n  const ep=o.flash>0?1:.6+.4*Math.sin(t*3);\n  g.globalAlpha=ep;\n  R(24,6,4,6,E); R(36,6,4,6,E);\n  g.globalAlpha=1;\n  R(25,7,1,2,'#fff'); R(37,7,1,2,'#fff');\n  // antennae\n  R(22,0,1,6,D); R(41,0,1,6,D); R(21,0,2,1,D); R(41,0,2,1,D);\n  g.restore();\n}\nfunction drawPlanet(g,cx, cFullscreen);\nfullscreenDoc.addEventListener('webkitfullscreenchange',syncFullscreen);\nsyncFullscreen();\n\n/* KITTY BREAKER - PANIC PROTOCOL: intro dei gatti in plancia + gioco, file unico.\n   La gatta preme il pulsante del pilota automatico, la nave sbanda tra i meteoriti,\n   poi SALVALI fa partire il gioco. Nessuna dipendenza esterna. */\n/* INTRO DEI GATTI\n   Plancia di un'astronave: gatti dentro, grande finestra curva su pianeti (alcuni con anelli).\n   La gatta preme il pulsante rosso \"PILOTA AUTOMATICO\" -> OFF, la nave trema e sbanda tra i meteoriti.\n   Sottotitoli in italiano e HUD rendono chiaro cosa succede e perche'. */\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d'),cap=document.getElementById('cap');\n/* Layout reattivo: 512x288 orizzontale su schermi larghi, 432x576 verticale su telefono,\n   con finestra in alto, plancia grande in basso e testi piu' grandi (scena allargata). */\nlet W=512,H=288,WINB=200,WINCY=108,CT=214,MOB=false,CSC=1,WINM=40,lastMob=null;\nconst playBtn=document.getElementById('play'),introStage=document.getElementById('introStage'),titleCard=document.getElementById('titleCard'),salvaliBtn=document.getElementById('salvali'),replayBtn=document.getElementById('replay');\nlet titleShown=false;\nlet playing=false,t=0,last=0;\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nfunction px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}\nfunction glow(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}\nfunction text(s,x,y,c,size,al){ctx.font='bold '+(size||10)+'px monospace';ctx.textAlign=al||'left';ctx.fillStyle=c;ctx.fillText(s,x,y);}\n\nconst T_JUMP=3.6,T_PRESS=5.2,T_SHAKE=5.4,T_END=14;\n/* Aptica della intro: colpo secco quando la zampa preme il pulsante, poi rombo\n   continuo mentre la nave parte, fino alla fine dell'animazione. Solo dove il x(3,hy-3,3,4,white);\n if(!female)px(-4,hy-3,3,3,grey);\n if(female)px(-1,hy,4,3,black);\n if(scared){px(-3,hy+3,3,4,black);px(2,hy+3,3,4,black);px(-2,hy+4,1,1,'#fff');px(3,hy+4,1,1,'#fff');px(0,hy+7,2,2,'#ff7ab8');}\n else{px(-3,hy+3,2,2,black);px(2,hy+3,2,2,black);px(0,hy+6,2,1,'#ff7ab8');}\n ctx.restore();\n}\nfunction windowPath(){const q=16+(WINB-16)*.489;ctx.beginPath();ctx.moveTo(WINM,16);ctx.lineTo(W-WINM,16);ctx.quadraticCurveTo(W-(MOB?4:6),q,W-WINM,WINB);ctx.lineTo(WINM,WINB);ctx.quadraticCurveTo(MOB?4:6,q,WINM,16);ctx.closePath();}\n\nfunction drawScene(sway,zoom,speed){\n // finestra\n ctx.save();windowPath();ctx.clip();\n ctx.fillStyle='#050a1c';ctx.fillRect(0,0,W,H);\n ctx.save();ctx.translate(W/2-sway*60,WINCY);ctx.scale(zoom,zoom);ctx.translate(-W/2,-WINCY);\n for(const s of stars){const b=.5+.5*Math.sin(t*2+s.p);px(s.x,s.y,s.s,s.s,`rgba(255,255,255,${.3+.7*b})`);}\n for(const p of planets){\n  glow(p.x,p.y,p.r*2.2,p.c1+'33');\n  if(p.ring){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.9,p.r*.5,-.25,Math.PI,2*Math.PI);ctx.stroke();}\n  ctx.fillStyle=p.c1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();\n  ctx.fillStyle=p.c2;ctx.beginPath();ctx.arc(p.x+p.r*.3,p.y+p.r*.2,p.r*.55,0,6.28);ctx.fill();\n  if(p.ring){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=p.r>20?4:2;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.9,p.r*.5,-.25,0,Math.PI);ctx.stroke();}\n }\n ctx.restore();\n // linee velocita'\n if(speed>0){ctx.strokeStyle=`rgba(180,240,255,${.5*speed})`;ctx.lineWidth=1;\n  for(let i=0;i<40;i++){const a=i*2.399+Math.floor(t*9)*.1,r0=30+((i*37+t*400)%(WINB-10));\n   ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r0,WINCY+Math.sin(a)*r0*.7);ctx.lineTo(W/2+Math.cos(a)*(r0+16*speed),WINCY+Math.sin(a)*(r0+16*speed)*.7);ctx.stroke();}}\n // meteoriti in prospettiva (arrivano verso la nave)\n if(t>T_SHAKE+.4){\n  const k=clamp((t-T_SHAKE-.4)/1,0,1);\n  for(const m of meteors){\n   m.z-=m.v*.016*(.6+k);if(m.z<.08){m.z=rnd(1.2,1.8);m.a=rnd(0,6.28);m.r=rnd(.15,1.1);}\n   const sw=Math.sin(t*1.3)*.5;\n   const sx=W/2+Math.cos(m.a)*m.r*260*CSC/m.z-sway*70/m.z, sy=WINCY+Math.sin(m.a)*m.r*150*(WINB/200)/m.z;\n   const s=m.sz/m.z*.55;if(s<1)continue;\n   ctx.save();ctx.translate(sx,sy);ctx.rotate(m.rot+t*.6);\n   ctx.fillStyle='#6b4f8f';ctx.fillRect(-s/2,-s/2,s,s*.9);\n   ctx.fillStyle='#3d2b57';ctx.fillRect(-s/2,s*.1,s,s*.35);\n   ctx.fillStyle='#ff2fd6';ctx.fillRect(-s/2,-s/2,Math.max(2,s*.2),Math.max(2,s*.2));\n   ctx.restore();}\n }\n ctx.restore();\n // cornice + riflesso\n ctx.strokeStyle='#2a3560';ctx.lineWidth=7;windowPath();ctx.stroke();\n ctx.strokeStyle='rgba(0,229,255,.25)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(WINM+20,32);ctx.quadraticCurveTo(W*.293,62,W*.469,42);ctx.stroke();\n // montanti\n px(W/2-3,16,6,8,'#2a3560');\n}\n\nfunction drawCabin(off){\n px(0,0,W,H,'#10142c');\n px(0,0,W,10,'#1b2148');px(0,0,10,H,'#1b2148');px(W-10,0,10,H,'#1b2148');\n // luci soffitto\n for(let i=0;i<8;i++)px(50+i*55,3,20,3,'#00e5ff55');\n}\nfunction drawConsole(auto,pressed,alarm){\n px(0,CT,W,H-CT,'#151a33');px(0,CT-2,W,4,'#2a1f4d');\n ctx.strokeStyle='rgba(255,47,214,.3)';ctx.lineWidth=1;\n for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(W/2+(i-5)*52*CSC,H);ctx.lineTo(W/2+(i-5)*18*CSC,CT+4);ctx.stroke();}\n const cols=['#ff2fd6','#00e5ff','#ffb300','#b26bff','#39ff88'];\n if(MOB){\n  // mobile: pulsante rosso in alto al centro, fulcro della scena; schermi grandi sotto\n  px(W/2-92,CT+8,184,18,'#04121f');text('PILOTA AUTOM.',W/2,CT+21,auto?'#39ff88':'#ff2233',12,'center');\n  px(W/2-48,CT+30,96,28,'#2a1f4d');\n  px(W/2-40,CT+34,80,20,pressed?'#7a0d16':'#ff2233');\n  glow(W/2,CT+44,52,pressed?'rgba(255,34,51,.95)':(auto?'rgba(255,34,51,.35)':'rgba(255,34,51,.8)'));\n  px(W/2-32,CT+39,64,8,pressed?'#ffb3b3':'#ff8899');\n  // schermi\n  px(16,CT+74,120,56,'#04121f');px(20,CT+78,112,48,'#00e5ff');\n  px(148,CT+74,104,56,'#04121f');px(152,CT+78,96,48,'#ff2fd6');\n  for(let i=0;i<6;i++)px(268+i*16,CT+90,11,11,cols[i%5]);\n  // leva\n  px(W-38,CT+72,9,44,'#444');px(W-48,CT+62,28,13,auto?'#00e5ff':'#ffb300');\n  if(alarm){const on=Math.sin(t*18)>0;px(268,CT+114,13,13,on?'#ff2233':'#5a0d12');px(288,CT+114,13,13,on?'#ffb300':'#5a440d');\n   px(0,0,W,H,on?'rgba(255,0,30,.10)':'rgba(255,0,30,.0)');}\n }else{\n  px(24,CT+12,84,28,'#04121f');px(28,CT+16,76,20,'#00e5ff');\n  px(124,CT+12,76,28,'#04121f');px(128,CT+16,68,20,'#ff2fd6');\n  for(let i=0;i<6;i++)px(212+i*12,CT+26,8,8,cols[i%5]);\n  // pulsante rosso con etichetta\n  px(300,CT+10,100,12,'#04121f');text('PILOTA AUTOM.',350,CT+19,auto?'#39ff88':'#ff2233',8,'center');\n  px(322,CT+24,52,20,'#2a1f4d');\n  px(326,CT+27,44,14,pressed?'#7a0d16':'#ff2233');\n  glow(348,CT+34,34,pressed?'rgba(255,34,51,.95)':(auto?'rgba(255,34,51,.35)':'rgba(255,34,51,.8)'));\n  px(332,CT+30,32,6,pressed?'#ffb3b3':'#ff8899');\n  // leva\n  px(420,CT+10,6,30,'#444');px(412,CT+4,22,9,auto?'#00e5ff':'#ffb300');\n  if(alarm){const on=Math.sin(t*18)>0;px(236,CT+44,8,8,on?'#ff2233':'#5a0d12');px(256,CT+44,8,8,on?'#ffb300':'#5a440d');\n   px(0,0,W,H,on?'rgba(255,0,30,.10)':'rgba(255,0,30,.0)');}\n }\n}\nfunction hud(auto){\n const x=MOB?14:52,y=MOB?26:22,w=MOB?252:200,h=MOB?38:24;\n px(x,y,w,h,'rgba(4,5,13,.75)');\n text(auto?'PILOTA AUTOMATICO: ON':'PILOTA AUTOMATICO: OFF',x+6,y+(MOB?15:10),auto?'#39ff88':'#ff2233',MOB?13:9);\n text(auto?'ROTTA: SICURA':(t>T_SHAKE+2?'ROTTA: MANUALE - CAMPO METEORITI':'ROTTA: MANUALE'),x+6,y+(MOB?31:20),auto?'#00e5ff':'#ffb300',MOB?10:8);\n if(!auto&&Math.sin(t*14)>0){ctx.strokeStyle='#ff2233';ctx.lineWidth=2;ctx.strokeRect(x-2,y-2,w+4,h+4);}\n}\nfunction caption(){\n let s='',red=false;\n if(t<T_JUMP)s='Plancia dell\\u2019astronave: rotta automatica, tutto tranquillo.';\n else if(t<T_PRESS)s='La gatta salta sulla consolle, proprio davanti al pulsante rosso...';\n else if(t<T_SHAKE+2){s='ZAMPATA! Preme il pulsante: il pilota automatico si spegne!';red=true;}\n else if(t<T_SHAKE+4.6){s='Tutto trema: la nave e\\u2019 fuori controllo e vola verso i meteoriti!';red=true;}\n else if(t<T_END-1.5){s='I gatti si aggrappano, la nave sbanda e si infila tra i meteoriti...';red=true;}\n else s='KITTY BREAKER \\u2014 PANIC PROTOCOL';\n if(cap.textContent!==s){cap.textContent=s;cap.className=red?'red':'';}\n}\n\n\n/* Colonna sonora originale sintetizzata localmente. Nessun file remoto.\n   Un unico buffer di 14 s: la stessa linea temporale guida suono e immagini. */\nlet audioContext=null,audioSource=null,audioGain=null,audioEpoch=0,muted=false,starting=false;\nconst soundBtn=document.getElementById('sound');\nfunction midi(n){return 440*Math.pow(2,(n-69)/12);}\nasync function makeScore(){\n const ac=new OfflineAudioContext(2,44100*14,44100), master=ac.createGain();\n master.gain.setValueAtTime(.78,0);master.gain.setValueAtTime(.78,13.45);\n master.gain.linearRampToValueAtTime(0,14);\n const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=.005;comp.release.value=.13;\n master.connect(comp);comp.connect(ac.destination);\n const echo=ac.createDelay(.6),feedback=ac.createGain(),wet=ac.createGain();\n echo.delayTime.value=.1875;feedback.gain.value=.26;wet.gain.value=.14;\n echo.connect(feedback);feedback.connect(echo);echo.connect(wet);wet.connect(master);\n const noise=ac.createBuffer(1,44100*2,44100),d=noise.getChannelData(0);\n let seed=9182;for(let i=0;i<d.length;i++){seed=(seed*1664525+1013904223)>>>0;d[i]=seed/2147483648-1;}\n function voice(at,dur,hz,vol,type='sine',pan=0,endHz=null,send=false){\n  if(at>=14)return;dur=Math.min(dur,14-at);if(dur<=.005)return;\n  const o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner();\n  o.type=type;o.frequency.setValueAtTime(hz,at);if(endHz)o.frequency.exponentialRampToValueAtTime(Math.max(10,endHz),at+dur);\n  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+Math.min(.014,dur*.1));g.gain.exponentialRampToValueAtTim gle',.18),i*110));break;\n}}\n\n/* ============ MUSIC SEQUENCER — retrowave cyberjazz ============ */\nconst chordsJ=[[0,3,7,10],[0,4,7,11],[0,5,9,14],[0,2,7,10]];\nconst patsJ=[[0,-1,-1,2,-1,-1,1,-1,-1,-1,3,-1,2,-1,-1,-1],\n[3,-1,2,-1,-1,1,-1,-1,0,-1,-1,2,-1,-1,1,-1],\n[-1,-1,0,-1,-1,-1,2,-1,3,-1,-1,-1,2,-1,-1,-1],\n[1,-1,-1,-1,2,-1,3,-1,-1,-1,0,-1,-1,-1,2,-1]];\nconst MUS={step:0,nextT:0,timer:null,\nbpm(){return Math.min(122,102+level*2);},\nstepDur(){return 60/this.bpm()/4;},\nnt(deg){const o=Math.floor(deg/scale.length),i=((deg%scale.length)+scale.length)%scale.length;\nreturn root*Math.pow(2,(scale[i]+o*12)/12);},\nstart(){if(!AC||this.timer)return;this.step=0;this.nextT=AC.currentTime+.06;\nthis.timer=setInterval(()=>{if(!audioOn)return;\nwhile(this.nextT<AC.currentTime+.14){this.schedule(this.step,this.nextT);this.step++;this.nextT+=this.stepDur();}},30);},\nstop(){if(this.timer){clearInterval(this.timer);this.timer=null;}},\nschedule(step,t){\nconst bar=Math.floor(step/16),s16=step%16,swing=this.stepDur()*.45;\nif(s16===0&&bar>0&&bar%4===0&&Math.random()<.55){\nroot=roots[(Math.random()*roots.length)|0];scale=scales[(Math.random()*scales.length)|0];\nchordIdx=(chordIdx+1)%chordsJ.length;say('MUTAZIONE ARMONICA');}\nconst ch=chordsJ[chordIdx%chordsJ.length];\n/* batteria elettronica */\nif(s16===0||s16===10)kick(t);\nif(s16===4||s16===12)snare(t);\nif(s16%2===0)hat(t+(s16%4===2?swing:0),.05);\nif(s16===14)hat(t,.09);\n/* basso synth: radice sul beat, approcci sincopati */\nif(s16===0)blip(this.nt(ch[0]-14),.34,'sawtooth',.13,bassBus,0,t);\nif(s16===6)blip(this.nt(ch[0]-14),.11,'sawtooth',.10,bassBus,0,t+swing*.4);\nif(s16===8)blip(this.nt(ch[1]-14),.16,'sawtooth',.11,bassBus,0,t);\nif(s16===13)blip(this.nt(ch[2]-14),.09,'sawtooth',.09,bassBus,0,t+swing*.3);\n/* accordi jazz (settime/none) sui tempi deboli, voicing elettrico-piano */\nif(s16===4||s16===12)ch.forEach((d,i)=>blip(this.nt(d)*1.002,.30,'triangle',.038,musicGain,0,t+swing*.5+i*.012));\n/* linea solista rada con eco */\nconst pat=patsJ[(Math.floor(bar/2)+chordIdx)%patsJ.length],idx=pat[s16];\nif(idx>=0)blip(this.nt(ch[idx%ch.length]+7),.14,'square',.055,leadBus,0,t);\n}};\n\n/* ============ GAME STATE ============ */\nlet state='menu',score=0,level=1,lives=3,combo=0,comboT=0,shieldN=0,shake=0,levelFlash=0;\nlet rowSpawns=0,rowCd=0;\nlet gameVisible=false;\nlet best=0;try{best=+localStorage.getItem('neonabyss_best')||0;}catch(e){}\nbestEl.textContent=best;\nconst paddle={x:0,y:0,w:120,h:12,vx:0,tx:null,wide:0,laser:0,laserCd:0};\nlet balls=[],bricks=[],parts=[],bolts=[],floats=[],shocks=[],stars=[],meteor=null;\nconst P_COLORS={wide:'#00f7ff',multi:'#ff2d95',slow:'#8b5cff',laser:'#ffd166',life:'#2aff7a',shield:'#4dc3ff',skull:'#ff5340'};\nconst P_LETTERS={wide:'A',multi:'3',slow:'D',laser:'L',life:'+',shield:'S'};\n/* Teschio (pericolo): disegnato a pixel, nessun glifo font. */\nfunction drawSkullIcon(x,y,s){\nconst u=s/10;\nctx.fillStyle='#f4f6f8';\nctx.beginPath();ctx.arc(x,y-1.2*u,4.6*u,0,7);ctx.fill();\nctx.fillRect(x-3.2*u,y+1.4*u,6.4*u,3.6*u);\nctx.fillStyle='#16060a';\nctx.fillRect(x-2.9*u,y-2.4*u,2.1*u,2.4*u);ctx.fillRect(x+.8*u,y-2.4*u,2.1*u,2.4*u);\nctx.fillRect(x-.6*u,y+.4*u,1.2*u,1.5*u);\nctx.fillRect(x-2.1*u,y+3*u,1*u,1.9*u);ctx.fillRect(x-.5*u,y+3*u,1*u,1.9*u);ctx.fillRect(x+1.1*u,y+3*u,1*u,1.9*u);}\nfunction say(t){toast.textContent=t;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');}\nfunction hud(){scoreEl.textContent=score;levelEl.textContent=level;livesEl.textContent=lives;\nbestEl.textContent=best;\nif(combo>=3){comboEl.textContent='x'+combo;comboLabel.textContent='Combo';}else{comboEl.textContent='';comboLabel.textContent='';}}\nfunction buildStars(){stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.7,z:.3+Math.random()*.7,tw:Math.random()*6.28});}\nbuildStars();\n/* Pianeti di sfondo nella partita: stesso stile pixel della intro, ma lontani,\n   sfocati (sprite a bassa risoluzione ingrandito) e tenui, per dare profondita'\n   senza confondersi con pallina e mattoni. */\nconst gplanets=[\n{fx:.80,fy:.15,fr:.105,c1:'#ffb300',c2:'#a34700',ring:true,v:.9,a:.34},\n{fx:.52,fy:.08,fr:.052,c1:'#00e5ff',c2:'#0a4d8f',ring:true,v:1.2,a:.36},\n{fx:.16,fy:.30,fr:.038,c1:'#ff2fd6',c2:'#7a1fa2',ring:false,v:1.5,a:.4},\n{fx:.34,fy:.46,fr:.026,c1:'#b26bff',c2:'#4b1a7a',ring:false,v:1.9,a:.38},\n{fx:.66,fy:.55,fr:.02,c1:'#39ff88',c2:'#0d6b3a',ring:false,v:2.3,a:.36}];\nfunction planetSprite(p){\nconst r=64,pad=p.ring?r*2.1:r*1.7,s=Math.ceil((r+pad)*2),q=Math.ceil(s/4);\nconst c=window.document.createElement('canvas');c.width=q;c.height=q;const x=c.getContext('2d');\nx.scale(.25,.25);x.translate(s/2,s/2);\nconst g=x.createRadialGradient(0,0,0,0,0,r*2.2);g.addColorStop(0,p.c1+'33');g.addColorStop(1,'rgba(0,0,0,0)');\nx.fillStyle=g;x.fillRect(-r*2.2,-r*2.2,r*4.4,r*4.4);\nif(p.ring){x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=8;x.beginPath();x.ellipse(0,0,r*1.9,r*.5,-.25,Math.PI,2*Math.PI);x.stroke();}\nx.fillStyle=p.c1;x.beginPath();x.arc(0,0,r,0,6.28);x.fill();\nx.fillStyle=p.c2;x.beginPath();x.arc(r*.3,r*.2,r*.55,0,6.28);x.fill();\nif(p.ring){x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=10;x.beginPath();x.ellipse(0,0,r*1.9,r*.5,-.25,0,Math.PI);x.stroke();}\nreturn c;}\nfor(const p of gplanets){p.dx=0;p.spr=planetSprite(p);}\nfunction resetPaddle(){paddle.w=Math.max(88,Math.min(150,W*.16));paddle.h=Math.max(10,H*.018);\npaddle.y=H-Math.max(26,H*.045);paddle.x=W/2;paddle.vx=0;paddle.tx=null;paddle.wide=0;paddle.laser=0;paddle.laserCd=0;}\nfunction newBall(stuck){const sp=Math.min(11,6.2+level*.35),a=-Math.PI/2+(Math.random()*.6-.3);\nreturn{x:paddle.x,y:paddle.y-14,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:6.5,stuck:!!stuck,trail:[]};}\nfunction addScore(p,x,y){score+=p;if(score>best){best=score;try{localStorage.setItem('neonabyss_best',best);}catch(e){}}\nfloats.push({x:x||W/2,y:y||H/2,txt:'+'+p,t:1,col:'#ffd166'});hud();}\nfunction makeLevel(){\nbricks=[];bolts=[];const rows=Math.min(4+level,9),cols=Math.max(6,Math.floor(W/78)),bw=W/cols,bh=Math.max(15,H*.026);\nfor(let r=0;r<rows;r++)for(let c=0;c<cols;c++){\nif(r>2&&(r+c)%7===0)continue;\nbricks.push({x:c*bw+3,y:H*.09+r*(bh+5),w:bw-6,h:bh,hp:1,max:1,hue:180+Math.random()*160,\nspecial:Math.random()<.08?(Math.random()<.5?'bomb':['wide','multi','slow','laser','life','shield','skull'][(Math.random()*7)|0]):null,flash:0});\n}\nrowSpawns=0;rowCd=0;\nballs=[newBall(true)];resetPaddle();say('QUADRO '+level);levelFlash=1;hud();}\n/* Riga bonus dei gatti: se la pallina tocca il soffitto e riscende oltre la linea\n   dell'ultimo mattone in basso senza aver prima colpito un mattone, i gatti\n   aggiungono una riga casuale (con vuoti e varianti, mai VITA) nella prima riga\n   di griglia completamente libera dall'alto che non sia gia' occupata dalla\n   pallina. Dal quadro 2, massimo 3 righe per quadro, una sola per volley. */\nfunction spawnRow(ball){\nconst cols=Math.max(6,Math.floor(W/78)),bw=W/cols,bh=Math.max(15,H*.026),step=bh+5,top=H*.09;\nconst occ=[];for(let r=0;r<9;r++)occ[r]=false;\nfor(const br of bricks){if(br.hp<=0)continue;const r=Math.round((br.y-top)/step);if(r>=0&&r<9)occ[r]=true;}\nconst dens=Math.min(.65,.42+level*.03);\nfor(let r=0;r<9;r++){\nif(occ[r])continue;\nconst y=top+r*step;\nif(y+bh>ball.y-ball.r-6)continue;\nlet made=0;\nfor(let c=0;c<cols;c++){\nif(Math.random()>dens)continue;\nbricks.push({x:c*bw+3,y:y,w:bw-6,h:bh,hp:1,max:1,hue:180+Math.random()*160,\nspecial:Math.random()<.10?(Math.random()<.5?'bomb':['wide','multi','slow','laser','shield','skull'][(Math.random()*6)|0]):null,flash:1});\nmade++;}\nif(made>0){shake=Math.min(10,shake+5);sfx('newrow');say(\"i gatti hanno fatto un'altro pasticcio\");return true;}\n}\nreturn false;}\n/* ============ GAMEPLAY ============ */\nfunction explode(b){\nb.hp=0;shake=Math.min(14,shake+8);sfx('bomb');\nshocks.push({x:b.x+b.w/2,y:b.y+b.h/2,r:6,a:1});\nfor(let i=0;i<22;i++)parts.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,l:1,hue:20+Math.random()*40});\naddScore(18,b.x+b.w/2,b.y);\nfor(const o of bricks){if(o.hp<=0)continue;\nconst dx=(o.x+o.w/2)-(b.x+b.w/2),dy=(o.y+b.h/2)-(b.y+b.h/2);\nif(Math.hypot(dx,dy)<(b.w+o.w)*1.15){\nif(o.special==='bomb')setTimeout(()=>{if(o.hp>0)explode(o);},130);\nelse{o.hp=0;for(let i=0;i<10;i++)parts.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:1,hue:o.hue});}}}\n}\nfunction hitBrick(b,ball){\nb.hp--;b.flash=1;\nif(b.hp<=0){\ncombo++;comboT=1.5;\nif(b.special==='bomb'){explode(b);}\nelse{addScore(Math.round(10*(1+combo*.15)),b.x+b.w/2,b.y);\nif(b.special){spawnPower(b.special,b.x+b.w/2,b.y+b.h/2);sfx('special');}\nelse sfx('brick',Math.min(combo,12));\nfor(let i=0;i<10;i++)parts.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:1,hue:b.hue});}\n}}\nfunction spawnPower(type,x,y){parts.push({pw:type,x:x,y:y,vx:0,vy:2.1,l:1});}\nfunction fireLaser(){\nif(paddle.laser<=0||paddle.laserCd>0)return;paddle.laserCd=.22;sfx('laser');\nbolts.push({x:paddle.x-paddle.w/2+6,y:paddle.y-4},{x:paddle.x+paddle.w/2-6,y:paddle.y-4});}\nfunction launch(){\nlet did=false;\nfor(const b of balls)if(b.stuck){b.stuck=false;did=true;}\nif(!did&&paddle.laser>0)fireLaser();}\nfunction loseBall(){\ncombo=0;comboT=0;sfx('lose');shake=12;\nif(balls.length>0)return;\nlives--;hud();\nif(lives<=0){gameOver();}\nelse{balls=[newBall(true)];say('RIPARTI');}}\nfunction gameOver(){\nstate='over';MUS.stop();sfx('lose');\nconst rec=score>=best&&score>0;\ndocument.getElementById('overTitle').textContent=rec?'RECORD!':'GAME OVER';\ndocument.getElementById('overText').textContent='Punteggio finale: '+score;\ndocument.getElementById('newRecord').style.display=rec?'block':'none';\nendOfGame();\noverOv.classList.remove('hidden');}\nfunction nextLevel(){\nlevel++;if(level>15){winGame();return;}sfx('level');hud();makeLevel();}\nfunction winGame(){\nstate='over';MUS.stop();sfx('win');\nbellaWon=true;\npawScene(()=>{\nconst rec=score>=best&&score>0;\ndocument.getElementById('overTitle').textContent='HAI VINTO';\ndocument.getElementById('overText').textContent='I gatti sono salvi. Punteggio: '+score;\ndocument.getElementById('newRecord').style.display=rec?'block':'none';\nendOfGame();\noverOv.classList.remove('hidden');});}\n\n/* ============ FINALE CAPITOLO 1: i gatti e il topo alieno ============\n   Dopo il quadro 15, prima dell'inserimento della sigla: un topo alieno\n   appare al centro della scena, i gatti incuriositi si gonfiano sulla\n   difensiva, poi la scritta \"Kitty Pawcalipse - coming soon\". */\nlet pawRunning=false,pawFinish=null;\nfunction pawScene(done){\nconst c2=pawCv.getContext('2d');\nconst D=Math.min(devicePixelRatio||1,2);\npawCv.width=W*D;pawCv.height=H*D;c2.setTransform(D,0,0,D,0,0);\npawOv.classList.remove('hidden');pawRunning=true;\nconst stars2=[];for(let i=0;i<90;i++)stars2.push({x:Math.random(),y:Math.random(),s:Math.random()<.3?2:1,p:Math.random()*6.28});\nconst T_BEAM=.8,T_MOUSE=1.5,T_SCARE=4.4,T_TITLE=5.6,T_DONE=8.2;\nconst t0=performance.now();let appeared=false,squeaked=false;\nfunction px2(x,y,w,h,c){c2.fillStyle=c;c2.fillRect(Math.round(x),Math.round(y),w,h);}\nfunction txt2(s2,x,y,c,size,al){c2.font='bold '+size+'px monospace';c2.textAlign=al||'center';c2.textBaseline='middle';c2.fillStyle=c;c2.fillText(s2,x,y);}\nfunction glow2(x,y,r,c){const g=c2.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');c2.fillStyle=g;c2.fillRect(x-r,y-r,2*r,2*r);}\n/* gatto in pixel-art, posa normale o gonfia sulla difensiva */\nfunction pawCat(x,y,flip,female,sc,puff,tw){\nc2.save();c2.translate(x,y);c2.scale(flip?-sc:sc,sc);\nconst white='#fff',black='#161616',grey='#9aa0a6';\nif(puff){\npx2(-9,-8,4,11,female?black:grey);px2(-12,-11,3,4,female?black:grey);\npx2(-8,-4,16,15,white);\nfor(let i=0;i<5;i++)px2(-7+i*3.4,-7-(i%2)*2,2,3,white);\npx2(-5,11,3,3,white);px2(2,11,3,3,white);\nif(!female)px2(-3,0,7,6,grey);\nconst hy=-13;\npx2(-5,hy,12,10,white);px2(-5,hy-4,3,5,white);px2(4,hy-4,3,5,white);\nif(!female)px2(-5,hy-4,3,4,grey);\nif(female)px2(-1,hy,5,3,black);\npx2(-3,hy+3,3,4,black);px2(2,hy+3,3,4,black);px2(-2,hy+4,1,1,'#fff');px2(3,hy+4,1,1,'#fff');px2(0,hy+7,2,2,'#ff7ab8');\npx2(-1,hy+8,4,2,black);\n}else{\nconst tww=Math.sin(tw)*3;\npx2(-9,6+tww,4,3,female?black:grey);px2(-12,3+tww,3,4,female?black:grey);\npx2(-6,2,12,9,white);px2(-5,11,3,3,white);px2(2,11,3,3,white);\nif(!female)px2(-3,4,7,5,grey);\nconst hy=-6;\npx2(-4,hy,10,9,white);px2(-4,hy-3,3,4,white);px2(3,hy-3,3,4,white);\nif(!female)px2(-4,hy-3,3,3,grey);\nif(female)px2(-1,hy,4,3,black);\npx2(-3,hy+3,2,2,black);px2(2,hy+3,2,2,black);px2(0,hy+6,2,1,'#ff7ab8');}\nc2.restore();}\n/* topo alieno: verde, tre occhi, antenna luminosa, fluttua */\nfunction pawMouse(x,y,sc,u,scare){\nc2.save();c2.translate(x,y);c2.scale(sc,sc);\nglow2(0,-6,30,'rgba(57,255,136,.45)');\nconst gr='#39ff88',dk='#0d6b3a';\nc2.strokeStyle=gr;c2.lineWidth=1.6;c2.beginPath();c2.moveTo(6,-2);\nc2.quadraticCurveTo(14,2,12+Math.sin(u*4)*3,-8);c2.stroke();\npx2(11+Math.sin(u*4)*3,-10,2.6,2.6,'#b9ffd9');\npx2(-8,-14,5,6,gr);px2(3,-14,5,6,gr);px2(-7,-13,3,4,dk);px2(4,-13,3,4,dk);\npx2(-.8,-19,1.6,6,gr);px2(-2,-22+Math.sin(u*5),4,4,Math.sin(u*6)>0?'#ff2fd6':'#b026ff');\npx2(-7,-8,14,11,gr);px2(-6,-8,12,4,'#7dffab');\nconst eyec=scare?'#ff2233':'#161616',bl=Math.sin(u*2.7)>-.92;\nif(bl){px2(-4,-5,2.4,3,eyec);px2(1.6,-5,2.4,3,eyec);px2(-1.2,-9,2.4,2.4,eyec);}\nelse{px2(-4,-3.6,2.4,.8,eyec);px2(1.6,-3.6,2.4,.8,eyec);px2(-1.2,-8,2.4,.8,eyec);}\nif(scare){px2(-4.6,-6.4,3.2,.9,eyec);px2(1.4,-6.4,3.2,.9,eyec);}\npx2(-1,-2,2,1.6,'#ff7ab8');px2(-5,3,2.6,2,dk);px2(2.4,3,2.6,2,dk);\nc2.restore();}\nfunction finish(){if(!pawRunning)return;pawRunning=false;pawOv.classList.add('hidden');pawFinish=null;done();}\npawFinish=finish;pawSkipBtn.onclick=finish;\nfunction fr(now){\nif(!pawRunning)return;\nconst u=(now-t0)/1000;\nconst g=c2.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02040a');g.addColorStop(.6,'#071225');g.addColorStop(1,'#0b1030');\nc2.fillStyle=g;c2.fillRect(0,0,W,H);\nfor(const st of stars2){const b=.3+.7*Math.abs(Math.sin(u*2+st.p));c2.fillStyle='rgba(200,230,255,'+(b*.7)+')';c2.fillRect(st.x*W,st.y*H,st.s,st.s);}\nconst gy=H*.8,sc=Math.min(W,H)/92;\n/* raggio di teletrasporto al centro */\nif(u>T_BEAM){const k=clamp((u-T_BEAM)/.8,0,1),fade=1-clamp((u-T_TITLE)/1.2,0,1)*.6,bw=W*.05*k;\nc2.fillStyle='rgba(57,255,136,'+(.14*k*fade)+')';c2.fillRect(W/2-bw,0,bw*2,gy+24);\nc2.fillStyle='rgba(57,255,136,'+(.5*k*fade)+')';c2.fillRect(W/2-1.5,0,3,gy+24);\nc2.fillStyle='rgba(57,255,136,'+(.35*k*fade)+')';c2.beginPath();c2.ellipse(W/2,gy+22,bw*1.7,Math.max(2,bw*.4),0,0,7);c2.fill();}\n/* linea di orizzonte della plancia */\nc2.strokeStyle='rgba(139,92,255,.85)';c2.lineWidth=2;c2.shadowColor='#8b5cff';c2.shadowBlur=14;\nc2.beginPath();c2.moveTo(0,gy+24);c2.lineTo(W,gy+24);c2.stroke();c2.shadowBlur=0;\n/* i due gatti ai lati, rivolti verso il centro */\nconst scare=u>=T_SCARE,shk=scare&&u<T_SCARE+1?(Math.random()-.5)*3:0,catY=gy+24-14*sc;\npawCat(W*.27+shk,catY,false,true,sc,scare,u*9);\npawCat(W*.73+shk,catY,true,false,sc,scare,u*9+2);\nif(!scare&&u>T_MOUSE+.6){txt2('?',Math.sin(u*3)>0?W*.27:W*.73,catY-18*sc,'#ffd166',Math.round(5.4*sc));}\nif(scare){txt2('!!',W*.27,catY-20*sc,'#ff2233',Math.round(5.6*sc));txt2('!!',W*.73,catY-20*sc,'#ff2233',Math.round(5.6*sc));}\n/* il topo alieno appare nel raggio */\nif(u>T_MOUSE){\nif(!appeared){appeared=true;if(audioOn)[660,880,1174].forEach((f,i)=>setTimeout(()=>blip(f,.16,'triangle',.14),i*90));}\nif(scare&&!squeaked){squeaked=true;if(audioOn){blip(1568,.12,'square',.16);setTimeout(()=>blip(2093,.18,'square',.16),110);}}\nconst k=clamp((u-T_MOUSE)/.7,0,1),bob=Math.sin(u*2.4)*5*k;\npawMouse(W/2,gy+24-16*sc*.85+bob,sc*.85*k,u,scare);\nif(scare&&Math.sin(u*10)>0)txt2('SQUEAK!',W/2,gy+24-34*sc*.85,'#ff2fd6',Math.round(4.4*sc));}\n/* la scritta */\nif(u>T_TITLE){const k=clamp((u-T_TITLE)/.9,0,1),ts=Math.min(46,Math.round(W/15));\nc2.globalAlpha=k;\nc2.shadowColor='#ff2fd6';c2.shadowBlur=26;txt2('KITTY PAWCALIPSE',W/2,H*.28,'#ff2fd6',ts);\nc2.shadowColor='#00e5ff';c2.shadowBlur=18;txt2('- COMING SOON -',W/2,H*.28+ts*1.35,'#00e5ff',Math.round(ts*.52));\nc2.shadowBlur=0;c2.globalAlpha=1;}\nif(u>=T_DONE){finish();return;}\nrequestAnimationFrame(fr);}\nrequestAnimationFrame(fr);}\nfunction update(dt){\nif(state!=='play')return;\nshake=Math.max(0,shake-30*dt);levelFlash=Math.max(0,levelFlash-dt*1.4);\ncomboT-=dt;if(comboT<=0)combo=0;\nif(rowCd>0)rowCd-=dt;\nif(paddle.wide>0)paddle.wide-=dt;if(paddle.laser>0)paddle.laser-=dt;\nif(paddle.laserCd>0)paddle.laserCd-=dt;\nconst wideMul=paddle.wide>0?1.5:1;\nconst pw=Math.min(W*.4,Math.max(88,Math.min(150,W*.16))*wideMul);\npaddle.w+=(pw-paddle.w)*Math.min(1,dt*10);\nif(paddle.vx!==0){paddle.x+=paddle.vx*dt*60;paddle.tx=null;}\nelse if(paddle.tx!=null){const k=Math.min(1,dt*22);paddle.x+=(paddle.tx-paddle.x)*k;\nif(Math.abs(paddle.tx-paddle.x)<.5)paddle.x=paddle.tx;}\npaddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));\n/* balls: dt-scaled with substeps */\nconst f=dt*60;\nfor(const b of balls){\nif(b.stuck){b.x=paddle.x;b.y=paddle.y-b.r-8;b.trail.length=0;continue;}\nconst dist=Math.hypot(b.vx,b.vy)*f,steps=Math.max(1,Math.ceil(dist/4)),sx=b.vx*f/steps,sy=b.vy*f/steps;\nfor(let s=0;s<steps;s++){\nb.x+=sx;b.y+=sy;\nif(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);sfx('wall');}\nif(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);sfx('wall');}\nif(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);sfx('wall');b.ceil=true;}\n/* paddle */\nif(b.vy>0&&b.y+b.r>paddle.y&&b.y-b.r<paddle.y+paddle.h&&Math.abs(b.x-paddle.x)<paddle.w/2+b.r){\nconst rel=Math.max(-1,Math.min(1,(b.x-paddle.x)/(paddle.w/2)));\nconst sp=Math.hypot(b.vx,b.vy),ang=rel*1.15;\nb.vx=Math.sin(ang)*sp;b.vy=-Math.cos(ang)*sp;\nif(Math.abs(b.vy)<sp*.35){b.vy=-sp*.35;b.vx=Math.sign(b.vx||1)*Math.sqrt(sp*sp-b.vy*b.vy);}\nb.y=paddle.y-b.r-1;combo=0;b.ceil=false;sfx('paddle');\nfor(let i=0;i<6;i++)parts.push({x:b.x,y:paddle.y,vx:(Math.random()-.5)*4,vy:-Math.random()*3,l:.7,hue:190});}\n/* shield */\nif(b.vy>0&&b.y>H-b.r-6&&shieldN>0){\nshieldN--;b.vy=-Math.abs(b.vy);b.y=H-b.r-7;b.ceil=false;sfx('shield');\nsay('SCUDO SALVA');shake=Math.min(10,shake+5);\nfor(let i=0;i<14;i++)parts.push({x:b.x,y:H-8,vx:(Math.random()-.5)*8,vy:-Math.random()*5,l:1,hue:200});}\n/* bricks */\nfor(const br of bricks){\nif(br.hp<=0)continue;\nif(b.x+b.r>br.x&&b.x-b.r<br.x+br.w&&b.y+b.r>br.y&&b.y-b.r<br.y+br.h){\nconst cx=Math.max(br.x,Math.min(b.x,br.x+br.w)),cy=Math.max(br.y,Math.min(b.y,br.y+br.h));\nif(Math.hypot(b.x-cx,b.y-cy)<b.r){\nb.ceil=false;\nconst ox=Math.min(b.x+b.r-br.x,br.x+br.w-(b.x-b.r)),oy=Math.min(b.y+b.r-br.y,br.y+br.h-(b.y-b.r));\nif(ox<oy)b.vx=-b.vx;else b.vy=-b.vy;\nif(Math.abs(b.vy)<1.2)b.vy=Math.sign(b.vy||-1)*1.2;\nhitBrick(br,b);break;}}\n}}\n/* riga bonus: pallina armata dal soffitto che scende oltre l'ultimo mattone vivo */\nif(b.ceil&&b.vy>0){\nlet low=0;for(const br of bricks)if(br.hp>0)low=Math.max(low,br.y+br.h);\nif(low>0&&b.y-b.r>low&&level>=2&&rowSpawns<3&&rowCd<=0){\nif(spawnRow(b)){rowSpawns++;rowCd=3;for(const o of balls)o.ceil=false;}\n}}\nb.trail.unshift({x:b.x,y:b.y});if(b.trail.length>12)b.trail.pop();\n}\nballs=balls.filter(b=>{\nif(b.y-b.r>H+20){return false;}return true;});\nif(balls.length===0&&state==='play')loseBall();\n/* laser bolts */\nfor(const bl of bolts){bl.y-=620*dt;\nfor(const br of bricks){if(br.hp<=0)continue;\nif(bl.x>br.x&&bl.x<br.x+br.w&&bl.y>br.y&&bl.y<br.y+br.h){bl.y=-999;hitBrick(br,null);break;}}}\nbolts=bolts.filter(b=>b.y>-20);\n/* powerups falling */\nfor(const p of parts){if(!p.pw)continue;\np.y+=p.vy*f;\nif(p.y>paddle.y-8&&p.y<paddle.y+22&&Math.abs(p.x-paddle.x)<paddle.w/2+14){\np.l=0;\nif(p.pw==='skull'){sfx('skull');lives=Math.max(0,lives-1);hud();shake=Math.min(12,shake+6);say('TESCHIO! VITA PERSA');\nfor(let i=0;i<14;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()- 4,7,5,7],'7':[7,1,1,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,7],\n' ':[0,0,0,0,0],'.':[0,0,0,0,2],',':[0,0,0,2,4],':':[0,2,0,2,0],';':[0,2,0,2,4],\n'!':[2,2,2,0,2],'?':[7,1,3,0,2],'-':[0,0,7,0,0],'+':[0,2,7,2,0],'/':[1,1,2,4,4],\n'(':[1,2,2,2,1],')':[4,2,2,2,4],\"'\":[2,2,0,0,0],'%':[5,1,2,4,5],'&':[2,5,2,5,3],\n'^':[2,5,0,0,0],'<':[1,2,4,2,1],'>':[4,2,1,2,4],'=':[0,7,0,7,0],'*':[5,2,7,2,5],'_':[0,0,0,0,7]\n};\nfunction ptext(g,str,x,y,color,scale=1,center=false){\n  str=String(str).toUpperCase();\n  const cw=(3+1)*scale;\n  let sx=center?x-str.length*cw/2:x;\n  g.fillStyle=color;\n  for(let i=0;i<str.length;i++){\n    const gl=FONT[str[i]]||FONT[' '];\n    for(let r=0;r<5;r++){const bits=gl[r];\n      for(let c=0;c<3;c++)if(bits&(1<<(2-c)))g.fillRect(sx+i*cw+c*scale,y+r*scale,scale,scale);\n    }\n  }\n  return sx;\n}\nfunction drawCat8(g,x,y,f,o){\n  // Ibrida: i gatti come nel secondo capitolo della trilogia, un po' piu' grandi.\n  // Solo pixel interi: tutto a fuoco. Lilli macchie nere SENZA fiocco, Cosmo macchie grigie.\n  const fr=f.frame, t=f.t||0;\n  const female=!!o.bow; // bow resta solo come identita': il fiocco non si disegna piu'\n  const spotC=o.bella?'#4f4c49':female?'#161616':'#9aa0a6';\n  const WHT=o.bella?'#a5a19b':'#ffffff', PNK='#ff7ab8', EYE='#161616';\n  g.save();\n  g.translate(Math.round(x)+5,Math.round(y)-2);\n  if((o.dir||1)<0)g.scale(-1,1);\n  const P=(rx,ry,rw,rh,c)=>{g.fillStyle=c;g.fillRect(rx,ry,rw,rh);};\n  const tw=Math.round(Math.sin(t*5)*2);\n  const bob=(fr==='run')?Math.round(Math.sin(t*12)):0;\n  const slow=()=>{if(o.slow){P(-4,9,2,3,'#8b5cff');P(0,10,2,3,'#8b5cff');P(4,9,2,2,'#8b5cff');}};\n  const eyes=(hy,mode)=>{\n    if(mode==='closed'){P(-3,hy+4,2,1,EYE);P(2,hy+4,2,1,EYE);return;}\n    if(mode==='wink'){P(-3,hy+4,2,1,EYE);P(2,hy+3,2,2,EYE);return;}\n    P(-3,hy+3,2,2,EYE);P(2,hy+3,2,2,EYE);\n  };\n  const head=(hy,mode)=>{\n    P(-4,hy,10,9,WHT);P(-4,hy-3,3,4,WHT);P(3,hy-3,3,4,WHT);\n    if(!female)P(-4,hy-3,3,3,spotC);\n    if(female)P(-1,hy,4,3,spotC);\n    eyes(hy,mode);if(o.bella){P(-4,hy+1,2,1,spotC);P(2,hy+1,3,1,spotC);P(0,hy,1,2,spotC);P(-3,hy+6,6,3,'#fff5eb');}P(0,hy+6,2,1,PNK);\n  };\n  if(fr==='stretch'){\n    P(-13,0+tw,3,4,spotC);P(-12,4+tw,4,3,spotC);   // coda alta\n    P(-10,6,16,4,WHT);P(-6,4,8,2,WHT);              // corpo lungo inarcato\n    if(!female)P(-4,5,6,3,spotC);\n    P(6,4,8,5,WHT);P(6,2,2,3,WHT);P(11,2,2,3,WHT);  // testa bassa avanti\n    if(female)P(8,4,3,2,spotC);\n    P(7,6,2,1,EYE);P(13,7,2,1,PNK);                 // occhi chiusi, contento\n    P(10,10,3,3,WHT);P(12,10,2,2,WHT);P(-8,10,3,3,WHT);\n    slow();g.restore();return;\n  }\n  if(fr==='sit'){\n    const wag=Math.round(Math.sin(t*3));\n    P(-6,4,12,8,WHT);if(o.bella){P(-6,6,3,1,spotC);P(3,6,3,1,spotC);P(-6,9,3,1,spotC);P(3,9,3,1,spotC);P(-2,4,4,4,'#fff5eb');}                               // corpo seduto\n    if(!female)P(-3,6,7,4,spotC);\n    head(-4,o.wink?'wink':((t%3.4)<0.16?'closed':'open'));\n    P(-2,11,3,3,WHT);P(1,11,3,3,WHT);if(o.bella){P(-3,13,3,1,spotC);P(2,13,3,1,spotC);}               // zampine unite\n    P(6,10+wag,5,2,spotC);P(9,(o.bella?5:8)+wag,2,o.bella?7:4,spotC);if(o.bella){P(9,6+wag,2,1,WHT);P(9,9+wag,2,1,WHT);}     // coda raccolta davanti\n    slow();g.restore();return;\n  }\n  if(fr==='jump'){\n    P(-9,8+tw,4,3,spotC);P(-12,6+tw,3,4,spotC);     // coda bassa\n    P(-6,-2,12,9,WHT);                              // corpo raccolto\n    if(!female)P(-3,0,7,5,spotC);\n    head(-10,'open');\n    P(-5,7,3,3,WHT);P(2,7,3,3,WHT);                 // zampe raccolte\n    slow();g.restore();return;\n  }\n  if(fr==='climb'){\n    const k=Math.sin(t*8)>0?1:0;\n    P(-9,8,4,3,spotC);P(-12,10,3,4,spotC);          // coda pendente\n    P(-6,2,12,9,WHT);\n    if(!female)P(-3,4,7,5,spotC);\n    head(-6,'open');\n    P(4,-4+k*2,3,5,WHT);P(4,3-k*2,3,5,WHT);         // braccia che si alternano\n    P(-4,11,3,3,WHT);P(1,11,3,3,WHT);\n    slow();g.restore();return;\n  }\n  // stand / run / scratch\n  P(-9,(fr==='run'?3:6)+tw,4,3,spotC);P(-12,(fr==='run'?0:3)+tw,3,4,spotC);\n  P(-6,2+bob,12,9,WHT);\n  if(!female)P(-3,4+bob,7,5,spotC);\n  const blink=(fr==='stand'&&(t%2.6)<0.18)?'closed':'open';\n  head(-6+bob,blink);\n  if(fr==='scratch'){\n    P(5,3+bob,9,3,WHT);P(13,1+bob,4,6,WHT);P(15,3+bob,2,2,PNK); // zampa tesa con polpastrello\n    P(-5,11,3,3,WHT);P(2,11,3,3,WHT);\n  }else if(fr==='run'){\n    const ph=Math.sin(t*12)>0;\n    P(-5,ph?10:11,3,3,WHT);P(2,ph?11:10,3,3,WHT);\n  }else{\n    P(-5,11,3,3,WHT);P(2,11,3,3,WHT);\n  }\n  slow();g.restore();\n}\nfunction drawAnt8(g,x,y,t,variant,dir=1,turn=0){\n  const queen=variant==='queen',helmet=variant==='helmet',sc=queen?1.5:1;\n  g.save();g.translate(Math.round(x)+8,Math.round(y)-3);g.scale(sc,sc);\n  if(turn){drawEnemyTurn(g,t,variant,turn>12);g.restore();return;}\n  g.scale(dir,1);g.translate(-11,0);\n  const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};\n  const body=queen?'#b84cee':'#16b9a9',dark=queen?'#46135f':'#063b43',light=queen?'#eba5ff':'#7dfbe4';\n  const leg=Math.sin(t*14)>0?1:0;\n  // Six articulated legs, thin waist, large rear abdomen, small head.\n  for(let i=0;i<3;i++){\n    const k=(i+leg)%2;P(7+i*3,5,1,4,dark);P(5+i*3-k,8,3,1,dark);P(5+i*3-k,9,1,3,dark);P(4+i*3-k,11,2,1,light);\n    P(7+i*3,3,1,3,dark);P(6+i*3+k,1,3,1,dark);P(6+i*3+k,0,1,2,dark);\n  }\n  P(-2,3,8,7,dark);P(-3,5,10,3,dark);P(-1,4,6,5,body);P(0,4,3,1,light);P(0,7,5,1,dark);\n  P(6,5,3,2,dark);P(9,3,5,6,dark);P(10,4,3,4,body);P(10,4,2,1,light);P(14,5,2,2,dark);\n  P(16,2,6,6,dark);P(17,3,4,4,body);P(19,3,2,1,light);P(20,4,1,1,'#ffe16e');\n  P(22,3,2,1,dark);P(23,2,2,1,dark);P(22,7,2,1,dark);P(23,8,2,1,dark);\n  P(17,-1,1,3,dark);P(15,-3,3,2,dark);P(20,-2,1,4,dark);P(21,-4,3,2,dark);\n  if(helmet){P(15,0,9,3,'#efb431');P(14,2,11,2,'#fff1a0');P(19,-1,2,4,'#fff1a0');}\n  if(queen){P(16,-3,6,2,'#ffd34d');P(16,-6,1,3,'#ffd34d');P(19,-7,1,4,'#ffd34d');P(21,-6,1,3,'#ffd34d');}\n  g.restore();\n}\nfunction drawEnemyTurn(g,t,v t*6)>0?'#ff2fd6':'#b026ff');\n  // corpo e pancia\n  P(-7,-2,14,11,GR);P(-6,-2,12,4,BEL);\n  // tre occhi (il terzo sulla fronte)\n  P(-4,1,2,3,EYE);P(2,1,2,3,EYE);P(-1,-3,2,2,EYE);\n  P(-4,1,1,1,'#fff');\n  // naso rosa\n  P(-1,5,2,2,PK);\n  // zampe\n  P(-5,9+lg,3,2,DK);P(2,10-lg,3,2,DK);\n  // buffa pistola spaziale viola\n  P(8,0,7,4,'#8b5cff');P(9,4,3,3,'#5b34a8');P(14,-1,2,6,'#b026ff');P(16,1,4,3,'#8b5cff');\n  const tip=aim?(Math.sin(t*30)>0?'#ffffff':'#ff2fd6'):'#39ff88';\n  P(20,0,3,5,tip);\n  if(aim){g.strokeStyle='rgba(180,255,126,.8)';g.lineWidth=1;g.beginPath();g.arc(22,2,5+Math.round(Math.sin(t*20)*2),0,7);g.stroke();}\n  g.restore();\n}\nfunction drawSkull(g,x,y,t){\n  g.save(); g.translate(Math.round(x),Math.round(y+Math.sin(t*4)));\n  g.fillStyle='#e8e6f2'; g.fillRect(1,0,6,5); g.fillRect(2,5,4,2);\n  g.fillStyle='#1a1428'; g.fillRect(2,2,1,2); g.fillRect(5,2,1,2); g.fillRect(3,4,2,1);\n  g.fillStyle='#e8e6f2'; g.fillRect(2,6,1,1); g.fillRect(5,6,1,1);\n  g.restore();\n}\nfunction drawKibble(g,x,y,t,kind){\n  g.save(); g.translate(Math.round(x),Math.round(y));\n  const bob=Math.round(Math.sin(t*4+x)*1);\n  g.translate(0,bob);\n  if(kind==='gold'){g.fillStyle='#ffd34d';g.fillRect(1,0,4,6);g.fillRect(0,1,6,4);\n    g.fillStyle='#fff0b0';g.fillRect(2,1,2,1);g.fillStyle='#c8922a';g.fillRect(2,3,2,2);}\n  else if(kind==='heart'){g.fillStyle='#ff5da2';g.fillRect(1,0,2,2);g.fillRect(4,0,2,2);\n    g.fillRect(0,1,7,3);g.fillRect(1,4,5,1);g.fillRect(2,5,3,1);g.fillRect(3,6,1,1);\n    g.fillStyle='#ffd3e4';g.fillRect(1,1,1,1);}\n  else{g.fillStyle='#160e35';g.fillRect(-1,0,8,6);g.fillRect(0,-1,6,8);g.fillStyle='#ff6138';g.fillRect(1,0,4,6);g.fillRect(0,1,6,4);\n    g.fillStyle='#fff3a0';g.fillRect(1,1,2,1);g.fillStyle='#a62c28';g.fillRect(2,2,2,2);}\n  g.restore();\n}\n\n/* Mantide religiosa aliena — il boss. Disegnata in grande. */\nfunction drawMantis8(g,x,y,t,o){\n  // o: {hp,maxhp,phase,flash,dir}\n  g.save(); g.translate(Math.round(x),Math.round(y));\n
