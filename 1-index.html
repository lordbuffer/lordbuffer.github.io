       if(p&&!p.dead&&m.y<p.y-26)this.jumpEdge=true;\n      }\n    });\n    const up=e=>{if(e.pointerType!=='mouse')return; this.mouse.down=false; this.mouse.atk=false;};\n    addEventListener('pointerup',up); addEventListener('pointercancel',up);\n  },\n  poll(){\n    const k=this.keys,t=this.touch||{};\n    let l=k['ArrowLeft']||k['a']||k['A']||t.l, r=k['ArrowRight']||k['d']||k['D']||t.r;\n    let u=k['ArrowUp']||k['w']||k['W']||t.u, d=k['ArrowDown']||k['s']||k['S']||t.d;\n    let j=k[' ']||k['z']||k['Z']||this.tJump, a=k['x']||k['X']||this.tAtk;\n    let ax=this.analogX||0;\n    if(this.padIdx>=0){\n      const pads=navigator.getGamepads?navigator.getGamepads():[];\n      const gp=pads[this.padIdx];\n      if(gp){\n        const gx=gp.axes[0]||0, gy=gp.axes[1]||0;\n        if(gx<-.3){l=true;ax=gx;} if(gx>.3){r=true;ax=gx;}\n        if(gy<-.4)u=true; if(gy>.4)d=true;\n        if(gp.buttons[14]&&gp.buttons[14].pressed)l=true;\n        if(gp.buttons[15]&&gp.buttons[15].pressed)r=true;\n        if(gp.buttons[12]&&gp.buttons[12].pressed)u=true;\n        if(gp.buttons[13]&&gp.buttons[13].pressed)d=true;\n        const A=gp.buttons[0]&&gp.buttons[0].pressed, X=gp.buttons[2]&&gp.buttons[2].pressed;\n        const ST=gp.buttons[9]&&gp.buttons[9].pressed;\n        if(A&&!this._gpA)this.jumpEdge=true;\n        if(X&&!this._gpX)this.atkEdge=true;\n        if(ST&&!this._gpS)this.startEdge=true;\n        if(A||X||ST)this.anyKey=true;\n        j=j||A; a=a||X;\n        this._gpA=A; this._gpX=X; this._gpS=ST;\n      }\n    }\n    const m=this.mouse;\n    if(m&&Game.state==='play'&&!Game.paused){\n      const p=Game.player;\n      if(p&&!p.dead&&m.down){\n        const sx=p.x-Game.camX;\n        if(p.climbing||onVine(Game.lv,p)){ if(m.y<p.y-10)u=true; else if(m.y>p.y+22)d=true; }\n        if(m.x<sx-8)l=true; else if(m.x>sx+8)r=true;\n        if(m.y<p.y-26)j=true;\n      }\n      if(m.atk)a=true;\n    }\n    this.left=l; this.right=r; this.up=u; this.down=d; this.jump=j; this.atk=a; this.ax=ax;\n  },\n  clearEdges(){this.jumpEdge=false; this.atkEdge=false; this.startEdge=false; this.anyKey=false;}\n};\n\n/* ============================================================\n   FISICA E MONDO\n   ============================================================ */\nconst GRAV=.28, MAXFALL=5.2;\nfunction tileAt(lv,tx,ty){\n  if(ty<0)return ' ';\n  if(ty>=lv.h)return ' '; // Outside the map is void, never an invisible floor.\n  if(tx<0||tx>=lv.w)return 'R';\n  return lv.map[ty][tx];\n}\nconst SOLID=t=>t==='G'||t==='D'||t==='R'||t==='b';\nfunction solidAt(lv,px,py){return SOLID(tileAt(lv,Math.floor(px/TILE),Math.floor(py/TILE)));}\nfunction platAt(lv,px,py){return tileAt(lv,Math.floor(px/TILE),Math.floor(py/TILE))==='P';}\n\n/* ---------- entita' ---------- */\nfunction newPlayer(cat){\n  // Lilli: salto piu' alto. Cosmo: piu' veloce.\n  const lilli=cat==='lilli';\n  return {\n    cat, x:0,y:0,w:11,h:11, vx:0,vy:0, dir:1,\n    speed:lilli?1.7:2.05, jumpV:lilli?-6.6:-6.0,\n    ground:false, coyote:0, jbuf:0, climbing:false, invuln:0, atkT:0, atkCd:0, slowT:0,\n    animT:0, dead:0, spot:lilli?'#232030':'#98a2b8', bow:lilli,\n    name:lilli?'LILLI':'COSMO'\n  };\n}\nfunction otherCatInfo(cat){\n  return cat==='lilli'?{spot:'#98a2b8',bow:false,name:'COSMO'}:{spot:'#232030',bow:true,name:'LILLI'};\n}\nfunction moveBody(lv,e){\n  // X\n  e.x+=e.vx;\n  if(e.vx>0){const r=e.x+e.w;\n    if(solidAt(lv,r,e.y+1)||solidAt(lv,r,e.y+e.h-1)||solidAt(lv,r,e.y+e.h/2)){\n      e.x=Math.floor(r/TILE)*TILE-e.w-.01; e.vx=0; e.hitWall=true;}\n  }else if(e.vx<0){\n    if(solidAt(lv,e.x,e.y+1)||solidAt(lv,e.x,e.y+e.h-1)||solidAt(lv,e.x,e.y+e.h/2)){\n      e.x=(Math.floor(e.x/TILE)+1)*TILE+.01; e.vx=0; e.hitWall=true;}\n  }\n  // Y\n  const prevBottom=e.y+e.h;\n  e.y+=e.vy;\n  e.ground=false;\n  if(e.vy>0){const b=e.y+e.h;\n    if(solidAt(lv,e.x+1,b)||solidAt(lv,e.x+e.w-1,b)){\n      e.y=Math.floor(b/TILE)*TILE-e.h-.01; e.vy=0; e.ground=true;\n    }else{\n      // pedane semi-solide: solo caduta dall'alto\n      const ty=Math.floor(b/TILE);\n      if((platAt(lv,e.x+2,b)||platAt(lv,e.x+e.w-2,b))&&prevBottom<=ty*TILE+3&&!(e.ignorePlatforms||(e===Game.player&&Input.down))){\n        e.y=ty*TILE-e.h-.01; e.vy=0; e.ground=true;\n      }\n    }\n  }else if(e.vy<0){\n    if(solidAt(lv,e.x+1,e.y)||solidAt(lv,e.x+e.w-1,e.y)){\n      e.y=(Math.floor(e.y/TILE)+1)*TILE+.01; e.vy=0;\n    }\n  }\n}\nfunction onVine(lv,e){\n  const cx=e.x+e.w/2, cy=e.y+e.h/2;\n  return tileAt(lv,Math.floor(cx/TILE),Math.floor(cy/TILE))==='L'||\n         tileAt(lv,Math.floor(cx/TILE),Math.floor((e.y+2)/TILE))==='L';\n}\n\n/* ---------- nemici ---------- */\nfunction newEnemy(ch,tx,ty){\n  const x=tx*TILE+2, y=ty*TILE;\n  if(ch==='a'||ch==='u'||ch==='v')return {type:'ant',variant:ch==='v'?'queen':ch==='u'?'helmet':'standard',armored:ch==='u',x,y:y+(ch==='v'?0:8),w:ch==='v'?22:16,h:ch==='v'?16:8,vx:.45,dir:1,t:rnd(10),hp:ch==='v'?3:1,dead:0,hitCd:0};\n  if(ch==='m')return {type:'mouse',x,y:y+5,w:15,h:11,vx:.7,dir:1,t:rnd(10),hp:2,dead:0,shotCd:irnd(80,160)};\n  if(ch==='s')return {type:'skull',x,y:y+3,w:8,h:8,t:rnd(10),ox:x,oy:y+3,dead:0};\n  return null;\n}\nfunction turnEnemy(e,dir){if(dir===e.dir||e.turnT)return;e.nextDir=dir;e.turnT=24;e.vx=0;}\nfunction enemyBox(e){const w=e.turnT?e.w*.55:e.w;return {x:e.x+(e.w-w)/2,y:e.y,w,h:e.h};}\nfunction queenRoute(lv,e){\n  let best=null;\n  for(let x=Math.max(1,Math.floor(e.x/16)-12);x<Math.min(lv.w-1,Math.floor(e.x/16)+13);x++){\n    for(let y=1;y<lv.h-2;y++){\n      const climb=yy=>tileAt(lv,x,yy)==='L'||(tileAt(lv,x,yy)==='P'&&(tileAt(lv,x,yy-1)==='L'||tileAt(lv,x,yy+1)==='L'));\n      if(!climb(y)||climb(y-1))continue;\n      let bottom=y;while(climb(bottom+1))bottom++;\n      if(bottom-y<3||Math.abs((bottom+1)*16-(e.y+e.h))>26)continue;\n      for(const side of [-1,1]){\n        if(tileAt(lv,x+side,y)!=='P')continue;\n        const target=(x+side)*16+8-e.w/2;\n        if(solidAt(lv,target+1,y*16-e.h+1)||solidAt(lv,target+e.w-1,y*16-1))continue;\n        let safe=true;\n        for(let px=Math.min(e.x,x*16+8-e.w/2);px<=Math.max(e.x,x*16+8-e.w/2);px+=6){\n          if(solidAt(lv,px+e.w/2,e.y+e.h/2)||(!solidAt(lv,px+e.w/2,e.y+e.h+3)&&!platAt(lv,px+e.w/2,e.y+e.h+3))){safe=false;break;}\n        }\n        if(!safe)continue;\n        const dist=Math.abs(x*16+8-(e.x+e.w/2));\n        if(!best||dist<best.dist)best={x:x*16+8-e.w/2,top:y*16-e.h-.01,bottom:(bottom+1)*16-e.h-.01,side,target,dist};\n      }\n    }\n  }return best;\n}\nfunction updQueen(G,e){\n  if(e.variant!=='queen')return false;\n  const lv=G.lv;\n  if(e.routeCd>0)e.routeCd--;\n  if(!e.route&&!e.routeCd&&e.ground){e.route=queenRoute(lv,e);e.qphase=e.route?'approach':null;if(!e.route)e.routeCd=120;e.routeAge=0;}\n  const r=e.route;if(!r)return false;\n  e.routeAge=(e.routeAge||0)+1;if(e.routeAge>1600){e.route=null;e.qphase=null;e.routeCd=240;e.ignorePlatforms=false;return false;}\n  const walkTo=(x)=>{const dx=x-e.x;if(Math.abs(dx)<.8){e.x=x;e.vx=0;return true;}const d=dx<0?-1:1;if(d!==e.dir){turnEnemy(e,d);return false;}e.vx=d*.6;e.vy=Math.min((e.vy||0)+GRAV,MAXFALL);e.hitWall=false;moveBody(lv,e);if(e.hitWall){e.route=null;e.routeCd=240;e.qphase=null;}return false;};\n  if(e.qphase==='approach'){if(walkTo(r.x)){e.qphase='up';e.vy=0;}}\n  else if(e.qphase==='up'){e.x=r.x;e.y=Math.max(r.top,e.y-.68);e.vx=e.vy=0;e.ground=false;if(e.y<=r.top)e.qphase='exit';}\n  else if(e.qphase==='exit'){const arrived=walkTo(r.target);e.y=r.top;e.vy=0;if(arrived){e.qphase='rest';e.restT=180;e.vy=0;}}\n  else if(e.qphase==='rest'){e.vx=e.vy=0;if(--e.restT<=0)e.qphase='return';}\n  else if(e.qphase==='return'){const arrived=walkTo(r.x);e.y=r.top;e.vy=0;if(arrived){e.qphase='down';e.vy=0;}}\n  else if(e.qphase==='down'){e.x=r.x;e.y=Math.min(r.bottom,e.y+.58);e.vx=e.vy=0;e.ground=false;if(e.y>=r.bottom){e.route=null;e.qphase=null;e.routeCd=300;e.ground=true;turnEnemy(e,-e.dir);}}\n  return true;\n}\nfunction updEnemy(G,e){\n  if(e.dead>0){e.dead--;return;}if(e.hitCd>0)e.hitCd--;e.t+=1/60;\n  const lv=G.lv;\n  if(e.type==='ant'||e.type==='mouse'){\n    if(e.turnT>0){e.turnT--;if(!e.turnT){e.dir=e.nextDir;e.nextDir=null;}return;}\n    if(updQueen(G,e))return;\n    const sp=e.type==='ant'?.45:.7;e.hitWall=false;e.vx=sp*e.dir;e.vy=Math.min((e.vy||0)+GRAV,MAXFALL);moveBody(lv,e);\n    if(e.hitWall)turnEnemy(e,-e.dir);\n    else if(e.ground){const ahead=e.dir>0?e.x+e.w+2:e.x-2;if(!solidAt(lv,ahead,e.y+e.h+2)&&!platAt(lv,ahead,e.y+e.h+2))turnEnemy(e,-e.dir);}\n    if(e.type==='mouse'&&!e.turnT){\n      e.shotCd--;const p=G.player,dx=p.x-e.x,dy=Math.abs(p.y-e.y);\n      if(e.shotCd<=0&&Math.abs(dx)<170&&dy<40&&!p.dead){\n        const dir=dx<0?-1:1;if(dir!==e.dir){turnEnemy(e,dir);return;}\n        e.shotCd=irnd(130,220);G.shots.push({x:e.x+(dir<0?-2:14),y:e.y+5,vx:2.1*dir,t:0});Audio8.sfx('shoot');\n      }\n    }\n  }else if(e.type==='skull'){e.y=e.oy+Math.sin(e.t*1.6)*14;e.x=e.ox+Math.sin(e.t*.8)*8;}\n}\nfunction killEnemy(G,e,byScratch){\n  if(e.hitCd>0)return;\n  if(e.armored){e.armored=false;e.variant='standard';e.hitCd=22;Audio8.sfx('cage');burst(G,e.x,e.y,'#ffd34d',12);G.floats.push({x:e.x,y:e.y-12,txt:'HELMET OFF!',life:45,color:'#ffd34d'});return;}\n  e.hp--;if(e.hp>0){e.hitCd=24;Audio8.sfx('bossHit');burst(G,e.x,e.y,'#c386f0',8);return;}\n  e.dead=30; e.gone=true;\n  Audio8.sfx('enemyDie'); vib(VIB.stomp);\n  addScore(G,byScratch?150:100,e.x,e.y);\n  burst(G,e.x+e.w/2,e.y+4,'#9fe08a',10);\n}\n\n/* ---------- boss: la mantide ---------- */\nfunction newBoss(tx,ty){\n  return {x:tx*TILE-20,y:ty*TILE-88,w:64,h:70,hp:10,maxhp:10,t:0,phase:'idle',\n    phaseT:80,dir:-1,flash:0,state:'wait',vx:0,vy:0,stun:0,hitCd:0,baseY:ty*TILE-88,homeX:tx*TILE-20,roar:false};\n}\nfunction updBoss(G,b){\n  const p=G.player, lv=G.lv;\n  b.t+=1/60; if(b.flash>0)b.flash--;\n  if(b.hp<=0){b.state='dying'; b.dieT=(b.dieT||0)+1;\n    if(b.dieT%12===0)burst(G,b.x+rnd(10,54),b.y+rnd(10,50),'#59d68a',8),Audio8.sfx('bossHit');\n    if(b.dieT>110){b.gone=true; Audio8.sfx('bossRoar'); vib(VIB.win); G.bossDown=true;}\n    return;\n  }\n  if(b.hitCd>0)b.hitCd--;\n  if(b.stun>0){b.stun--;b.state='stunned';const headY=b.y+6;if(b.hitCd<=0&&p.vy>0&&overlap(p,{x:b.x+8,y:headY,w:48,h:60})&&p.y+p.h-p.vy<=headY+8){hitBoss(G,b);p.y=headY-p.h-1;p.vy=p.jumpV*.72;}if(b.stun===0){b.state='wait';b.phaseT=75;}return;}\n  b.phaseT--;\n  const dx=(p.x+p.w/2)-(b.x+32);\n  b.dir=dx<0?-1:1;\n  if(b.state==='wait'){ b.y=b.baseY+Math.sin(b.t*2)*3;\n    if(b.phaseT<=0){ // scegli attacco\n      const r=Math.random();\n      if(r<.4){b.state='swoop'; b.phaseT=70; b.sx=b.x; b.sy=b.y;\n        b.tx=clamp(p.x-16,(lv.arenaX||72*TILE),(lv.w-6)*TILE); b.ty=p.y-40;}\n      else if(r<.75){b.state='spit'; b.phaseT=50;}\n      else{b.state='summon'; b.phaseT=55; Audio8.sfx('bossRoar'); vib(VIB.boss);}\n    }\n  }else if(b.state==='swoop'){\n    const k=1-b.phaseT/70;\n    b.x=b.sx+(b.tx-b.sx)*k; b.y=b.sy+(b.ty-b.sy)*k+Math.sin(k*Math.PI)*30;\n    if(b.phaseT<=0){b.state='return'; b.phaseT=50;}\n  }else if(b.state==='return'){\n    const k=1-b.phaseT/50;\n    b.x=b.tx+(b.homeX-b.tx)*k;\n    b.y=b.ty+(b.baseY-b.ty)*k;\n    if(b.phaseT<=0){b.state='wait'; b.phaseT=irnd(50,110);}\n  }else if(b.state==='spit'){\n    if(b.phaseT===30||b.phaseT===18||b.phaseT===6){\n      const a=Math.atan2((p.y+p.h/2)-(b.y+30),(p.x+p.w/2)-(b.x+32));\n      const s=2.4;\n      G.shots.push({x:b.x+32,y:b.y+30,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,acid:true});\n      Audio8.sfx('shoot');\n    }\n    if(b.phaseT<=0){b.state='wait'; b.phaseT=irnd(60,120);}\n  }else if(b.state==='summon'){\n    if(b.phaseT===30&&G.enemies.filter(e=>!e.gone&&e.type==='ant').length<3){\n      const ex=b.x+(Math.random()<.5?-30:70);\n      G.enemies.push({type:'ant',x:ex,y:150,w:12,h:8,vx:.5,dir:ex<b.x?-1:1,t:0,hp:1,dead:0,vy:0});\n    }\n    if(b.phaseT<=0){b.state='wait'; b.phaseT=irnd(70,130);}\n  }\n  // non sprofondare mai nel terreno dell'arena\n  if(b.y>106)b.y=106;\n  // Top collision uses the previous bottom, so a fast landing is not missed.\n  const head={x:b.x+8,y:b.y+6,w:48,h:60};\n  if(!p.dead&&overlap(p,head)){\n    if(p.vy>0&&p.y+p.h-p.vy<=head.y+8&&b.hitCd<=0){hitBoss(G,b);p.y=head.y-p.h-1;p.vy=p.jumpV*.72;p.invuln=Math.max(p.invuln,18);}\n    else if(p.invuln<=0)hurtPlayer(G);\n  }\n}\n\nfunction hitBoss(G,b){\n  if(b.hitCd>0||b.hp<=0)return;\n  const followup=b.stun>0;b.hitCd=followup?b.stun+20:25;if(!followup)b.stun=110;b.state='stunned';\n  b.hp--; b.flash=8; Audio8.sfx('bossHit'); vib(VIB.boss);\n  addScore(G,300,b.x+32,b.y+20);\n  burst(G,b.x+32,b.y+20,'#b7ffd3',12);\n  if(b.hp===5){Audio8.sfx('bossRoar');}\n  if(b.hp<=0){addScore(G,3000,b.x+32,b.y); Audio8.play('ending');}\n}\n\n/* ---------- particelle e punteggi fluttuanti ---------- */\nfunction burst(G,x,y,color,n){\n  for(let i=0;i<n;i++)G.parts.push({x,y,vx:rnd(-2,2),vy:rnd(-3,.5),life:rnd(20,45),color});\n}\nfunction addScore(G,pts,x,y){\n  G.score+=pts;\n  if(x!==undefined)G.floats.push({x,y,txt:'+'+pts,life:50,color:pts>=1000?'#ffd34d':'#fff'});\n}\nfunction updParts(G){\n  G.parts=G.parts.filter(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=.08;return --pt.life>0;});\n  G.floats=G.floats.filter(f=>{f.y-=.6;return --f.life>0;});\n}\n\n/* ---------- danno al giocatore ---------- */\nfunction hurtPlayer(G){\n  const p=G.player;\n  if(p.invuln>0||p.dead)return;\n  if(G.goldT>0){return;} // crocchetta d'oro: invincibile\n  G.lives--;\n  Audio8.sfx('hit'); vib(VIB.hit);\n  burst(G,p.x+5,p.y+5,'#ff5d7a',12);\n  if(G.lives<0){G.lives=0;}\n  p.invuln=100; p.vy=-3.4; p.vx=-p.dir*2;\n  G.shake=8;\n  if(G.lives<=0){p.dead=1; G.deathT=0; Audio8.sfx('die'); vib(VIB.die);}\n}\nfunction killBySkull(G){\n  const p=G.player;\n  if(p.invuln>0||p.dead||G.goldT>0)return;\n  G.lives=Math.max(0,G.lives-1);\n  Audio8.sfx('skull'); vib(VIB.skull);\n  burst(G,p.x+5,p.y+5,'#e8e6f2',14);\n  G.shake=12;\n  if(G.lives<=0){p.dead=1; G.deathT=0; Audio8.sfx('die'); vib(VIB.die);}\n  else{p.invuln=120; respawnAtCheckpoint(G);}\n}\nfunction respawnAtCheckpoint(G){\n  const p=G.player, cp=G.checkpoint;\n  p.x=cp.x; p.y=cp.y; p.vx=0; p.vy=0; p.climbing=false;\n  p.ground=false; p.coyote=0; p.jbuf=0;\n  G.camX=clamp(p.x-W/2,0,G.lv.w*TILE-W);\n}\n\n/* ============================================================\n   GAME — stato globale e caricamento livelli\n   ============================================================ */\nconst Game={\n  state:'title', lvIdx:0, lv:null, player:null,\n  enemies:[], items:[], shots:[], parts:[], floats:[],\n  checkpoint:{x:32,y:32}, score:0, lives:3, kib:0, goldT:0,\n  camX:0, shake:0, time:0, boss:null, bossDown:false, deathT:0,\n  muted:false, records:[], selIdx:0, cineT:0, cineF:0,\n  scoreShown:0, nameChars:[0,0,0], namePos:0, rank:-1, endT:0, scoreInitials:null,\n  credT:0, creditsDone:false, creditsHold:0, creditsFrom:'scores',\n  visited:new Set(),secretsFound:0, levelStartScore:0, paused:false, endReason:'',\n  toggleMute(){this.muted=!this.muted; Audio8.resume(); Audio8.setMuted(this.muted);},\n  toggleFull(){\n    const w=document.getElementById('wrap');\n    const pseudo=()=>{if(w){w.classList.add('pseudoFS'); fit();}};\n    try{\n      if(document.fullscreenElement){document.exitFullscreen(); return;}\n      if(w&&w.classList.contains('pseudoFS')){w.classList.remove('pseudoFS'); fit(); return;}\n      if(!document.fullscreenEnabled){pseudo(); return;}\n      const p=document.documentElement.requestFullscreen();\n      if(p&&p.catch)p.catch(pseudo);\n    }catch(e){pseudo();}\n  },\n  loadRecords(){\n    try{const ad=window.__LC_REC__; if(ad){const r=ad.load(); if(Array.isArray(r)){this.records=r; return;}}}catch(e){}\n    try{const r=sget('lilliCosmoRecords'); this.records=r?JSON.parse(r):[];}catch(e){this.records=[];}\n    if(!Array.isArray(this.records))this.records=[];\n  },\n  saveRecords(){const recs=this.records.slice(0,10); sset('lilliCosmoRecords',JSON.stringify(recs));\n    try{const ad=window.__LC_REC__; if(ad)ad.save(recs);}catch(e){}},\n  qualifies(){return this.records.length<10||this.score>(this.records[this.records.length-1].score||0);},\n  insertRecord(){\n    const name=this.nameChars.map(i=>LC_CHS[i]).join('');\n    this.scoreInitials=name;\n    if(!this.qualifies()) {this.rank=-1;return;}\n    this.records.push({name,score:this.score});\n    this.records.sort((a,b)=>b.score-a.score);\n    this.records=this.records.slice(0,10);\n    this.rank=this.records.findIndex(r=>r.name===name&&r.score===this.score);\n    this.saveRecords();\n  },\n  startLevel(idx,keepScore){\n    this.lvIdx=idx;if(idx===0&&!keepScore){this.rank=-1;this.scoreInitials=null;}\n    const src=LEVELS[idx];\n    // copia la griglia (i blocchi fragili si rompono)\n    const map=src.map.map(r=>r.slice());\n    this.lv={w:src.w,h:src.h,map,theme:src.theme,name:src.name,sub:src.sub,song:src.song,boss:src.boss,tip:src.tip,arenaX:src.arenaX};\n    this.enemies=[]; this.items=[]; this.shots=[]; this.parts=[]; this.floats=[];\n    this.boss=null; this.bossDown=false; this.bossAwake=false; this.goldT=0; this.paused=false; this.deathT=0;\n    let sx=2*TILE, sy=10*TILE;\n    for(let y=0;y<src.h;y++)for(let x=0;x<src.w;x++){\n      const ch=map[y][x];\n      if(ch==='S'){sx=x*TILE+2; sy=y*TILE; map[y][x]=' ';}\n      else if(ch==='k'||ch==='g'||ch==='h'){this.items.push({type:ch,x:x*TILE+4,y:y*TILE+4,t:rnd(9)}); map[y][x]=' ';}\n      else if(ch==='a'||ch==='u'||ch==='v'||ch==='m'||ch==='s'){const e=newEnemy(ch,x,y); if(e)this.enemies.push(e); map[y][x]=' ';}\n      else if(ch==='E'){map[y][x]=' ';this.items.push({type:'E',x:x*TILE,y:y*TILE,t:0,id:idx+':'+x});}\n      else if(ch==='X'){map[y][x]=' '; this.items.push({type:'X',x:x*TILE,y:y*TILE,t:0,lit:false});}\n      else if(ch==='Z'){map[y][x]=' '; this.items.push({type:'Z',x:x*TILE-4,y:y*TILE-16,t:0});}\n      else if(ch==='B'){map[y][x]=' '; this.boss=newBoss(x,y);}\n      else if(ch==='Q'){map[y][x]=' '; this.items.push({type:'Q',x:x*TILE-4,y:y*TILE-4,t:0});}\n    }\n    if(!keepScore){this.score=0; this.lives=3; this.kib=0;}\n    this.levelStartScore=this.score;\n    if(!this.player)this.player=newPlayer(this.selIdx===0?'lilli':'cosmo');\n    const p=this.player;\n    p.x=sx; p.y=sy; p.vx=0; p.vy=0; p.dead=0; p.invuln=0; p.climbing=false;\n    this.checkpoint={x:sx,y:sy};\n    for(const e of this.enemies){let n=0;while(n++<14&&(solidAt(this.lv,e.x+1,e.y+e.h-1)||solidAt(this.lv,e.x+e.w-1,e.y+e.h-1)))e.y-=16;}\n    this.camX=clamp(p.x-W/2,0,this.lv.w*TILE-W);\n    Audio8.play(this.lv.song);\n  },\n  breakTile(tx,ty){\n    const lv=this.lv;\n    if(tileAt(lv,tx,ty)==='b'){\n      lv.map[ty][tx]=' ';\n      Audio8.sfx('scratch'); vib(VIB.scratch);\n      burst(this,tx*TILE+8,ty*TILE+8,'#8a7ab8',10);\n      addScore(this,50,tx*TILE,ty*TILE);\n      return true;\n    }\n    return false;\n  },\n  secretChime(x,y){\n    Audio8.sfx('secret'); vib(VIB.secret);\n    this.floats.push({x,y,txt:'SECRET!',life:70,color:'#7ae0d0'});\n    addScore(this,500);\n    this.secretsFound++;\n  }\n};\nGame.loadRecords();\n\n/* ============================================================\n   UPDATE — gameplay\n   ============================================================ */\nfunction updPlayer(G){\n  const p=G.player, lv=G.lv;\n  if(p.dead){\n    G.deathT++;\n    p.vy=Math.min(p.vy+GRAV,MAXFALL); p.y+=p.vy;\n    if(G.deathT>110){G.state='gameover';G.endReason='gameover'; G.endT=0; Audio8.play('title');}\n    return;\n  }\n  if(p.invuln>0)p.invuln--;\n  if(p.atkCd>0)p.atkCd--;\n  if(p.atkT>0)p.atkT--;\n  if(p.slowT>0)p.slowT--;\n  if(G.goldT>0)G.goldT--;\n  const vine=onVine(lv,p);\n  // arrampicata\n  if(vine&&(Input.up||Input.down)&&!p.ground||vine&&Input.up){\n    if(!p.climbing&&vine&&(Input.up||Input.down)){p.climbing=true; p.vy=0;}\n  }\n  if(p.climbing){\n    if(!vine){p.climbing=false;}\n    else{\n      p.vy=Input.up?-1.5:(Input.down?1.5:0);\n      p.vx=(Input.right?1:(Input.left?-1:0))*.9;\n      if(p.vy!==0&&G.time%18===0)Audio8.sfx('climb');\n      if(Input.jumpEdge){p.climbing=false; p.vy=p.jumpV*.85; Audio8.sfx('jump'); vib(VIB.jump);}\n    }\n  }\n  if(!p.climbing){\n    // corsa con accelerazione\n    const slowF=p.slowT>0?.55:1, acc=(p.ground?.32:.22)*slowF, max=p.speed*(G.goldT>0?1.35:1)*slowF;\n    let target=0;\n    if(Input.left)target=-max; if(Input.right)target=max;\n    if(Input.ax){target=clamp(Input.ax,-1,1)*max;}\n    if(target!==0){p.vx+=clamp(target-p.vx,-acc,acc); p.dir=target<0?-1:1;}\n    else{p.vx*=p.ground?.78:.94; if(Math.abs(p.vx)<.05)p.vx=0;}\n    // salto con coyote time e buffer\n    if(p.ground)p.coyote=7; else if(p.coyote>0)p.coyote--;\n    if(Input.jumpEdge)p.jbuf=7; else if(p.jbuf>0)p.jbuf--;\n    if(p.jbuf>0&&p.coyote>0){\n      p.vy=p.jumpV*(p.slowT>0?.9:1); p.jbuf=0; p.coyote=0;\n      Audio8.sfx('jump'); vib(VIB.jump);\n      burst(G,p.x+5,p.y+11,'#8f8ab8',4);\n    }\n    if(!Input.jump&&p.vy<-2)p.vy*=.9;   // salto variabile\n    p.vy=Math.min(p.vy+GRAV,MAXFALL);\n  }\n  const wasGround=p.ground;\n  p.hitWall=false;\n  moveBody(lv,p);\n  if(p.ground&&!wasGround){Audio8.sfx('land'); burst(G,p.x+5,p.y+11,'#cfc8ee',5);}\n  if(p.ground&&Math.abs(p.vx)>1.2&&G.time%9===0)burst(G,p.x+5,p.y+11,'#cfc8ee',1);\n  // MELMA: malus che rallenta i movimenti per pochi secondi (nessun danno)\n  if(p.ground){\n    const fy=Math.floor((p.y+p.h-1)/TILE);\n    const f1=tileAt(lv,Math.floor((p.x+2)/TILE),fy), f2=tileAt(lv,Math.floor((p.x+p.w-2)/TILE),fy);\n    if(f1==='q'||f2==='q'){\n      if(p.slowT<=0){G.floats.push({x:p.x,y:p.y-14,txt:'SLOWED!',life:60,color:'#c99df5'}); Audio8.sfx('skull');}\n      p.slowT=Math.max(p.slowT,60);\n      if(G.time%8===0)burst(G,p.x+5,p.y+11,'#8b5cff',1);\n    }\n  }\n  // caduta nel vuoto: costa una vita; con vite residue si riparte dall'ultimo checkpoint, altrimenti game over\n  if(p.y+p.h>=lv.h*TILE){\n    if(!p.dead){\n      G.lives=Math.max(0,G.lives-1);\n      G.shake=10;\n      if(G.lives<=0){p.dead=1; G.deathT=0; Audio8.sfx('die'); vib(VIB.die);}\n      else{\n        Audio8.sfx('hit'); vib(VIB.hit);\n        respawnAtCheckpoint(G); p.invuln=90;\n        G.floats.push({x:p.x,y:p.y-14,txt:'FELL! -1 LIFE',life:60,color:'#ffb0c0'});\n      }\n    }\n    return;\n  }\n  // graffio\n  if(Input.atkEdge&&p.atkCd<=0){\n    p.atkT=12; p.atkCd=24;\n    Audio8.sfx('scratch'); vib(VIB.scratch);\n    // colpisce nemici davanti\n    const hb={x:p.dir>0?p.x+p.w:p.x-13,y:p.y-3,w:13,h:15};\n    G.enemies.forEach(e=>{if(!e.gone&&e.dead<=0&&overlap(e.turnT?{x:hb.x-5,y:hb.y-3,w:hb.w+10,h:hb.h+6}:hb,enemyBox(e)))killEnemy(G,e,true);});\n    if(G.boss&&!G.boss.gone&&G.boss.hp>0){\n      const b=G.boss;\n      if(overlap(hb,{x:b.x+4,y:b.y+4,w:56,h:62}))hitBoss(G,b);\n    }\n    // rompe blocchi fragili in un'area davanti al gatto\n    const x0=p.dir>0?p.x+p.w-2:p.x-22, x1=p.dir>0?p.x+p.w+22:p.x+2;\n    const y0=p.y-16, y1=p.y+p.h+10;\n    for(let ty=Math.floor(y0/TILE);ty<=Math.floor(y1/TILE);ty++)\n      for(let tx=Math.floor(x0/TILE);tx<=Math.floor(x1/TILE);tx++)\n        G.breakTile(tx,ty);\n  }\n  p.animT+=1/60*(Math.abs(p.vx)>.3?1.6:1);\n}\nfunction updItems(G){\n  const p=G.player, lv=G.lv;\n  for(const it of G.items){\n    it.t+=1/60;\n    if(it.taken)continue;\n    const box={x:it.x-2,y:it.y-2,w:12,h:12};\n    const pb={x:p.x,y:p.y,w:p.w,h:p.h};\n    if(it.type==='k'||it.type==='g'||it.type==='h'){\n      if(!p.dead&&overlap(pb,box)){\n        it.taken=true;\n        if(it.type==='k'){G.kib++; addScore(G,100,it.x,it.y); Audio8.sfx('kibble'); vib(VIB.kibble); burst(G,it.x+3,it.y+3,'#c89258',6);}\n        if(it.type==='g'){G.goldT=60*7; addScore(G,400,it.x,it.y); Audio8.sfx('gold'); vib(VIB.gold); burst(G,it.x+3,it.y+3,'#ffd34d',14);}\n        if(it.type==='h'){G.lives=Math.max(G.lives,Math.min(8,G.lives+1)); addScore(G,250,it.x,it.y); Audio8.sfx('heart'); vib(VIB.heart); burst(G,it.x+3,it.y+3,'#ff5da2',12);}\n      }\n    }else if(it.type==='E'){\n      if(!p.dead&&overlap(pb,{x:it.x-2,y:it.y-6,w:22,h:24})&&!G.visited.has(it.id)){G.visited.add(it.id);startSecret(G,it.id);return;}\n    }else if(it.type==='X'){\n      if(!it.lit&&Math.abs(p.x-it.x)<20&&Math.abs(p.y-it.y)<24){\n        it.lit=true; G.checkpoint={x:it.x,y:it.y-8}; G.savedCp={lv:G.lvIdx,x:it.x,y:it.y-8};\n        Audio8.sfx('checkpoint'); vib(VIB.kibble);\n        G.floats.push({x:it.x-20,y:it.y-14,txt:'CHECKPOINT',life:60,color:'#7ae0d0'});\n      }\n    }else if(it.type==='Z'){\n      if(!p.dead&&overlap(pb,{x:it.x,y:it.y,w:24,h:32})){\n        G.state='leveldone'; G.endT=0; G.scoreShown=G.levelStartScore;\n        Audio8.sfx('portal'); vib(VIB.win);\n      }\n    }else if(it.type==='Q'){\n      if(G.bossDown&&!p.dead&&Math.abs(p.x-it.x)<26&&Math.abs(p.y-it.y)<30){\n        G.state='ending';G.endReason='win'; G.endT=0; Audio8.play('ending'); Audio8.sfx('cage'); vib(VIB.win);\n      }\n    }\n  }\n  // pareti false: rivela segreto quando ci passi dentro (con pausa)\n  if(!p.dead){\n    const cx=Math.floor((p.x+p.w/2)/TILE), cy=Math.floor((p.y+p.h/2)/TILE);\n    let near=false;\n    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){\n      if(tileAt(lv,cx+dx,cy+dy)==='F')near=true;\n    }\n    if(near&&G.time-(G.lastSecretT||-999)>120){\n      G.lastSecretT=G.time;const id=G.lvIdx+':hidden';if(!G.visited.has(id)){G.visited.add(id);startSecret(G,id);return;}\n    }\n  }\n}\nfunction updShots(G){\n  const p=G.player;\n  G.shots=G.shots.filter(s=>{\n    s.t++; s.x+=s.vx; s.y+=(s.vy||0);\n    if(solidAt(G.lv,s.x,s.y)){burst(G,s.x,s.y,'#8ff',4); return false;}\n    if(s.t>240)return false;\n    if(!p.dead&&p.invuln<=0&&G.goldT<=0&&overlap({x:p.x,y:p.y,w:p.w,h:p.h},{x:s.x-2,y:s.y-2,w:5,h:5})){\n      hurtPlayer(G); return false;\n    }\n    return true;\n  });\n}\nfunction updEnemies(G){\n  const p=G.player;\n  for(const e of G.enemies){\n    updEnemy(G,e);\n    if(e.gone||p.dead)continue;\n    if(e.type==='skull'){\n      if(p.invuln<=0&&G.goldT<=0&&overlap({x:p.x,y:p.y,w:p.w,h:p.h},e)){killBySkull(G);}\n      continue;\n    }\n    if(e.dead>0)continue;\n    const pb={x:p.x,y:p.y,w:p.w,h:p.h};\n    if(overlap(pb,enemyBox(e))){\n      // salto in testa\n      if(p.vy>1&&p.y+p.h-e.y<7){\n        killEnemy(G,e,false); p.vy=p.jumpV*.55;\n        Audio8.sfx('stomp');\n      }else if(G.goldT>0){\n        killEnemy(G,e,true);\n      }else if(!e.turnT){\n        hurtPlayer(G);\n      }\n    }\n  }\n  G.enemies=G.enemies.filter(e=>!e.gone||e.dead>0);\n}\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nconst stars=[]; for(let i=0;i<90;i++)stars.push({x:rnd(W*2),y:rnd(H*.7),s:rnd(1)>.8?2:1,tw:rnd(9)});\nfunction renderBG(g,th,camX,t,lvW,lvIdx){\n  const grd=g.createLinearGradient(0,0,0,H);\n  grd.addColorStop(0,th.skyTop); grd.addColorStop(1,th.skyBot);\n  g.fillStyle=grd; g.fillRect(0,0,W,H);\n  // stelle\n  g.fillStyle='#fff';\n  for(const s of stars){\n    const sx=(s.x-camX*.1)%(W+20), sy=s.y;\n    const x=sx<0?sx+W+20:sx;\n    g.globalAlpha=th.starA*(0.5+0.5*Math.sin(t*2+s.tw));\n    g.fillRect(x,sy,s.s,s.s);\n  }\n  g.globalAlpha=1;\n  // stella cadente ogni tanto\n  const shoot=t%9;\n  if(shoot<0.9){\n    const sx2=W-40-shoot*260, sy2=18+shoot*40;\n    g.strokeStyle='rgba(255,255,255,'+(0.8-shoot*0.8)+')'; g.lineWidth=1;\n    g.beginPath(); g.moveTo(sx2,sy2); g.lineTo(sx2+14,sy2-5); g.stroke();\n  }\n  // alone luminoso + pianeta e lune\n  const glow=(cx,cy,r,c)=>{\n    const rg=g.createRadialGradient(cx,cy,r*.4,cx,cy,r*2.3);\n    rg.addColorStop(0,c); rg.addColorStop(1,'rgba(0,0,0,0)');\n    g.fillStyle=rg; g.fillRect(cx-r*2.3,cy-r*2.3,r*4.6,r*4.6);\n  };\n  if(th.planet){g.globalAlpha=.5; glow(th.planet.x-camX*.15,th.planet.y,th.planet.r,th.planet.body); g.globalAlpha=1;\n    drawPlanet(g,th.planet.x-camX*.15,th.planet.y,th.planet.r,th.planet.body,th.planet.ring);}\n  for(const m of (th.moons||[])){\n    g.globalAlpha=.4; glow(m.x-camX*.12,m.y,m.r,m.c); g.globalAlpha=1;\n    g.fillStyle=m.c; g.beginPath(); g.arc(m.x-camX*.12,m.y,m.r,0,Math.PI*2); g.fill();\n  }\n  // colline parallasse (3 strati)\n  for(let i=0;i<3;i++){\n    g.fillStyle=th.hills[i%th.hills.length];\n    if(i===2)g.globalAlpha=.55;\n    const par=.22+i*.22, off=camX*par;\n    g.beginPath(); g.moveTo(0,H);\n    for(let x=0;x<=W;x+=8){\n      const wx=x+off;\n      const y=H-30-i*18-18*Math.abs(Math.sin(wx*.011+i*2))-8*Math.sin(wx*.031+i);\n      g.lineTo(x,y);\n    }\n    g.lineTo(W,H); g.closePath(); g.fill();\n    g.strokeStyle='rgba(255,255,255,'+(i===2?.05:.10)+')'; g.lineWidth=.75; g.stroke(); // profilo luminoso\n    g.globalAlpha=1;\n  }\n  // strati silhouette 16 bit (parallasse)\n  const li=(lvIdx===undefined?0:lvIdx)+1;\n  const farS=ART['bg'+li+'_far'], nearS=ART['bg'+li+'_near'];\n  if(artOK(farS)){const off=(camX*.3)%512;\n    for(let k=-1;k<=1;k++)g.drawImage(farS,k*512-off,H-158,512,120);}\n  if(artOK(nearS)){const off=(camX*.55)%512;\n    for(let k=-1;k<=1;k++)g.drawImage(nearS,k*512-off,H-158,512,120);}\n  // lucciole/spore luminose alla notte\n  if(th.flies){\n    for(let i=0;i<10;i++){\n      const fx=(i*53+t*9+Math.sin(t*.7+i)*14-camX*.5)%(W+30), fy=120+((i*37)%50)+Math.sin(t*1.3+i*2)*8;\n      const fx2=fx<0?fx+W+30:fx;\n      g.globalAlpha=.35+.35*Math.sin(t*3+i*1.7);\n      g.fillStyle=th.flies; g.fillRect(fx2,fy,2,2);\n    }\n    g.globalAlpha=1;\n  }\n  // nebbia\n  g.fillStyle=th.fog; g.fillRect(0,H-70,W,70);\n}\nfunction renderMap(g,G){\n  const lv=G.lv, cam=G.camX, t=G.time/60;\n  TILEROW=G.lvIdx;\n  const x0=Math.max(0,Math.floor(cam/TILE)-1), x1=Math.min(lv.w-1,x0+27);\n  g.save(); g.translate(-Math.round(cam*2)/2,0);\n  for(let y=0;y<lv.h;y++)for(let x=x0;x<=x1;x++){\n    let ch=lv.map[y][x];\n    if(ch===' ')continue;\n    if(ch==='F')ch='R';                 // parete falsa = identica alla roccia\n    if(ch==='b'){                       // fragile: roccia con crepa\n      drawTile(g,'R',x,y,lv,t);\n      g.fillStyle='rgba(0,0,0,.5)';\n      g.fillRect(x*TILE+4,y*TILE+3,2,10); g.fillRect(x*TILE+6,y*TILE+7,4,2);\n      continue;\n    }\n    drawTile(g,ch,x,y,lv,t);\n  }\n  g.restore();\n}\nfunction inMantisArena(G){return !!(G.lv&&G.lv.boss&&G.player&&G.player.x>=G.lv.arenaX);}\nfunction renderEntities(g,G){\n  const cam=G.camX, t=G.time/60;\n  for(const it of G.items){\n    if(it.taken)continue;\n    const x=it.x-cam, y=it.y;\n    if(x<-40||x>W+40)continue;\n    if(it.type==='E'){\n      g.fillStyle='#1d1238';g.fillRect(x-3,y-7,22,25);g.strokeStyle='#ffce61';g.strokeRect(x-3,y-7,22,25);ptext(g,'?',x+8,y,'#fff4a0',2,true);\n    }else if(it.type==='X'){\n      g.fillStyle=it.lit?'#7ae0d0':'#5a5078';\n      g.save(); g.translate(x+8,y+8); g.rotate(Math.PI/4);\n      g.fillRect(-5,-5,10,10); g.restore();\n      g.fillStyle='#fff'; g.globalAlpha=.5+.5*Math.sin(t*4); g.fillRect(x+7,y+2,2,3); g.globalAlpha=1;\n    }else if(it.type==='Z'){\n      // portale: arco luminoso\n      const pu=.5+.5*Math.sin(t*5);\n      g.fillStyle='#3a2f6a'; g.fillRect(x-2,y+26,28,6);\n      g.fillStyle='#8f7ae0'; g.fillRect(x,y+4,4,26); g.fillRect(x+20,y+4,4,26); g.fillRect(x,y,24,5);\n      g.fillStyle=`rgba(122,224,208,${.35+.3*pu})`; g.fillRect(x+4,y+5,16,25);\n      g.fillStyle='#fff'; g.fillRect(x+6+((t*40)%12|0),y+8+((t*23)%18|0),1,1);\n    }else if(it.type==='Q'){\n      drawCage2(g,x,y,t,otherCatInfo(G.player.cat));\n    }else drawKibble(g,x,y,it.t*4,it.type==='g'?'gold':it.type==='h'?'heart':'k');\n  }\n  for(const e of G.enemies){\n    const x=e.x-cam; if(x<-40||x>W+40)continue;\n    if(e.gone){if(e.dead>0){g.globalAlpha=e.dead/30; burstDraw(g,e,x); g.globalAlpha=1;} continue;}\n    if(e.type==='ant'){if(!e.hitCd||G.time%4<2)drawAnt(g,x,e.y,e.t,e.armored?'helmet':e.variant,e.dir,e.turnT);if(e.variant==='queen')ptext(g,String(e.hp),x+8,e.y-17,'#f0c4ff',1,true);}\n    else if(e.type==='mouse')drawMouse(g,x,e.y,e.t,e.dir,e.shotCd<40,e.turnT);\n    else if(e.type==='skull')drawSkull(g,x,e.y,e.t);\n  }\n  function burstDraw(){}\n  for(const s of G.shots){\n    g.fillStyle=s.acid?'#a0ff60':'#8ff';\n    g.fillRect(s.x-cam-2,s.y-2,5,3); g.fillStyle='#fff'; g.fillRect(s.x-cam-1,s.y-1,2,1);\n  }\n  if(G.boss&&!G.boss.gone){\n    const b=G.boss;\n    if(b.state!=='dying'||b.dieT%4<2)drawMantis(g,b.x-cam,b.y,b.t,b);if(b.stun>0){ptext(g,'* * *',b.x-cam+32,b.y-8,'#ffd34d',1,true);ptext(g,'STUNNED!',b.x-cam+32,b.y-18,'#fff',1,true);}\n    // The health bar follows current arena occupancy, not the wake-up latch.\n    if(inMantisArena(G)){\n    g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(W/2-60,8,120,7);\n    g.fillStyle='#ff4d6d'; g.fillRect(W/2-58,10,116*(b.hp/b.maxhp),3);\n    ptext(g,'MANTIS QUEEN',W/2,18,'#ffb0c0',1,true);\n    }\n  }\n  // giocatore\n  const p=G.player;\n  if(!p.dead||G.deathT<40){\n    const blink=p.invuln>0&&(G.time%8<4);\n    if(!blink){\n      let frame='stand';\n      if(p.climbing)frame='climb';\n      else if(p.atkT>0)frame='scratch';\n      else if(!p.ground)frame='jump';\n      else if(Math.abs(p.vx)>.3)frame='run';\n      drawCat(g,p.x-cam-1,p.y-1,{frame,t:p.animT},{spot:p.spot,dir:p.dir,bow:p.bow,slow:p.slowT>0});\n      if(p.atkT>0){ // graffio stile trilogia: tre sferzate diagonali che si estendono\n        const prog=1-p.atkT/12, gold=G.goldT>0;\n        const cols=gold?['#ffcf7a','#ff9d4d','#ffcf7a']:['#ffffff','#ffe14d','#ffffff'];\n        const bx=p.x-cam+(p.dir>0?13:-4), by=p.y+2;\n        for(let i=0;i<3;i++){\n          const pr=Math.max(0,Math.min(1,prog*1.9-i*.2)); if(pr<=0)continue;\n          g.globalAlpha=prog>.78?Math.max(0,(1-prog)/.22):1;\n          g.fillStyle=cols[i];\n          const len=Math.round(7*pr);\n          for(let s2=0;s2<len;s2++)g.fillRect(bx+p.dir*s2*3,by+i*4+s2*2,3,3);\n        }\n        g.globalAlpha=1;\n      }\n      if(G.goldT>0){ // alone dorato\n        g.strokeStyle=`rgba(255,211,77,${.4+.3*Math.sin(t*8)})`;\n        g.strokeRect(p.x-cam-3,p.y-3,17,15);\n      }\n    }\n  }\n  for(const pt of G.parts){g.globalAlpha=Math.min(1,pt.life/20); g.fillStyle=pt.color; g.fillRect(pt.x-cam,pt.y,2,2); g.globalAlpha=1;}\n  for(const f of G.floats){g.globalAlpha=Math.min(1,f.life/30); ptext(g,f.txt,f.x-cam,f.y,f.color,1,true); g.globalAlpha=1;}\n}\n\nfunction renderHUD(g,G){\n  // cuori\n  for(let i=0;i<G.lives;i++)drawKibble(g,6+i*10,5,0,'heart');\n  // crocchette\n  drawKibble(g,6,16,0,'k'); ptext(g,'X'+G.kib,16,17,'#ffd9a0',1);\n  // indicatore melma (malus rallentamento)\n  const pl=G.player;\n  if(pl&&pl.slowT>0){\n    g.fillStyle='rgba(20,10,40,.65)'; g.fillRect(4,25,54,10);\n    ptext(g,'SLOWED',7,28,'#c99df5',1);\n    g.fillStyle='#4a2a72'; g.fillRect(28,29,22,3);\n    g.fillStyle='#c99df5'; g.fillRect(28,29,22*(pl.slowT/60),3);\n  }\n  // punteggio (allineato a destra): area HUD separata dalla striscia pulsanti.\n  // hudTop misura in pixel di canvas il bordo inferiore reale dei pulsanti,\n  // cosi' il testo non li copre mai a nessuna risoluzione o modo schermo.\n  const sc=String(G.score).padStart(6,'0');\n  let hudTop=6;\n  const bf=document.getElementById('btnFull');\n  if(bf){\n    const cr=canvas.getBoundingClientRect(), br=bf.getBoundingClientRect();\n    if(br.width>0&&cr.height>0)hudTop=Math.max(hudTop,Math.ceil((br.bottom-cr.top)/cr.height*H)+4);\n  }\n  const touchHud=(('ontouchstart'in window)||navigator.maxTouchPoints>0);\n  if(touchHud){ // su mobile la fila di pulsanti occupa l'angolo in alto a destra: HUD al centro\n    ptext(g,sc,W/2,hudTop,'#fff',1,true);\n    ptext(g,G.lv.name,W/2,hudTop+10,'#8f8ab8',1,true);\n  }else{\n    ptext(g,sc,W-16-sc.length*4,hudTop,'#fff',1);\n    ptext(g,G.lv.name,W-16-G.lv.name.length*4,hudTop+10,'#8f8ab8',1);\n  }\n  if(G.goldT>0){\n    g.fillStyle='rgba(255,211,77,.3)'; g.fillRect(W/2-30,26,60,4);\n    g.fillStyle='#ffd34d'; g.fillRect(W/2-30,26,60*(G.goldT/(60*7)),4);\n  }\n  // suggerimento orientamento su touch in verticale\n  if(('ontouchstart'in window)&&innerHeight>innerWidth*1.15){\n    g.fillStyle='rgba(5,3,15,.62)'; g.fillRect(0,H/2-17,W,34);
